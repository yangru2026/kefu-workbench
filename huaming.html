<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花名速查</title>
<style>
  :root{ --primary:#10b981; --primary-dark:#059669; --primary-light:rgba(16,185,119,.1);
         --text:#1e293b; --muted:#64748b; --border:#e2e8f0; --bg:#f7f9f8;
         --dz:#c2410c; --dz-bg:#fff7f0; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
  .toolbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--border);
           padding:12px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .search{flex:1;min-width:200px;position:relative;}
  .search input{width:100%;padding:9px 12px 9px 34px;border:1.5px solid var(--border);border-radius:9px;
                font-size:14px;font-family:inherit;outline:none;transition:border .15s;background:var(--bg);}
  .search input:focus{border-color:var(--primary);background:#fff;}
  .search .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;}
  .chip{padding:7px 15px;border-radius:18px;border:1.5px solid var(--border);background:#fff;
        font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;}
  .chip:hover{border-color:var(--primary);color:var(--primary-dark);}
  .chip.on{background:var(--primary);border-color:var(--primary);color:#fff;}
  .chip.dz.on{background:var(--dz);border-color:var(--dz);}
  .cnt{font-size:12px;color:var(--muted);white-space:nowrap;}
  .wrap{width:100%;max-width:1080px;margin:0 auto;padding:14px 16px 50px;flex:1;}
  .legend{font-size:12px;color:var(--muted);margin:0 2px 10px;}
  .legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 4px 0 2px;vertical-align:middle;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
  .item{background:#fff;border:1px solid var(--border);border-radius:9px;padding:8px 12px;
        font-size:14px;font-weight:600;word-break:break-all;line-height:1.4;transition:all .12s;}
  .item:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(16,185,119,.12);}
  .item.dz{background:var(--dz-bg);border-color:#fed7aa;color:var(--dz);}
  .item.dz:hover{border-color:#fb923c;box-shadow:0 2px 8px rgba(249,115,22,.18);}
  .empty{grid-column:1/-1;text-align:center;padding:44px 0;color:var(--muted);font-size:14px;}
  .foot{text-align:center;font-size:11.5px;color:#94a3b8;padding:16px 0 0;}
  @media (max-width:560px){ .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));} }
</style>
</head>
<body>
  <div class="toolbar">
    <div class="search"><span class="ico">🔍</span><input id="q" type="text" placeholder="搜花名，如：乌托邦 · 少女漫" autocomplete="off"></div>
    <button class="chip on" data-kind="">全部</button>
    <button class="chip dz" data-kind="定轴">定轴款</button>
    <button class="chip" data-kind="普通">普通款</button>
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="wrap">
    <p class="legend"><span class="dot" style="background:#fb923c;"></span>橙色 = 定轴款（花名以 D 开头）　<span class="dot" style="background:#cbd5e1;"></span>白色 = 普通款</p>
    <div class="grid" id="grid"></div>
    <div class="foot">尤赫售前客服工作台 · 花名速查</div>
  </div>

  const grid = document.getElementById('grid');
  const qInput = document.getElementById('q');
  const cntEl = document.getElementById('cnt');
  let fKind = '';

  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function render(){
    const q = qInput.value.trim().toLowerCase();
    const list = DATA.filter(x =>
      (!fKind || x.kind === fKind) &&
      (!q || [x.name, x.color, x.series].join(' ').toLowerCase().includes(q))
    );
    cntEl.textContent = list.length + ' / ' + DATA.length;
    grid.innerHTML = list.length ? list.map(x =>
      '<div class="item ' + (x.kind === '定轴' ? 'dz' : '') + '">' + esc(x.name) + '</div>'
    ).join('') : '<div class="empty">🔍 没找到匹配的花色，换个关键词试试～</div>';
  }

  document.querySelectorAll('.chip[data-kind]').forEach(c =>
    c.addEventListener('click', () => {
      document.querySelectorAll('.chip[data-kind]').forEach(x => x.classList.remove('on'));
      c.classList.add('on');
      fKind = c.dataset.kind;
      render();
    })
  );
  qInput.addEventListener('input', render);
  render();
