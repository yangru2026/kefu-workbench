<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作表格</title>
<style>
  :root{ --primary:#10b981; --primary-dark:#059669; --primary-light:rgba(16,185,129,.1);
         --text:#1e293b; --muted:#64748b; --border:#e2e8f0; --bg:#f7f9f8; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;gap:12px;padding:14px 20px;background:#fff;
          border-bottom:1px solid var(--border);flex-wrap:wrap;position:sticky;top:0;z-index:10;}
  .topbar h1{font-size:18px;font-weight:800;letter-spacing:.5px;}
  .badge{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;background:var(--primary-light);color:var(--primary-dark);}
  .wrap{width:100%;max-width:900px;margin:0 auto;padding:26px 20px 60px;}
  .intro{color:var(--muted);font-size:13.5px;line-height:1.7;margin:0 2px 18px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;}
  .sheet-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:22px 22px 20px;
        box-shadow:0 4px 18px rgba(31,41,55,.06);display:flex;flex-direction:column;gap:10px;}
  .sheet-card .head{display:flex;align-items:center;gap:10px;}
  .sheet-card .ico{width:42px;height:42px;border-radius:12px;background:var(--primary-light);
        display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
  .sheet-card h2{font-size:16px;font-weight:800;}
  .sheet-card .tag{display:inline-block;font-size:11px;font-weight:700;color:var(--primary-dark);
        background:var(--primary-light);border-radius:20px;padding:2px 10px;margin-top:3px;}
  .sheet-card p{color:var(--muted);font-size:13px;line-height:1.75;flex:1;}
  .sheet-card p b{color:#334155;}
  .open{display:block;width:100%;padding:12px 18px;border:0;border-radius:12px;margin-top:auto;
      background:var(--primary);color:#fff;font-size:14.5px;font-weight:800;cursor:pointer;font-family:inherit;
      transition:all .16s;text-align:center;}
  .open:hover{background:var(--primary-dark);transform:translateY(-1px);}
  .open[disabled]{background:#cbd5e1;cursor:not-allowed;transform:none;}
  .note{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px 14px;font-size:12.5px;
      color:#92400e;line-height:1.7;margin-top:18px;}
  .foot{text-align:center;font-size:12px;color:#94a3b8;padding:20px 0 0;}
  @media (max-width:520px){ .grid{grid-template-columns:1fr;} .sheet-card{padding:18px 16px;} }
</style>
</head>
<body>
  <div class="topbar">
    <h1>工作表格</h1>
    <span class="badge">飞书在线文档</span>
  </div>

  <div class="wrap">
    <p class="intro">日常工作要用到的飞书表格都从这里进：点卡片上的按钮直接打开，登记、查看、传截图都在飞书里完成。</p>
    <div class="grid" id="grid"></div>

    <div class="note">
      📦 <b>历史登记记录</b>：已完整备份。
    </div>

    <div class="foot">尤赫售前客服工作台 · 工作表格</div>
  </div>

<script>
  // ⚠️ 工作相关的飞书表统一加在这里：一条 = 一张卡片，url 填完整链接（要带 ?sheet= 参数）
  const WORK_SHEETS = [
    {
      icon: '🔄',
      title: '舆情转接登记',
      tag: '每天登记',
      desc: '<b>转接原因</b>：💧 透氧问询 · 🏪 跨店正品 · 📝 反馈建议 · 💬 单句无回复',
      url: 'https://yow5cuygtx.feishu.cn/wiki/IeBRwF32Vi09Dmk1otYc4pganHg?sheet=c329af',
    },
    {
      icon: '🎨',
      title: '半年抛花色明细表',
      tag: '花色明细',
      desc: '',
      url: 'https://yow5cuygtx.feishu.cn/sheets/DWZ2sg63zh8bLetAnGpcGPtyn8g?sheet=SmiKmx',
    },
    {
      icon: '💧',
      title: '日抛花色明细表',
      tag: '花色明细',
      desc: '',
      url: 'https://yow5cuygtx.feishu.cn/sheets/MPHMslvdxhoVMjtSFSZcUOp0nTg?sheet=fGCA0I',
    },
    {
      icon: '✨',
      title: '特殊类美瞳明细表',
      tag: '花色明细',
      desc: '',
      url: 'https://yow5cuygtx.feishu.cn/sheets/KGhLsycIUhbSRHt17DPcagfHnNf?sheet=jRW9NN',
    },
  ];
  // 后续新增工作相关的飞书表：往 WORK_SHEETS 里再加一条即可，页面自动出卡片

  (function render() {
    const grid = document.getElementById('grid');
    grid.innerHTML = WORK_SHEETS.map(function (s) {
      const btn = s.url
        ? '<button class="open" data-url="' + s.url + '">打开表格 →</button>'
        : '<button class="open" disabled>链接待配置</button>';
      const head = '<div class="head"><div class="ico">' + s.icon + '</div>' +
        '<div><h2>' + s.title + '</h2>' + (s.tag ? '<span class="tag">' + s.tag + '</span>' : '') + '</div></div>';
      const desc = s.desc ? '<p>' + s.desc + '</p>' : '';
      return '<div class="sheet-card">' + head + desc + btn + '</div>';
    }).join('');
    grid.addEventListener('click', function (e) {
      const btn = e.target.closest('.open');
      if (btn && btn.dataset.url) window.open(btn.dataset.url, '_blank', 'noopener');
    });
  })();
</script>
</body>
</html>
