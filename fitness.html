<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>健身计划</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f0f0f;
  --card:#1a1a1a;
  --card2:#222;
  --accent:#00d4aa;
  --accent2:#7c3aed;
  --accent3:#f59e0b;
  --red:#ef4444;
  --blue:#3b82f6;
  --text:#f1f5f9;
  --text2:#94a3b8;
  --border:#2a2a2a;
  --green:#22c55e;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;padding-bottom:100px;
  max-width:480px;margin:0 auto;
}
/* Header */
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(15,15,15,.92);backdrop-filter:blur(12px);
  padding:16px 20px 12px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.header h1{font-size:20px;font-weight:700;letter-spacing:-.5px}
.header h1 span{color:var(--accent)}
.header .streak{
  font-size:13px;color:var(--accent);background:rgba(0,212,170,.1);
  padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:4px
}

/* Tab */
.tabs{
  display:flex;gap:4px;padding:12px 20px;
  position:sticky;top:60px;z-index:99;
  background:rgba(15,15,15,.92);backdrop-filter:blur(12px);
}
.tab{
  flex:1;text-align:center;padding:10px;border-radius:10px;
  font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;
  color:var(--text2);background:var(--card);
}
.tab.active{background:var(--accent);color:#000}

/* Section */
.section{padding:0 20px;display:none}
.section.active{display:block}

/* Day Selector */
.day-selector{display:flex;gap:6px;overflow-x:auto;padding:4px 0 16px;-webkit-overflow-scrolling:touch}
.day-selector::-webkit-scrollbar{display:none}
.day-btn{
  flex-shrink:0;min-width:52px;height:68px;border-radius:14px;
  border:none;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;
  font-size:12px;color:var(--text2);background:var(--card);
  transition:all .2s;font-family:inherit;
}
.day-btn .day-num{font-size:18px;font-weight:700}
.day-btn .day-label{font-size:10px}
.day-btn.today{border:2px solid var(--accent2)}
.day-btn.active{background:var(--accent);color:#000}
.day-btn.done{background:rgba(34,197,94,.15);color:var(--green)}
.day-btn .check{font-size:14px}

/* Exercise Card */
.ex-card{
  background:var(--card);border-radius:16px;padding:16px;
  margin-bottom:10px;border:1px solid var(--border);transition:all .15s
}
.ex-card.completed{border-color:rgba(34,197,94,.3);background:#1a221a}
.ex-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;
}
.ex-name{font-size:15px;font-weight:600}
.ex-target{font-size:12px;color:var(--text2);background:var(--card2);padding:3px 10px;border-radius:8px}

/* Set Row */
.sets-row{display:flex;flex-direction:column;gap:6px}
.set-item{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:var(--card2);border-radius:10px;transition:all .15s
}
.set-item.done{background:rgba(34,197,94,.08);opacity:.7}
.set-num{
  width:26px;height:26px;border-radius:50%;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;
  flex-shrink:0
}
.set-item.done .set-num{background:var(--green);border-color:var(--green);color:#000}
.set-inputs{display:flex;align-items:center;gap:6px;flex:1}
.set-inputs input{
  width:56px;padding:6px 8px;background:var(--bg);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:13px;text-align:center;
  font-family:inherit;outline:none
}
.set-inputs input:focus{border-color:var(--accent)}
.set-inputs label{font-size:11px;color:var(--text2);white-space:nowrap}
.set-del{
  width:24px;height:24px;border:none;background:transparent;
  color:var(--text2);cursor:pointer;font-size:14px;border-radius:6px;
  display:flex;align-items:center;justify-content:center
}
.set-del:hover{background:var(--red);color:#fff}

/* Add Set / Exercise */
.add-row{
  display:flex;gap:8px;margin-top:8px
}
.add-btn{
  flex:1;padding:8px;border-radius:8px;border:1px dashed var(--border);
  background:transparent;color:var(--text2);font-size:12px;cursor:pointer;
  transition:all .15s;font-family:inherit
}
.add-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Timer */
.timer-display{
  text-align:center;padding:40px 20px;
}
.timer-circle{
  width:200px;height:200px;border-radius:50%;margin:0 auto 20px;
  border:4px solid var(--border);display:flex;align-items:center;
  justify-content:center;position:relative
}
.timer-circle.running{border-color:var(--accent)}
.timer-circle .time{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums}
.timer-circle .label{position:absolute;bottom:28px;font-size:11px;color:var(--text2)}
.timer-presets{display:flex;gap:8px;justify-content:center;margin-bottom:20px}
.timer-preset{
  padding:8px 18px;border-radius:10px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:14px;cursor:pointer;
  transition:all .15s;font-family:inherit
}
.timer-preset.active{border-color:var(--accent);background:rgba(0,212,170,.1)}
.timer-actions{display:flex;gap:10px;justify-content:center}
.timer-btn{
  padding:12px 36px;border-radius:12px;border:none;font-size:16px;font-weight:700;
  cursor:pointer;transition:all .15s;font-family:inherit
}
.timer-btn.start{background:var(--accent);color:#000}
.timer-btn.pause{background:var(--accent2);color:#fff}
.timer-btn.reset{background:var(--card);color:var(--text);border:1px solid var(--border)}

/* History */
.history-day{
  margin-bottom:16px
}
.history-date{
  font-size:13px;color:var(--text2);margin-bottom:8px;
  display:flex;align-items:center;gap:8px
}
.history-date::after{content:'';flex:1;height:1px;background:var(--border)}
.history-item{
  background:var(--card);border-radius:12px;padding:12px 14px;
  margin-bottom:6px;font-size:13px;display:flex;
  align-items:center;justify-content:space-between
}
.history-item .name{font-weight:600}
.history-item .detail{color:var(--text2);font-size:12px}
.empty-state{
  text-align:center;padding:60px 20px;color:var(--text2)
}
.empty-state .icon{font-size:48px;margin-bottom:12px}

/* Add Exercise Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;
  display:flex;align-items:flex-end;justify-content:center
}
.modal{
  background:var(--card);border-radius:20px 20px 0 0;
  width:100%;max-width:480px;max-height:80vh;overflow-y:auto;
  padding:20px
}
.modal h3{font-size:17px;margin-bottom:16px}
.modal-input{
  width:100%;padding:12px;background:var(--card2);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-size:14px;margin-bottom:12px;
  outline:none;font-family:inherit
}
.modal-input:focus{border-color:var(--accent)}
.template-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.template-item{
  padding:12px;border-radius:10px;border:1px solid var(--border);
  background:var(--card2);cursor:pointer;text-align:center;transition:all .15s
}
.template-item:hover{border-color:var(--accent)}
.template-item .emoji{font-size:24px;display:block;margin-bottom:4px}
.template-item .tname{font-size:12px;font-weight:600}
.template-item .tdetail{font-size:10px;color:var(--text2);margin-top:2px}
.modal-actions{display:flex;gap:8px}
.modal-btn{
  flex:1;padding:12px;border-radius:10px;border:none;
  font-size:14px;font-weight:600;cursor:pointer;font-family:inherit
}
.modal-btn.primary{background:var(--accent);color:#000}
.modal-btn.secondary{background:var(--card2);color:var(--text)}

/* Toast */
.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  background:var(--accent);color:#000;padding:10px 24px;
  border-radius:12px;font-size:14px;font-weight:600;z-index:999;
  opacity:0;transition:opacity .3s;pointer-events:none
}
.toast.show{opacity:1}

/* Responsive */
@media(max-width:360px){
  .day-btn{min-width:44px}
  .set-inputs input{width:46px}
  .timer-circle{width:160px;height:160px}
  .timer-circle .time{font-size:40px}
}
</style>
</head>
<body>

<div class="header">
  <h1>💪 <span>健身计划</span></h1>
  <div class="streak">🔥 <span id="streakCount">0</span> 天</div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="plan">📋 计划</div>
  <div class="tab" data-tab="timer">⏱️ 计时</div>
  <div class="tab" data-tab="history">📊 记录</div>
</div>

<!-- ========== PLAN TAB ========== -->
<div class="section active" id="sec-plan">
  <div class="day-selector" id="daySelector"></div>
  <div id="exerciseList"></div>
</div>

<!-- ========== TIMER TAB ========== -->
<div class="section" id="sec-timer">
  <div class="timer-display">
    <div class="timer-circle" id="timerCircle">
      <div class="time" id="timerDisplay">00:00</div>
      <div class="label" id="timerLabel">休息计时</div>
    </div>
    <div class="timer-presets">
      <button class="timer-preset active" data-sec="60">60s</button>
      <button class="timer-preset" data-sec="90">90s</button>
      <button class="timer-preset" data-sec="120">120s</button>
      <button class="timer-preset" data-sec="180">3min</button>
    </div>
    <div class="timer-actions">
      <button class="timer-btn reset" id="btnReset">↺ 重置</button>
      <button class="timer-btn start" id="btnStart">▶ 开始</button>
    </div>
  </div>
</div>

<!-- ========== HISTORY TAB ========== -->
<div class="section" id="sec-history">
  <div class="empty-state" id="historyEmpty">
    <div class="icon">📭</div>
    <div>暂无训练记录</div>
    <div style="font-size:12px;margin-top:6px">完成训练后会自动记录</div>
  </div>
  <div id="historyList"></div>
</div>

<!-- ========== ADD EXERCISE MODAL ========== -->
<div class="modal-overlay" id="modalOverlay" style="display:none">
  <div class="modal">
    <h3 id="modalTitle">添加动作</h3>
    <div class="template-grid" id="templateGrid"></div>
    <input class="modal-input" id="modalInput" placeholder="或输入自定义动作名称...">
    <div class="modal-actions">
      <button class="modal-btn secondary" id="btnModalCancel">取消</button>
      <button class="modal-btn primary" id="btnModalConfirm">添加</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== DATA ====================
const WEEKDAYS = ['一','二','三','四','五','六','日'];
const DAY_NAMES = {0:'周一',1:'周二',2:'周三',3:'周四',4:'周五',5:'周六',6:'周日'};

// Default weekly plan
const DEFAULT_PLAN = {
  0: {
    label: '胸 + 三头',
    exercises: [
      {id:'1',name:'杠铃卧推',sets:[{kg:'',reps:'12'},{kg:'',reps:'12'},{kg:'',reps:'10'},{kg:'',reps:'8'}]},
      {id:'2',name:'上斜哑铃卧推',sets:[{kg:'',reps:'12'},{kg:'',reps:'10'},{kg:'',reps:'10'}]},
      {id:'3',name:'蝴蝶机夹胸',sets:[{kg:'',reps:'15'},{kg:'',reps:'12'},{kg:'',reps:'12'}]},
      {id:'4',name:'绳索下压',sets:[{kg:'',reps:'15'},{kg:'',reps:'12'},{kg:'',reps:'10'}]},
      {id:'5',name:'哑铃颈后臂屈伸',sets:[{kg:'',reps:'12'},{kg:'',reps:'10'},{kg:'',reps:'10'}]},
    ]
  },
  1: {
    label: '背 + 二头',
    exercises: [
      {id:'6',name:'引体向上',sets:[{kg:'',reps:'10'},{kg:'',reps:'8'},{kg:'',reps:'8'},{kg:'',reps:'6'}]},
      {id:'7',name:'杠铃划船',sets:[{kg:'',reps:'12'},{kg:'',reps:'10'},{kg:'',reps:'8'}]},
      {id:'8',name:'高位下拉',sets:[{kg:'',reps:'12'},{kg:'',reps:'10'},{kg:'',reps:'10'}]},
      {id:'9',name:'哑铃弯举',sets:[{kg:'',reps:'12'},{kg:'',reps:'10'},{kg:'',reps:'10'}]},
      {id:'10',name:'锤式弯举',sets:[{kg:'',reps:'12'},{kg:'',reps:'10'},{kg:'',reps:'10'}]},
    ]
  },
  2: {
    label: '休息日',
    exercises: []
  },
  3: {
    label: '腿 + 肩',
    exercises: [
      {id:'11',name:'杠铃深蹲',sets:[{kg:'',reps:'12'},{kg:'',reps:'10'},{kg:'',reps:'8'},{kg:'',reps:'6'}]},
      {id:'12',name:'腿举',sets:[{kg:'',reps:'12'},{kg:'',reps:'10'},{kg:'',reps:'10'}]},
      {id:'13',name:'哑铃推举',sets:[{kg:'',reps:'12'},{kg:'',reps:'10'},{kg:'',reps:'8'}]},
      {id:'14',name:'侧平举',sets:[{kg:'',reps:'15'},{kg:'',reps:'15'},{kg:'',reps:'12'}]},
      {id:'15',name:'面拉',sets:[{kg:'',reps:'15'},{kg:'',reps:'12'},{kg:'',reps:'12'}]},
    ]
  },
  4: {
    label: '有氧 / 核心',
    exercises: [
      {id:'16',name:'跑步/椭圆机',sets:[{kg:'',reps:'30min'}]},
      {id:'17',name:'平板支撑',sets:[{kg:'',reps:'60s'},{kg:'',reps:'45s'},{kg:'',reps:'45s'}]},
      {id:'18',name:'卷腹',sets:[{kg:'',reps:'20'},{kg:'',reps:'20'},{kg:'',reps:'15'}]},
      {id:'19',name:'俄罗斯转体',sets:[{kg:'',reps:'20'},{kg:'',reps:'20'}]},
      {id:'20',name:'仰卧抬腿',sets:[{kg:'',reps:'15'},{kg:'',reps:'12'},{kg:'',reps:'12'}]},
    ]
  },
  5: {
    label: '胸 + 背 超级组',
    exercises: [
      {id:'21',name:'哑铃卧推',sets:[{kg:'',reps:'12'},{kg:'',reps:'10'},{kg:'',reps:'8'}]},
      {id:'22',name:'哑铃划船',sets:[{kg:'',reps:'12'},{kg:'',reps:'10'},{kg:'',reps:'8'}]},
      {id:'23',name:'上斜飞鸟',sets:[{kg:'',reps:'15'},{kg:'',reps:'12'},{kg:'',reps:'12'}]},
      {id:'24',name:'坐姿划船',sets:[{kg:'',reps:'12'},{kg:'',reps:'10'},{kg:'',reps:'10'}]},
      {id:'25',name:'双杠臂屈伸',sets:[{kg:'',reps:'10'},{kg:'',reps:'8'},{kg:'',reps:'8'}]},
    ]
  },
  6: {
    label: '休息日',
    exercises: []
  }
};

// Exercise templates for the modal
const EXERCISE_TEMPLATES = [
  {emoji:'🏋️',name:'杠铃卧推',detail:'胸',sets:'4x12,10,8,8'},
  {emoji:'🏋️',name:'上斜哑铃卧推',detail:'上胸',sets:'3x12,10,10'},
  {emoji:'🦋',name:'蝴蝶机夹胸',detail:'胸',sets:'3x15,12,12'},
  {emoji:'🏋️',name:'杠铃划船',detail:'背',sets:'3x12,10,8'},
  {emoji:'🔽',name:'高位下拉',detail:'背',sets:'3x12,10,10'},
  {emoji:'🆙',name:'引体向上',detail:'背',sets:'4x10,8,8,6'},
  {emoji:'💪',name:'哑铃弯举',detail:'二头',sets:'3x12,10,10'},
  {emoji:'🔨',name:'锤式弯举',detail:'二头',sets:'3x12,10,10'},
  {emoji:'🦵',name:'杠铃深蹲',detail:'腿',sets:'4x12,10,8,6'},
  {emoji:'🦵',name:'腿举',detail:'腿',sets:'3x12,10,10'},
  {emoji:'🏋️',name:'哑铃推举',detail:'肩',sets:'3x12,10,8'},
  {emoji:'🕊️',name:'侧平举',detail:'肩',sets:'3x15,15,12'},
  {emoji:'🪢',name:'绳索下压',detail:'三头',sets:'3x15,12,12'},
  {emoji:'🏃',name:'跑步/椭圆机',detail:'有氧',sets:'1x30min'},
  {emoji:'🧘',name:'平板支撑',detail:'核心',sets:'3x60s'},
  {emoji:'🔄',name:'卷腹',detail:'核心',sets:'3x20'},
  {emoji:'🎯',name:'面拉',detail:'后束',sets:'3x15,12,12'},
  {emoji:'🏋️',name:'哑铃卧推',detail:'胸',sets:'3x12,10,8'},
];

// State
let plan = JSON.parse(localStorage.getItem('fitness_plan') || 'null') || JSON.parse(JSON.stringify(DEFAULT_PLAN));
let history = JSON.parse(localStorage.getItem('fitness_history') || '[]');
let selectedDay = new Date().getDay() === 0 ? 6 : new Date().getDay() - 1; // Mon=0...Sun=6
let currentTab = 'plan';
let timerSec = 60, timerRunning = false, timerInterval = null, timerRemaining = 60;

// ==================== INIT ====================
function init() {
  renderDaySelector();
  renderExercises();
  renderHistory();
  updateStreak();
  setupTimerListeners();
  setupModalListeners();
}

// ==================== DAY SELECTOR ====================
function renderDaySelector() {
  const today = new Date().getDay() === 0 ? 6 : new Date().getDay() - 1;
  const el = document.getElementById('daySelector');
  const todayStr = getTodayStr();

  el.innerHTML = WEEKDAYS.map((d,i) => {
    let cls = 'day-btn';
    if (i === selectedDay) cls += ' active';
    if (i === today) cls += ' today';
    if (isDayDone(i)) cls += ' done';
    const check = isDayDone(i) ? '<span class="check">✅</span>' : '';
    return `<div class="${cls}" data-day="${i}">
      <div class="day-num">${i+1}</div>
      <div class="day-label">周${d}</div>
      ${check}
    </div>`;
  }).join('');

  el.querySelectorAll('.day-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedDay = parseInt(btn.dataset.day);
      renderDaySelector();
      renderExercises();
    });
  });
}

function isDayDone(day) {
  const todayStr = getTodayStr();
  return history.some(h => h.day === day && h.date === todayStr);
}

// ==================== EXERCISES ====================
function renderExercises() {
  const el = document.getElementById('exerciseList');
  const dayPlan = plan[selectedDay] || {label:'未设置', exercises:[]};
  const exercises = dayPlan.exercises || [];

  if (exercises.length === 0) {
    el.innerHTML = `<div class="empty-state">
      <div class="icon">😴</div>
      <div>${dayPlan.label}</div>
      <div style="font-size:12px;margin-top:6px;color:var(--text2)">好好休息，恢复肌肉</div>
    </div>`;
    return;
  }

  el.innerHTML = exercises.map((ex, ei) => `
    <div class="ex-card" data-ex="${ei}">
      <div class="ex-header">
        <span class="ex-name">${ex.name}</span>
        <span class="ex-target">${ex.sets.length} 组</span>
      </div>
      <div class="sets-row">
        ${ex.sets.map((s,si) => `
          <div class="set-item" data-set="${si}">
            <div class="set-num" onclick="toggleSet(${ei},${si})">${si+1}</div>
            <div class="set-inputs">
              <input type="text" placeholder="重量" value="${s.kg||''}" onchange="updateSet(${ei},${si},'kg',this.value)">
              <label>kg</label>
              <input type="text" placeholder="次数" value="${s.reps||''}" onchange="updateSet(${ei},${si},'reps',this.value)">
              <label>次</label>
            </div>
            <button class="set-del" onclick="removeSet(${ei},${si})">✕</button>
          </div>
        `).join('')}
      </div>
      <div class="add-row">
        <button class="add-btn" onclick="addSet(${ei})">+ 添加一组</button>
        <button class="add-btn" onclick="startTimer(${ei})">⏱️ 休息</button>
      </div>
    </div>
  `).join('');

  // Add exercise button
  const addHtml = `<div class="add-row" style="margin-top:12px">
    <button class="add-btn" onclick="openAddModal()" style="padding:14px">+ 添加动作</button>
    <button class="add-btn" onclick="finishDay()" style="padding:14px;border-color:var(--accent);color:var(--accent)">✅ 完成训练</button>
  </div>`;
  el.insertAdjacentHTML('beforeend', addHtml);
}

// ==================== SET MANAGEMENT ====================
function updateSet(ei, si, key, val) {
  plan[selectedDay].exercises[ei].sets[si][key] = val;
  savePlan();
}

function toggleSet(ei, si) {
  const setEl = document.querySelector(`.ex-card[data-ex="${ei}"] .set-item[data-set="${si}"]`);
  setEl.classList.toggle('done');
}

function addSet(ei) {
  // Copy last set's values
  const sets = plan[selectedDay].exercises[ei].sets;
  const last = sets[sets.length-1] || {kg:'',reps:''};
  sets.push({kg:last.kg || '',reps:last.reps || ''});
  savePlan();
  renderExercises();
}

function removeSet(ei, si) {
  const sets = plan[selectedDay].exercises[ei].sets;
  if (sets.length <= 1) {
    // Remove entire exercise if last set
    plan[selectedDay].exercises.splice(ei,1);
  } else {
    sets.splice(si,1);
  }
  savePlan();
  renderExercises();
}

// ==================== SAVE / LOAD ====================
function savePlan() {
  localStorage.setItem('fitness_plan', JSON.stringify(plan));
}

function finishDay() {
  const exercises = plan[selectedDay].exercises;
  if (exercises.length === 0) return;

  const todayStr = getTodayStr();
  // Remove existing entry for today
  history = history.filter(h => !(h.day === selectedDay && h.date === todayStr));
  // Add new entry
  history.unshift({
    day: selectedDay,
    date: todayStr,
    label: plan[selectedDay].label,
    exercises: JSON.parse(JSON.stringify(exercises))
  });
  // Keep last 30 days
  if (history.length > 60) history = history.slice(0, 60);

  localStorage.setItem('fitness_history', JSON.stringify(history));
  renderDaySelector();
  renderHistory();
  updateStreak();
  showToast('🎉 训练完成！干得漂亮！');
}

// ==================== HISTORY ====================
function renderHistory() {
  const el = document.getElementById('historyList');
  const empty = document.getElementById('historyEmpty');

  if (history.length === 0) {
    el.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  // Group by date
  let html = '';
  history.forEach((h,i) => {
    html += `<div class="history-day">
      <div class="history-date">
        ${h.date} ${DAY_NAMES[h.day] || ''} · ${h.label}
        <span style="margin-left:auto;font-size:11px;color:var(--red);cursor:pointer" onclick="deleteHistory(${i})">删除</span>
      </div>`;
    h.exercises.forEach(ex => {
      html += `<div class="history-item">
        <span class="name">${ex.name}</span>
        <span class="detail">${ex.sets.length}组</span>
      </div>`;
    });
    html += '</div>';
  });
  el.innerHTML = html;
}

function deleteHistory(i) {
  history.splice(i,1);
  localStorage.setItem('fitness_history', JSON.stringify(history));
  renderHistory();
  renderDaySelector();
  updateStreak();
}

// ==================== STREAK ====================
function updateStreak() {
  let streak = 0;
  const dates = [...new Set(history.map(h => h.date))].sort().reverse();
  if (dates.length === 0) {
    document.getElementById('streakCount').textContent = '0';
    return;
  }

  const today = new Date();
  const todayStr = getTodayStr();
  let check = new Date(todayStr);

  for (const d of dates) {
    const dDate = new Date(d);
    const diff = Math.floor((check - dDate) / 86400000);
    if (diff === 0) { streak++; check.setDate(check.getDate()-1); }
    else if (diff === 1) { streak++; check = new Date(d); check.setDate(check.getDate()-1); }
    else break;
  }
  // Only count if today is done
  if (!dates.includes(todayStr) && dates.length > 0) {
    const firstDate = new Date(dates[0]);
    const diff = Math.floor((today - firstDate) / 86400000);
    if (diff > 1) streak = 0;
  }
  document.getElementById('streakCount').textContent = streak;
}

// ==================== TIMER ====================
function setupTimerListeners() {
  document.querySelectorAll('.timer-preset').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.timer-preset').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      timerSec = parseInt(this.dataset.sec);
      resetTimer();
    });
  });

  document.getElementById('btnStart').addEventListener('click', toggleTimer);
  document.getElementById('btnReset').addEventListener('click', resetTimer);
}

function startTimer(ei) {
  // Switch to timer tab
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.tab[data-tab="timer"]').classList.add('active');
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('sec-timer').classList.add('active');
  currentTab = 'timer';
  startCountdown();
}

function toggleTimer() {
  if (timerRunning) {
    pauseTimer();
  } else {
    startCountdown();
  }
}

function startCountdown() {
  if (timerInterval) return;
  timerRunning = true;
  document.getElementById('timerCircle').classList.add('running');
  const btn = document.getElementById('btnStart');
  btn.textContent = '⏸ 暂停';
  btn.className = 'timer-btn pause';

  timerInterval = setInterval(() => {
    timerRemaining--;
    updateTimerDisplay();
    if (timerRemaining <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      timerRunning = false;
      document.getElementById('timerCircle').classList.remove('running');
      btn.textContent = '▶ 开始';
      btn.className = 'timer-btn start';
      // Vibrate on mobile
      if (navigator.vibrate) navigator.vibrate([200,100,200]);
      showToast('⏰ 休息结束！开始下一组！');
    }
  }, 1000);
}

function pauseTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  timerRunning = false;
  document.getElementById('timerCircle').classList.remove('running');
  const btn = document.getElementById('btnStart');
  btn.textContent = '▶ 开始';
  btn.className = 'timer-btn start';
}

function resetTimer() {
  pauseTimer();
  timerRemaining = timerSec;
  updateTimerDisplay();
}

function updateTimerDisplay() {
  const m = Math.floor(timerRemaining / 60);
  const s = timerRemaining % 60;
  document.getElementById('timerDisplay').textContent =
    String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

// ==================== MODAL ====================
function openAddModal() {
  document.getElementById('modalOverlay').style.display = 'flex';
  document.getElementById('modalInput').value = '';
  renderTemplates();
}

function renderTemplates() {
  const el = document.getElementById('templateGrid');
  el.innerHTML = EXERCISE_TEMPLATES.map(t => `
    <div class="template-item" data-name="${t.name}" data-sets="${t.sets}">
      <span class="emoji">${t.emoji}</span>
      <span class="tname">${t.name}</span>
      <span class="tdetail">${t.detail} · ${t.sets}</span>
    </div>
  `).join('');

  el.querySelectorAll('.template-item').forEach(item => {
    item.addEventListener('click', function() {
      document.getElementById('modalInput').value = this.dataset.name;
    });
  });
}

function setupModalListeners() {
  document.getElementById('btnModalCancel').addEventListener('click', () => {
    document.getElementById('modalOverlay').style.display = 'none';
  });
  document.getElementById('btnModalConfirm').addEventListener('click', confirmAdd);
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) this.style.display = 'none';
  });
}

function confirmAdd() {
  const name = document.getElementById('modalInput').value.trim();
  if (!name) { showToast('请输入动作名称'); return; }
  plan[selectedDay].exercises.push({
    id: Date.now().toString(),
    name: name,
    sets: [{kg:'',reps:'12'},{kg:'',reps:'10'},{kg:'',reps:'10'}]
  });
  savePlan();
  document.getElementById('modalOverlay').style.display = 'none';
  renderExercises();
  showToast('✅ 已添加');
}

// ==================== TABS ====================
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    this.classList.add('active');
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById('sec-' + this.dataset.tab).classList.add('active');
    currentTab = this.dataset.tab;
    if (currentTab === 'history') renderHistory();
  });
});

// ==================== UTILS ====================
function getTodayStr() {
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

// ==================== START ====================
resetTimer();
init();
</script>
