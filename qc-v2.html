<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>质检工作台</title>
<style>
:root{
  --primary:#4C7A4C; --primary-d:#3c613c; --bg:#f5f7f4; --card:#fff;
  --border:#e3e8e0; --text:#1f2a22; --text2:#6b7a6e; --red:#d9483b; --green:#3c9d5b;
  --blue:#2f6fb3; --orange:#e08a1e; --purple:#7c5bbf;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.topbar h1{font-size:17px;margin:0;color:var(--primary)}
.badge{font-size:11px;padding:3px 10px;border-radius:12px}
.locked-badge{background:#fdecea;color:var(--red)}
.admin-badge{background:rgba(76,122,76,.12);color:var(--primary)}
.spacer{flex:1}
.btn{border:1px solid var(--border);background:#fff;color:var(--text);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.btn:hover{background:#f0f3ee}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-d)}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}
.btn-red{background:var(--red);color:#fff;border-color:var(--red)}
.btn-sm{padding:4px 10px;font-size:12px}
.toolbar{display:flex;gap:8px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
.filters{display:flex;gap:8px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
.filters input,.filters select{border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:none;background:#fff;padding:6px 12px;cursor:pointer;font-size:13px}
.seg button.active{background:var(--primary);color:#fff}
.list{padding:12px 16px;max-width:1200px;margin:0 auto}
.empty{text-align:center;color:var(--text2);padding:60px 0}
/* card */
.card{border:1px solid var(--border);border-radius:10px;background:var(--card);padding:12px;margin-bottom:12px;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--primary)}
.card .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.card .staff{font-weight:700;color:var(--primary)}
.card .meta{font-size:12px;color:var(--text2)}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.tag{font-size:11px;padding:2px 7px;border-radius:4px;background:#eef2ea;color:var(--text2)}
.sev{font-size:11px;padding:2px 7px;border-radius:4px;font-weight:600}
.sev-一般{background:#fef3c7;color:#b8791a}
.sev-严重{background:#fee2e2;color:#c0392b}
.sev-严重需整改{background:#ede9fe;color:#6d28d9}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumbs img{max-width:90px;max-height:64px;border-radius:6px;border:1px solid var(--border);object-fit:contain;cursor:zoom-in}
.status-pill{font-size:11px;padding:2px 8px;border-radius:10px}
.status-pending{background:#fff4e0;color:var(--orange)}
.status-done{background:#e6f6ec;color:var(--green)}
/* table */
table.grid{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
table.grid th,table.grid td{border-bottom:1px solid var(--border);padding:8px 10px;text-align:left;font-size:13px;vertical-align:top}
table.grid th{background:#f0f3ee;color:var(--text2);font-weight:600;white-space:nowrap}
table.grid tr:hover{background:#fafbf8}
/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(20,30,20,.45);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;z-index:50;overflow:auto}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:12px;width:560px;max-width:100%;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-header h3{margin:0;font-size:16px}
.close-btn{border:none;background:none;font-size:22px;cursor:pointer;color:var(--text2);line-height:1}
.modal-body{padding:16px;max-height:70vh;overflow:auto}
.modal-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:12px;color:var(--text2);margin-bottom:3px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:13px;font-family:inherit}
.fld textarea{resize:vertical;min-height:54px}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.chip-row{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);border-radius:14px;padding:4px 12px;cursor:pointer;font-size:12px;background:#fff}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.up-prev{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.up-prev img{width:64px;height:48px;object-fit:cover;border-radius:5px;border:1px solid var(--border)}
.up-prev .x{position:relative}
.up-prev .x span{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer}
/* lightbox */
.img-preview-overlay{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;z-index:80;flex-direction:column}
.img-preview-overlay.active{display:flex}
#imgPreviewWrapper{max-width:92vw;max-height:82vh;overflow:auto;display:flex;align-items:flex-start;justify-content:center;cursor:grab}
#imgPreviewSrc{display:block;image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges;user-select:none}
.img-preview-close{position:absolute;top:14px;right:18px;color:#fff;font-size:30px;cursor:pointer;z-index:81}
.img-preview-hint{position:absolute;top:14px;left:18px;color:#ccc;font-size:12px}
.img-preview-toolbar{position:absolute;bottom:16px;display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:20px}
.img-preview-toolbar button{background:#fff;border:none;border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:15px}
.img-preview-name{position:absolute;bottom:60px;color:#eee;font-size:12px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2a2a2a;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:90;opacity:0;transition:.25s;pointer-events:none;max-width:80vw}
.toast.show{opacity:1}
/* analysis */
.analysis-header{text-align:center;margin-bottom:14px}.analysis-header h2{margin:0 0 4px;color:var(--primary)}
.analysis-grid{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.analysis-kpi{flex:1;min-width:90px;background:#f6f9f3;border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.analysis-kpi .num{font-size:22px;font-weight:800}
.analysis-kpi .lbl{font-size:12px;color:var(--text2);margin-top:2px}
.analysis-section{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px;margin:10px 0}
.analysis-section h4{margin:0 0 8px;font-size:14px}
.bar-row{display:flex;align-items:center;gap:8px;margin:5px 0}
.bar-label{width:90px;font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;background:#eef2ea;border-radius:6px;height:18px;overflow:hidden}
.bar-fill{height:100%;background:var(--primary);font-size:11px;color:#fff;display:flex;align-items:center;padding-left:6px}
.bar-val{width:54px;font-size:12px;color:var(--text2);text-align:right}
.timeline-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border)}
.timeline-dot{width:10px;height:10px;border-radius:50%;margin-top:4px;flex-shrink:0;background:var(--orange)}
.timeline-dot.done{background:var(--green)}
.timeline-content{flex:1}.timeline-date{font-size:12px;color:var(--text2)}
.timeline-text{font-size:13px;margin:2px 0}
.timeline-tag{font-size:11px;padding:1px 6px;border-radius:4px;background:#f1f5f9;margin-right:4px}
.timeline-imgs img{max-width:90px;max-height:64px;border-radius:4px;border:1px solid var(--border);object-fit:contain;cursor:zoom-in;margin:3px 4px 0 0}
/* coach */
.coach-card{border:1px solid var(--border);border-radius:10px;padding:12px;margin:10px 0;background:#fff}
.coach-card h4{margin:0 0 8px;color:var(--primary)}
.coach-item{border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px}
.coach-item .q{color:var(--red);margin:4px 0}
.coach-item .a{color:var(--green);background:#f0fdf4;border-radius:6px;padding:6px 8px;margin-top:4px}
.coach-item .a.k{background:#eff6ff;color:#1e40af;border:1px dashed #bfdbfe}
.share-link-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--border)}
.share-link-row .sl-staff{font-weight:600;min-width:60px}
.share-link-row .sl-url{flex:1;font-size:11px;color:var(--text2);word-break:break-all}
.loadmore{text-align:center;padding:14px}
.sel-checkbox{width:16px;height:16px}
.tag-chips .chip{font-size:12px}
@media(max-width:640px){.row2{flex-direction:column}.bar-label{width:70px}}
</style>
</head>
<body>

<div class="topbar">
  <h1>🔍 质检工作台</h1>
  <span id="adminBadge" class="badge locked-badge">🔒 只读</span>
  <div class="spacer"></div>
  <button class="btn btn-primary" id="btnAddRecord" onclick="openEditModal()">➕ 新增质检记录</button>
</div>

<div class="toolbar">
  <div class="seg" id="viewSeg">
    <button id="vmTable" class="active" onclick="setView('table')">📋 表格</button>
    <button id="vmCard" onclick="setView('card')">🗂️ 卡片</button>
  </div>
  <button class="btn" onclick="openAnalysisMode()">📊 质检分析</button>
  <button class="btn" onclick="openCoachMode()">🎯 一对一讲解</button>
  <button class="btn" id="btnSend" onclick="openSendModal()">📤 发送记录</button>
  <button class="btn" onclick="exportXLSX()">⬇️ 导出Excel</button>
  <button class="btn" onclick="loadRecords(true)">🔄 刷新</button>
  <span id="statBox" style="font-size:12px;color:var(--text2)"></span>
</div>

<div class="filters">
  <input id="filterSearch" placeholder="搜索问题/正确做法" oninput="renderRecords()" style="min-width:160px">
  <select id="filterStaff" onchange="renderRecords()"><option value="">全部客服</option></select>
  <select id="filterShop" onchange="renderRecords()"><option value="">全部店铺</option></select>
  <select id="filterTag" onchange="renderRecords()"><option value="">全部分类</option></select>
  <select id="filterStatus" onchange="renderRecords()">
    <option value="">全部状态</option><option value="pending">待讲解</option><option value="done">已讲解</option>
  </select>
  <select id="filterMonth" onchange="renderRecords()"><option value="">全部月份</option></select>
</div>

<div class="list" id="recordList"></div>

<!-- 编辑/新增 Modal -->
<div class="modal-overlay" id="editModal"><div class="modal">
<div class="modal-header"><h3 id="editTitle">新增质检记录</h3><button class="close-btn" onclick="closeEditModal()">×</button></div>
<div class="modal-body" id="editBody"></div>
<div class="modal-footer">
  <button class="btn btn-red" id="editDeleteBtn" style="display:none" onclick="deleteEditingRecord()">🗑️ 删除</button>
  <button class="btn btn-primary" onclick="saveEdit()">保存</button>
  <button class="btn" onclick="closeEditModal()">取消</button>
</div>
</div></div>

<!-- Coach Modal -->
<div class="modal-overlay" id="coachModal"><div class="modal" style="max-width:860px">
<div class="modal-header"><h3>🎯 一对一讲解模式</h3><button class="close-btn" onclick="closeCoachModal()">×</button></div>
<div class="modal-body" id="coachBody"></div>
<div class="modal-footer">
  <button class="btn btn-green" id="coachSendBtn" style="display:none" onclick="sendCoachSheet()">📤 发送(本人+负责人)</button>
  <button class="btn" onclick="window.print()">🖨️ 打印</button>
  <button class="btn" onclick="closeCoachModal()">关闭</button>
</div>
</div></div>

<!-- Analysis Modal -->
<div class="modal-overlay" id="analysisModal"><div class="modal" style="max-width:900px">
<div class="modal-header"><h3>📊 客服质检质量分析</h3><button class="close-btn" onclick="closeAnalysisModal()">×</button></div>
<div class="modal-body" id="analysisBody"></div>
<div class="modal-footer">
  <button class="btn btn-green" id="analysisSendBtn" style="display:none" onclick="sendAnalysisReport()">📤 发送(本人+负责人)</button>
  <button class="btn" onclick="window.print()">🖨️ 打印</button>
  <button class="btn" onclick="closeAnalysisModal()">关闭</button>
</div>
</div></div>

<!-- 发送记录 Modal -->
<div class="modal-overlay" id="sendModal"><div class="modal" style="max-width:520px">
<div class="modal-header"><h3>📤 发送质检记录（一对一反馈）</h3><button class="close-btn" onclick="closeSendModal()">×</button></div>
<div class="modal-body">
  <div class="fld"><label>按勾选记录发送（在列表勾选后）</label><div id="sendPreview" style="font-size:13px;color:var(--text2)">请先在列表勾选要发送的记录</div></div>
  <div class="fld"><label>自动确认时限（小时）</label><input id="sendHours" type="number" value="48" min="1" style="max-width:120px"></div>
</div>
<div class="modal-footer">
  <button class="btn btn-primary" onclick="doSendRecords()">生成链接并通知</button>
  <button class="btn" onclick="closeSendModal()">取消</button>
</div>
</div></div>

<!-- Share link Modal -->
<div class="modal-overlay" id="shareModal"><div class="modal" style="max-width:640px">
<div class="modal-header"><h3>📤 链接已生成</h3><button class="close-btn" onclick="closeShareModal()">×</button></div>
<div class="modal-body" id="shareModalBody" style="padding:16px"></div>
</div></div>

<!-- Image Preview -->
<div class="img-preview-overlay" id="imgPreview" onclick="closeImgPreview()">
<div class="img-preview-hint">点击图片放大 · 滚轮缩放 · 长图可上下滑动</div>
<button class="img-preview-close" onclick="closeImgPreview()">×</button>
<div id="imgPreviewWrapper" onmousedown="imgDragStart(event)">
<img id="imgPreviewSrc" class="clickable" src="" alt="" onclick="event.stopPropagation();imgToggleZoom()">
</div>
<div class="img-preview-name" id="imgPreviewName"></div>
<div class="img-preview-toolbar" onclick="event.stopPropagation()">
<button title="缩小" onclick="imgZoomStep(-0.3)">－</button>
<span id="imgZoomLabel" onclick="imgResetZoom()">100%</span>
<button title="放大" onclick="imgZoomStep(0.3)">＋</button>
<button title="适应屏幕" onclick="imgFitScreen()">⤢</button>
</div>
</div>

<div class="toast" id="toast"></div>

<script>

  if(window.__qcSupabase){ window.supabase = window.__qcSupabase; return true; }

/* ==================== 通用工具 ==================== */
function todayStr(){const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function escapeHtml(t){if(!t)return'';const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
function formatNumberedHtml(s){if(!s)return'';return s.split('\n').map(l=>'<div>'+escapeHtml(l)+'</div>').join('');}
function showToast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.style.background=err?'#c0392b':'#2a2a2a';t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}

  shopOptions = [...new Set([...DEFAULT_SHOPS, ...records.map(r=>r.shop).filter(Boolean)])].sort();
}

function imgPathOf(ref){ if(!ref)return''; const s=String(ref); if(s.indexOf('/')!==-1)return s; return 'qc/'+s+'.jpg'; }
async function getImageUrl(ref){
  if(typeof ref==='string'&&ref.startsWith('data:'))return ref;
  const path=imgPathOf(ref); if(!path)return''; if(imageUrlCache[path])return imageUrlCache[path];
  let url='';
  try{ const {data}=await supabase.storage.from('qc-images').createSignedUrl(path,3600);
    if(data&&data.signedUrl){ url=data.signedUrl.startsWith('http')?data.signedUrl:SUPABASE_URL+'/storage/v1'+(data.signedUrl.startsWith('/')?'':'/')+data.signedUrl; }
  }catch(e){}
  if(!url||!url.startsWith('http')){ try{ const {data}=supabase.storage.from('qc-images').getPublicUrl(path); if(data&&data.publicUrl)url=data.publicUrl; }catch(e){} }
  if(url&&url.startsWith('http')){ imageUrlCache[path]=url; return url; }
  return '';
}
// 灯箱
let imgZoom=1, imgX=0, imgY=0, imgDrag=false, imgSX=0, imgSY=0;
function previewImage(url,name){
  if(!url)return;
  const img=document.getElementById('imgPreviewSrc'); const wrap=document.getElementById('imgPreviewWrapper');
  img.style.transform=''; imgZoom=1; imgX=0; imgY=0; wrap.scrollTop=0; wrap.scrollLeft=0;
  img.src=url; document.getElementById('imgPreviewName').textContent=name||'';
  document.getElementById('imgPreview').classList.add('active');
  img.onload=()=>{ imgFitWidth(); };
}
function closeImgPreview(){ document.getElementById('imgPreview').classList.remove('active'); }
function imgToggleZoom(){ imgZoom = imgZoom>1?1:2; applyZoom(); }
function imgZoomStep(d){ imgZoom=Math.max(0.4,Math.min(4,imgZoom+d)); applyZoom(); }
function imgResetZoom(){ imgZoom=1; applyZoom(); }
function imgFitWidth(){
  const img=document.getElementById('imgPreviewSrc'); const wrap=document.getElementById('imgPreviewWrapper');
  const s=Math.min(wrap.clientWidth/img.naturalWidth, 1);
  imgZoom=s;
  img.style.width=(img.naturalWidth*imgZoom)+'px'; img.style.height='auto'; updateZoomLabel();
}
function imgFitScreen(){
  const img=document.getElementById('imgPreviewSrc'); const wrap=document.getElementById('imgPreviewWrapper');
  const s=Math.min(wrap.clientWidth/img.naturalWidth, wrap.clientHeight/img.naturalHeight, 1);

function applyZoom(){ const img=document.getElementById('imgPreviewSrc'); img.style.width=(img.naturalWidth*imgZoom)+'px'; img.style.height='auto'; updateZoomLabel(); }
function updateZoomLabel(){ document.getElementById('imgZoomLabel').textContent=Math.round(imgZoom*100)+'%'; }
function imgDragStart(e){ imgDrag=true; imgSX=e.clientX; imgSY=e.clientY; const w=document.getElementById('imgPreviewWrapper'); imgSX-=w.scrollLeft; imgSY-=w.scrollTop; w.style.cursor='grabbing'; }
document.getElementById('imgPreviewWrapper').addEventListener('mousemove',e=>{ if(!imgDrag)return; const w=document.getElementById('imgPreviewWrapper'); w.scrollLeft=imgSX-e.clientX; w.scrollTop=imgSY-e.clientY; });

async function loadRecords(showMsg){
  if(DEMO){ records=JSON.parse(JSON.stringify(DEMO_RECORDS)); afterLoad(showMsg); return; }
  try{
    const {data,error}=await supabase.from('qc_records').select('*').order('created_at',{ascending:false});
    if(error){ console.warn(error); records=[]; }
    else{
      records=(data||[]).map(r=>({...r, scene_images:r.scene_images||[], reply_images:r.reply_images||[], knowledge_images:r.knowledge_images||[]}));
      await loadQcImagesInto(records);
    }
  }catch(e){ console.error(e); records=[]; }
  afterLoad(showMsg);
}
async function loadQcImagesInto(list){
  if(!list||!list.length)return false;
  const ids=list.map(r=>r.id); const map={}; const CHUNK=150;
  try{
    for(let i=0;i<ids.length;i+=CHUNK){
      const {data,error}=await supabase.from('qc_images').select('record_id,kind,seq,file_path').in('record_id',ids.slice(i,i+CHUNK)).order('seq',{ascending:true});
      if(error){ console.warn('qc_images 读取失败'); return false; }
      for(const row of (data||[])){ const k=row.record_id+'|'+row.kind; (map[k]=map[k]||[]).push(row.file_path); }
    }
  }catch(e){ return false; }
  for(const r of list){
    if(map[r.id+'|scene']!==undefined) r.scene_images=map[r.id+'|scene'];
    if(map[r.id+'|reply']!==undefined) r.reply_images=map[r.id+'|reply'];
    if(map[r.id+'|knowledge']!==undefined) r.knowledge_images=map[r.id+'|knowledge'];
  }
  qcImagesReady=true; return true;
}

async function saveEdit(){
  if(!isAdmin)return;
  const get=id=>document.getElementById(id).value;

  const rec={ staff:get('e_staff').trim(), customer_id:get('e_cid').trim(), shop:get('e_shop').trim(),
    date:get('e_date'), tags, severity:get('e_sev'),
    problem:get('e_problem'), correct:get('e_correct'), knowledge:get('e_knowledge'), note:get('e_note'),
    penalty_amount:0, status:'pending', coach_date:'', coach_note:'', created_by:(currentAuthUser&&(currentAuthUser.name||currentAuthUser.phone))||''
  };
  if(!rec.staff||!rec.date){ showToast('请填写客服和日期',true); return; }
  if(DEMO){ saveDemo(rec); closeEditModal(); loadRecords(); return; }
  try{
    let recId=editingId;
    if(!recId){ const {data,error}=await supabase.from('qc_records').insert({...rec,scene_images:[],reply_images:[],knowledge_images:[]}).select().single(); if(error)throw error; recId=data.id; }
    else { const {error}=await supabase.from('qc_records').update(rec).eq('id',recId); if(error)throw error; }
    // 上传新图
    for(const kind of ['scene','reply','knowledge']){
      const news=pendingUploads[kind].filter(p=>p.isNew&&p.file);
      for(const p of news){
        const path='rec/'+recId+'/'+kind+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
        const {error}=await supabase.storage.from('qc-images').upload(path,p.file,{contentType:'image/jpeg',upsert:true});
        if(error){ console.warn('上传失败',error.message); continue; }
        await supabase.from('qc_images').insert({record_id:recId,kind,seq:0,file_path:path});
      }
    }
    await refreshRecordImages(recId);
    showToast('✅ 已保存');
    closeEditModal(); loadRecords();
  }catch(e){ console.error(e); showToast('保存失败：'+e.message,true); }
}

    renderShareModal(links); closeSendModal(); renderRecords(); selectedRecordIds.clear();
  }catch(e){ console.error(e); showToast('发送失败：'+e.message,true); }
}
function genToken(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }
async function qcNotifyStaff(staff,title,content,type){
  try{ if(!window.supabase||!staff)return false;
    let uid=qcProfileIdCache[staff]; if(uid===undefined){ const {data}=await supabase.from('profiles').select('id').eq('name',staff).limit(1); uid=(data&&data[0])?data[0].id:null; qcProfileIdCache[staff]=uid; }
    if(!uid)return false;
    await supabase.from('notifications').insert({user_id:uid,title,content,type:type||'qc_confirm',is_read:false});
    return true;
  }catch(e){ return false; }
}
async function qcNotifyAdmins(title,content,type){
  try{ if(!window.supabase)return; const {data,error}=await supabase.from('profiles').select('id').in('role',['admin','leader']); if(error||!data||!data.length)return;
    for(const p of data){ await supabase.from('notifications').insert({user_id:p.id,title,content,type:type||'qc_confirm',is_read:false}); } }catch(e){}
}

  const body=document.getElementById('shareModalBody');

    +links.map(l=>'<div class="share-link-row"><span class="sl-staff">'+escapeHtml(l.staff)+'</span><span class="sl-url">'+escapeHtml(l.url)+'</span><button class="btn btn-sm" onclick="copyLink(\''+l.url.replace(/'/g,"\\'")+'\')">复制</button></div>').join('');
  document.getElementById('shareModal').classList.add('active');
}
function copyLink(url){ if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>showToast('✅ 已复制')).catch(()=>{}); }
function closeShareModal(){ document.getElementById('shareModal').classList.remove('active'); }
function showSendLinkModal(title,url,staff){

  body.innerHTML='<p style="font-size:13px;margin-bottom:6px">'+title+'</p><div style="font-size:12px;color:#3c9d5b;background:#e6f6ec;border:1px solid #bbf7d0;border-radius:8px;padding:8px 10px;margin-bottom:10px">✅ 已通过站内信发送给「'+escapeHtml(staff)+'」（本人）及全部负责人（管理员/组长）。</div>'

  document.getElementById('shareModal').classList.add('active');
}

/* ==================== 一对一讲解 ==================== */
function openCoachMode(){
  const staffList=[...new Set(records.filter(r=>r.status==='pending').map(r=>r.staff))].sort();
  if(!staffList.length){ showToast('当前没有待讲解记录'); return; }
  let h='<div style="margin-bottom:14px"><label style="font-size:13px">选择客服：</label><select id="coachStaffSelect" onchange="renderCoachSheet()" style="margin-left:8px;padding:5px 8px;border:1px solid var(--border);border-radius:6px">'
    +'<option value="">-- 请选择 --</option><option value="_all_">📋 全部客服 ('+records.filter(r=>r.status==='pending').length+'条待讲)</option>'
    +staffList.map(s=>'<option value="'+escapeHtml(s)+'">'+escapeHtml(s)+'</option>').join('')+'</select></div><div id="coachSheet"></div>';
  document.getElementById('coachBody').innerHTML=h; document.getElementById('coachModal').classList.add('active');
}
async function renderCoachSheet(){
  const staff=document.getElementById('coachStaffSelect').value; const el=document.getElementById('coachSheet');
  if(!staff){ el.innerHTML=''; return; }
  const list=records.filter(r=>r.staff===staff&&r.status==='pending').sort((a,b)=>b.date.localeCompare(a.date));
  const done=records.filter(r=>r.staff===staff&&r.status==='done').sort((a,b)=>b.date.localeCompare(a.date));
  let h='<div style="text-align:center;margin-bottom:14px"><h2 style="color:var(--primary);margin:0">'+escapeHtml(staff)+' — 质检问题讲解单</h2><p style="color:var(--text2);font-size:13px">'+todayStr()+' | 待讲解 '+list.length+' 条</p></div>';
  if(list.length){ h+='<div class="coach-card"><h4>📋 待讲解</h4>'; for(let i=0;i<list.length;i++)h+=await coachItem(list[i],i+1); h+='</div>'; }
  if(done.length){ h+='<div class="coach-card"><h4>✅ 已讲解（参考）</h4>'; done.slice(0,5).forEach(r=>{ h+='<div class="coach-item" style="opacity:.7"><div style="font-size:11px;color:var(--text2)">'+r.date+' | '+escapeHtml(r.shop)+'</div><div class="q">'+escapeHtml(r.problem)+'</div>'+(r.coach_date?'<div style="font-size:11px;color:var(--green)">📅 讲解于 '+r.coach_date+'</div>':'')+'</div>'; }); h+='</div>'; }
  const sb=document.getElementById('coachSendBtn'); if(sb)sb.style.display=(isAdmin&&staff!=='_all_')?'':'none';
  el.innerHTML=h;
}
async function coachItem(r,i){
  let h='<div class="coach-item"><div style="font-size:11px;color:var(--text2)">#' +i+' | '+r.date+' | '+escapeHtml(r.shop)+' | <span style="padding:1px 6px;border-radius:3px;background:'+(r.severity==='一般'?'#fef3c7;color:#b8791a':r.severity==='严重'?'#fee2e2;color:#c0392b':'#ede9fe;color:#6d28d9')+'">'+r.severity+'</span></div>';
  for(const [lbl,key] of [['📸 客户问题','scene_images'],['📸 客服回复','reply_images'],['📚 知识点','knowledge_images']]){
    const imgs=r[key]||[]; if(imgs.length){ h+='<div style="font-size:11px;color:var(--text2);margin:4px 0 2px">'+lbl+'：</div><div class="thumbs">'; for(const id of imgs){ const url=await getImageUrl(id); if(url)h+='<img src="'+url+'" onclick="previewImage(\''+url+'\',\''+String(id).replace(/'/g,"\\'")+'\')" style="max-width:260px;max-height:170px;border-radius:6px;border:1px solid var(--border);object-fit:contain;cursor:zoom-in">'; } h+='</div>'; }
  }
  if(r.problem)h+='<div class="q">❌ '+escapeHtml(r.problem)+'</div>';
  if(r.correct)h+='<div class="a">✅ '+formatNumberedHtml(r.correct)+'</div>';
  if(r.knowledge)h+='<div class="a k">📚 '+formatNumberedHtml(r.knowledge)+'</div>';
  if(isAdmin)h+='<div style="margin-top:6px"><button class="btn btn-green btn-sm" onclick="coachMarkDone('+r.id+')">✅ 标记已讲解</button></div>';
  h+='</div>'; return h;
}
async function coachMarkDone(id){
  if(!isAdmin)return; const r=records.find(x=>x.id==id); if(!r)return;
  r.status='done'; r.coach_date=todayStr();
  if(DEMO){ renderCoachSheet(); renderRecords(); return; }
  try{ await supabase.from('qc_records').update({status:'done',coach_date:r.coach_date}).eq('id',id); renderCoachSheet(); renderRecords(); }catch(e){ showToast('失败：'+e.message,true); }
}
function closeCoachModal(){ document.getElementById('coachModal').classList.remove('active'); }
async function sendCoachSheet(){
  if(!isAdmin){ showToast('🔒 只读',true); return; }
  const staff=document.getElementById('coachStaffSelect').value;
  if(!staff||staff==='_all_'){ showToast('请选择具体客服再发送',true); return; }
  const url=new URL('qc-v2.html?share=coach&staff='+encodeURIComponent(staff),location.href).href;
  const title='🎯 '+staff+' 的质检讲解单', content='质检主管发来「'+staff+'」的质检讲解单（含配图），点开直达：\n'+url;
  await qcNotifyStaff(staff,title,content,'qc_coach'); await qcNotifyAdmins(title,content,'qc_coach');
  showToast('✅ 已发送给「'+staff+'」（本人）和负责人'); showSendLinkModal('🎯 讲解单已发送',url,staff);
}

/* ==================== 质检分析 ==================== */
function openAnalysisMode(){
  const staffList=[...new Set(records.map(r=>r.staff))].sort();
  if(!staffList.length){ showToast('暂无数据'); return; }
  let h='<div style="margin-bottom:14px"><label style="font-size:13px">选择客服：</label><select id="analysisStaffSelect" onchange="renderAnalysisSheet()" style="margin-left:8px;padding:5px 8px;border:1px solid var(--border);border-radius:6px"><option value="">-- 请选择 --</option><option value="_all_">📊 全部汇总</option>'+staffList.map(s=>'<option value="'+escapeHtml(s)+'">'+escapeHtml(s)+'</option>').join('')+'</select></div><div id="analysisSheet"></div>';
  document.getElementById('analysisBody').innerHTML=h; document.getElementById('analysisModal').classList.add('active');
}
async function renderAnalysisSheet(){
  const staff=document.getElementById('analysisStaffSelect').value; const el=document.getElementById('analysisSheet');
  if(!staff){ el.innerHTML=''; return; }
  if(staff==='_all_'){ const sb=document.getElementById('analysisSendBtn'); if(sb)sb.style.display='none'; await renderAllStaff(el); return; }
  const all=records.filter(r=>r.staff===staff).sort((a,b)=>b.date.localeCompare(a.date));
  const pending=all.filter(r=>r.status==='pending'), done=all.filter(r=>r.status==='done');
  const tagCounts={}; all.forEach(r=>(r.tags||[]).forEach(t=>tagCounts[t]=(tagCounts[t]||0)+1));
  const tagList=Object.entries(tagCounts).sort((a,b)=>b[1]-a[1]); const totalTags=tagList.reduce((s,[,c])=>s+c,0);
  const sevCounts={}; all.forEach(r=>sevCounts[r.severity]=(sevCounts[r.severity]||0)+1);
  const colors=['#4C7A4C','#2f6fb3','#e08a1e','#d9483b','#7c5bbf'];
  let h='<div class="analysis-header"><h2>'+escapeHtml(staff)+' — 质检分析报告</h2><p>'+todayStr()+'</p></div>';
  h+='<div class="analysis-grid"><div class="analysis-kpi"><div class="num">'+all.length+'</div><div class="lbl">总数</div></div><div class="analysis-kpi"><div class="num" style="color:var(--orange)">'+pending.length+'</div><div class="lbl">待讲解</div></div><div class="analysis-kpi"><div class="num" style="color:var(--green)">'+done.length+'</div><div class="lbl">已讲解</div></div><div class="analysis-kpi"><div class="num" style="color:var(--blue)">'+Math.round(done.length/(all.length||1)*100)+'%</div><div class="lbl">闭环率</div></div></div>';
  if(tagList.length){ h+='<div class="analysis-section"><h4>📈 问题分类</h4><div class="bar-track" style="height:auto">'+tagList.map(([t,c],i)=>'<div class="bar-row"><div class="bar-label">'+t+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(c/totalTags*100)+'%">'+Math.round(c/totalTags*100)+'%</div></div><div class="bar-val">'+c+'次</div></div>').join('')+'</div></div>'; }
  if(Object.keys(sevCounts).length){ h+='<div class="analysis-section"><h4>⚡ 严重程度</h4>'+Object.entries(sevCounts).map(([s,c])=>'<span class="sev sev-'+s+'" style="margin-right:8px">'+s+'：'+c+'</span>').join('')+'</div>'; }
  // 时间线（带图）
  h+='<div class="analysis-section"><h4>📅 时间线（最近10条，含配图）</h4>';
  for(const r of all.slice(0,10)){ const imgs=await analysisImgs(r); h+='<div class="timeline-item"><div class="timeline-dot '+r.status+'"></div><div class="timeline-content"><div class="timeline-date">'+r.date+' | '+escapeHtml(r.shop)+'</div><div class="timeline-text">'+escapeHtml((r.problem||'').substring(0,60))+'</div>'+imgs+'</div></div>'; }
  h+='</div>';
  const sb=document.getElementById('analysisSendBtn'); if(sb)sb.style.display=(isAdmin)?'':'none';
  el.innerHTML=h;
}
async function analysisImgs(r){
  let out='';
  for(const [lbl,key] of [['客户问题','scene_images'],['客服回复','reply_images'],['知识点','knowledge_images']]){
    const imgs=r[key]||[]; if(!imgs.length)continue;
    out+='<div style="font-size:11px;color:var(--text2);margin-top:3px">📸 '+lbl+'：</div><div class="timeline-imgs">';
    for(const id of imgs){ const url=await getImageUrl(id); if(url)out+='<img src="'+url+'" onclick="previewImage(\''+url+'\',\''+String(id).replace(/'/g,"\\'")+'\')">'; }
    out+='</div>';
  }
  return out;
}
async function renderAllStaff(el){
  const allStaff=[...new Set(records.map(r=>r.staff))].sort();
  let h='<div class="analysis-header"><h2>📊 全部客服汇总</h2><p>'+todayStr()+' | '+records.length+'条 | '+allStaff.length+'人</p></div>';
  h+='<div class="analysis-grid"><div class="analysis-kpi"><div class="num">'+records.length+'</div><div class="lbl">总数</div></div><div class="analysis-kpi"><div class="num" style="color:var(--orange)">'+records.filter(r=>r.status==='pending').length+'</div><div class="lbl">待讲解</div></div><div class="analysis-kpi"><div class="num" style="color:var(--green)">'+records.filter(r=>r.status==='done').length+'</div><div class="lbl">已讲解</div></div></div>';
  el.innerHTML=h;
}
function closeAnalysisModal(){ document.getElementById('analysisModal').classList.remove('active'); }
async function sendAnalysisReport(){
  if(!isAdmin){ showToast('🔒 只读',true); return; }
  const staff=document.getElementById('analysisStaffSelect').value;
  if(!staff||staff==='_all_'){ showToast('请选择具体客服再发送',true); return; }
  const url=new URL('qc-v2.html?share=analysis&staff='+encodeURIComponent(staff),location.href).href;
  const title='📊 '+staff+' 的质检分析报告', content='质检主管发来「'+staff+'」的质检分析报告（含配图），点开直达：\n'+url;
  await qcNotifyStaff(staff,title,content,'qc_analysis'); await qcNotifyAdmins(title,content,'qc_analysis');
  showToast('✅ 已发送给「'+staff+'」（本人）和负责人'); showSendLinkModal('📊 分析报告已发送',url,staff);
}

/* ==================== 深链 ==================== */
function handleDeepLink(){
  try{ const p=new URLSearchParams(location.search); const share=p.get('share'), staff=p.get('staff'); if(!share)return;
    if(share==='analysis'){ openAnalysisMode(); if(staff){ const s=document.getElementById('analysisStaffSelect'); if(s){ s.value=staff; renderAnalysisSheet(); } } }
    else if(share==='coach'){ openCoachMode(); if(staff){ const s=document.getElementById('coachStaffSelect'); if(s){ s.value=staff; renderCoachSheet(); } } }
  }catch(e){ console.warn('深链解析异常',e.message); }
}

/* ==================== Excel 导出 ==================== */
function exportXLSX(){
  const list=getFiltered(); if(!list.length){ showToast('没有可导出的数据'); return; }
  const header=['客服','日期','店铺','分类','严重程度','场景','客服回复','问题表述','正确做法','知识点','状态','客户ID'];
  let rows=list.map(r=>[r.staff,r.date,r.shop,(r.tags||[]).join('/'),r.severity,r.scene,r.reply,r.problem,r.correct,r.knowledge,(r.status==='done'?'已讲解':'待讲解'),r.customer_id]);
  let csv='\ufeff'+header.join(',')+'\n'+rows.map(row=>row.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='质检记录_'+todayStr()+'.csv'; a.click();
  showToast('✅ 已导出 CSV（含全部字段）');
}

/* ==================== 启动 ==================== */
function init(){
  if(DEMO){ records=JSON.parse(JSON.stringify(DEMO_RECORDS)); updateAdminUI(); isAdmin=true; updateAdminUI(); afterLoad(false); showToast('📋 演示模式：脱敏示例'); return; }
  (async()=>{
    if(!initSupabaseClient()){ try{ await loadSupabaseScript(); }catch(e){ showToast('Supabase 初始化失败：'+e.message); return; } }
    checkAuth().then(async ()=>{ await loadStaffOptionsFromProfiles(); loadRecords(); });
  })();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init); else init();
</script>
