<!doctype html>
<!-- 质检截图查看器（2026-11-02）：
     Supabase 网关禁止 Edge Function 返回 HTML（强制 text/plain+sandbox 防钓鱼），
     所以查看器放在工作台同域。取图流程：qc-view.html → qc-evidence?json=1 拿签名直链 → 浏览器直连飞书显示。
     用法：qc-view.html?id=<飞书record_id>&t=<access_token>（由 qc-stats「图 查看」打开） -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>质检截图</title>
<style>
html,body{margin:0;height:100%;background:#1b2230;overflow:hidden;font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif}
#bar{position:fixed;top:0;left:0;right:0;z-index:9;display:flex;gap:8px;align-items:center;
 padding:8px 14px;background:#111827e6;color:#e5e7eb;font-size:13px;line-height:1}
#bar b{margin-right:4px;max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar button,#bar a button{background:#374151;color:#fff;border:0;border-radius:6px;padding:5px 12px;font-size:13px;cursor:pointer}
#bar button:hover{background:#4b5563}
#pct{min-width:70px;text-align:center;color:#9ca3af}
#tip{margin-left:auto;color:#6b7280;font-size:12px}
#wrap{height:100%;overflow:auto;display:flex;justify-content:center;padding:46px 10px 20px;box-sizing:border-box}
#im{cursor:zoom-in;transform-origin:top center;border-radius:4px;box-shadow:0 4px 24px #0008}
#im.at{cursor:zoom-out}
#msg{color:#9ca3af;font-size:14px;margin:80px auto;text-align:center}
/* 2026-11-03 放大镜：悬停看局部 2x/3x 原始清晰度（长图缩略态下读字用） */
#lens{position:fixed;width:280px;height:280px;border:2px solid #10b981;border-radius:50%;
 pointer-events:none;z-index:99;display:none;background-repeat:no-repeat;background-color:#111827;
 box-shadow:0 6px 24px #000a}
</style>
</head>
<body>
<div id="bar" style="display:none;"><b id="fname">质检截图</b>
 <button onclick="qvSet(1)">原图 100%</button>
 <button onclick="qvFitW()">适应宽度</button>
 <button onclick="qvFit()">适应窗口</button>
 <button id="mgbtn" onclick="qvToggleMg()" title="开了之后鼠标悬到哪，哪就放大显示（再点一次切 3 倍，再点关闭）">🔍 放大镜</button>
 <button onclick="qvReadMode()" title="长图专用：按原始清晰度显示，整幅上下滚动，不缩小">📖 阅读模式</button>
 <button onclick="qvZoomIn()">放大 ＋</button>
 <button onclick="qvZoomOut()">缩小 －</button>
 <span id="pct"></span>
 <a id="dl" download="质检截图.png"><button>下载原图</button></a>
 <span id="tip">滚轮缩放 · 点图片切大小 · 放大镜悬哪看哪 · 阅读模式=原始清晰度滚动 · 还可以「下载原图」用系统图片查看器看</span>
</div>
<div id="wrap"><div id="msg">正在取图…</div></div>
<div id="lens"></div>
<script>
(function(){
  var qs = new URLSearchParams(location.search);
  var id = qs.get('id') || '';
  var t = qs.get('t') || '';
  var wrap = document.getElementById('wrap'), msg = document.getElementById('msg');
  var z = 0, im = null;
  if (!id || !t){ msg.textContent = '链接不完整，请回到工作台质检页重新点「图 查看」。'; return; }
  // 加载超过 3 秒给个等待提示（大图/函数冷启动会慢几秒，别让人以为卡死了）
  var t0 = Date.now(), slowTimer = setInterval(function(){
    if (im) { clearInterval(slowTimer); return; }
    var s = Math.round((Date.now() - t0) / 1000);
    if (s >= 3) msg.textContent = '正在取图…（已 ' + s + ' 秒，截图较大时会稍慢，最多等十几秒）';
  }, 1000);
  fetch('https://icfgireprowcqwdodfqx.supabase.co/functions/v1/qc-evidence?json=1&id=' + encodeURIComponent(id) + '&t=' + encodeURIComponent(t))
    .then(function(r){ return r.json().catch(function(){ throw new Error('HTTP ' + r.status); }); })
    .then(function(j){
      if (!j.ok) throw new Error(j.error || '取图失败');
      clearInterval(slowTimer);
      document.getElementById('fname').textContent = j.name || '质检截图';
      var dl = document.getElementById('dl'); dl.href = j.url; dl.download = (j.name || '质检截图');
      document.getElementById('bar').style.display = '';
      im = document.createElement('img');
      im.id = 'im'; im.src = j.url; im.alt = j.name || '质检截图';
      im.onload = function(){ set(1); };   // 默认原图 100%：100% 是最清晰状态，放大只会插值变糊
      im.onclick = function(){ if (z === 0) set(1); else if (z >= 1) fit(); else set(1); };
      wrap.innerHTML = ''; wrap.appendChild(im);
      wrap.onwheel = function(e){ e.preventDefault(); set(z === 0 ? (e.deltaY < 0 ? 1 : 0.8) : z * (e.deltaY < 0 ? 1.25 : 0.8)); };
      wrap.onmousemove = mgMove;
      wrap.onmouseleave = function(){ lens.style.display = 'none'; };
    })
    .catch(function(e){
      clearInterval(slowTimer);
      var m = String(e.message || e);
      if (m.indexOf('401') >= 0){
        // 2026-11-03：现在质检页是点按钮时现取新 token，401 只剩「真掉线」一种情况
        msg.innerHTML = '登录已过期，取图被拒（HTTP 401）。<br>请回到工作台<b>刷新页面重新登录</b>，再点一次「图 查看」。';
      } else {
        msg.textContent = '取图失败：' + m + '。请回到工作台质检页重试一次。';
      }
    });

  function apply(){
    if (!im) return;
    if (z === 0){ im.style.width=''; im.style.maxWidth='100%'; im.style.height='auto';
      document.getElementById('pct').textContent='适应窗口'; im.classList.remove('at'); }
    else { im.style.maxWidth='none'; im.style.width=Math.round(im.naturalWidth*z)+'px'; im.style.height='auto';
      document.getElementById('pct').textContent=Math.round(z*100)+'%'; im.classList.toggle('at', z>=1); }
  }
  function set(v){ z=Math.min(6,Math.max(0.15,v)); apply(); }
  function fit(){ z=0; apply(); }
  function fitW(){ if(!im) return; z=wrap.clientWidth/im.naturalWidth; apply(); }
  // ★ 2026-11-03 阅读模式：长图聊天截图专用——按「原始清晰度」显示（缩到窗口宽就封顶，绝不放大插值），
  //   整幅上下滚动着看。缩略态看不清字 / 硬放大又糊 时用这个。
  function readMode(){
    if (!im) return;
    z = Math.min(1, wrap.clientWidth / im.naturalWidth);
    apply();
    document.getElementById('tip').textContent = '📖 阅读模式：已是原图原始清晰度，直接上下滚动看；要更大再点「原图 100%」';
  }

  // ★ 2026-11-03 放大镜：鼠标悬哪看哪，局部按原图 2x / 3x 显示（源图就这么大，2x 是不糊的上限；3x 更大但略糊）
  var mgK = 0;   // 0=关，2=2倍，3=3倍
  var lens = document.getElementById('lens');
  function toggleMg(){
    mgK = (mgK === 0) ? 2 : (mgK === 2 ? 3 : 0);
    var b = document.getElementById('mgbtn');
    b.textContent = mgK === 0 ? '🔍 放大镜' : '🔍 放大镜 ' + mgK + 'x';
    b.style.background = mgK === 0 ? '' : '#10b981';
    if (!mgK) lens.style.display = 'none';
  }
  function mgMove(e){
    if (!mgK || !im || !im.naturalWidth){ return; }
    var r = im.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom){
      lens.style.display = 'none'; return;
    }
    var scale = r.width / im.naturalWidth;                 // 当前显示比例
    var nx = (e.clientX - r.left) / scale;                 // 光标在原图上的坐标
    var ny = (e.clientY - r.top) / scale;
    var R = 140;                                           // 镜片半径
    lens.style.display = 'block';
    lens.style.left = (e.clientX - R) + 'px';
    lens.style.top = (e.clientY - R) + 'px';
    lens.style.backgroundImage = 'url("' + im.src + '")';
    lens.style.backgroundSize = (im.naturalWidth * mgK) + 'px ' + (im.naturalHeight * mgK) + 'px';
    lens.style.backgroundPosition = (R - nx * mgK) + 'px ' + (R - ny * mgK) + 'px';
  }

  // ★ 2026-11-03 修复：工具条按钮的 inline onclick 看不见 IIFE 内部函数（之前「原图100%/适应宽度/
  //   放大缩小」按钮其实点了会报 ReferenceError，只是大家多用滚轮没发现）——统一挂到 window
  window.qvSet = function(v){ set(v); };
  window.qvFitW = fitW;
  window.qvFit = fit;
  window.qvZoomIn = function(){ set(z === 0 ? 1.25 : z * 1.25); };
  window.qvZoomOut = function(){ set(z === 0 ? 0.8 : z / 1.25); };
  window.qvToggleMg = toggleMg;
  window.qvReadMode = readMode;
})();
</script>
</body>
</html>
