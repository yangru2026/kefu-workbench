<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌟 张依诺的学习乐园</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #fff4e0 0%, #ffe9f3 35%, #e7f3ff 100%);
    color: #3a3340; font-size: 16px;
    min-height: 100vh; padding-bottom: 96px;
  }
  /* 顶部 */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(6px);
    border-bottom: 3px solid #ffe0c2;
    padding: 8px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .topbar .mascot { font-size: 26px; }
  .topbar .name { font-weight: 900; font-size: 18px; color: #ff7a59; }
  .topbar .name small { font-weight: 600; color: #f0a35e; font-size: 12px; margin-left: 3px; }
  .topbar .stat { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .pill {
    background: #fff1d6; color: #d98300; font-weight: 900;
    padding: 5px 11px; border-radius: 999px; font-size: 15px; border: 2px solid #ffe0a3;
  }
  .pill.star { background: #e6f0ff; color: #3a7bf0; border-color: #cfe0ff; }
  .pill.fire { background: #ffe7e0; color: #ff5a3c; border-color: #ffc7ba; }
  .pill .edit { font-size: 11px; color: #b98a4a; margin-left: 4px; cursor: pointer; }

  .tts-tip {
    background: #fff7d6; color: #9a6b00; font-weight: 700; font-size: 13px;
    padding: 8px 12px; text-align: center; border-bottom: 2px solid #ffe49a;
    display: none;
  }
  .tts-tip.show { display: block; }
  .tts-tip b { color: #d98300; }

  .wrap { max-width: 880px; margin: 0 auto; padding: 14px; }
  .hero {
    background: linear-gradient(135deg, #ffd36e 0%, #ff8fb1 60%, #9b7bff 100%);
    border-radius: 26px; padding: 18px; color: #fff;
    box-shadow: 0 10px 26px rgba(255,140,170,0.4); margin-bottom: 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .hero .fox { font-size: 54px; }
  .hero h1 { margin: 0 0 4px; font-size: 21px; }
  .hero p { margin: 0; font-size: 14px; opacity: .96; line-height: 1.5; }

  .section-title { font-size: 18px; font-weight: 900; margin: 18px 4px 10px; color: #5a4a6a; display: flex; align-items: center; gap: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .card {
    background: #fff; border-radius: 22px; padding: 16px;
    box-shadow: 0 6px 18px rgba(120,90,160,0.12); border: 2px solid #fff;
  }
  .card h3 { margin: 0 0 4px; font-size: 17px; }
  .card p { margin: 0 0 12px; font-size: 13px; color: #958aa6; }

  button { font-family: inherit; cursor: pointer; border: none; }
  .btn {
    width: 100%; padding: 15px 14px; border-radius: 18px;
    font-size: 17px; font-weight: 900; color: #fff;
    background: linear-gradient(135deg,#5fb0ff,#3a7bf0);
    box-shadow: 0 5px 0 #2f63c8; transition: transform .05s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #2f63c8; }
  .btn.green { background: linear-gradient(135deg,#42d98a,#1fb574); box-shadow: 0 5px 0 #159a5f; }
  .btn.orange { background: linear-gradient(135deg,#ffb24d,#ff8a3d); box-shadow: 0 5px 0 #e06f23; }
  .btn.purple { background: linear-gradient(135deg,#b98bff,#9b5de5); box-shadow: 0 5px 0 #7d3fcf; }
  .btn.pink { background: linear-gradient(135deg,#ff9ec4,#ff6fa5); box-shadow: 0 5px 0 #e0528a; }
  .btn.teal { background: linear-gradient(135deg,#4fd6cf,#27b5ae); box-shadow: 0 5px 0 #1d938d; }
  .btn.ghost { background: #eef2ff; color: #3a7bf0; box-shadow: 0 5px 0 #cdd9f5; }
  .btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }

  .levels { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
  .lv {
    min-width: 52px; padding: 8px 9px; border-radius: 14px; font-weight: 800; font-size: 14px;
    background: #eef3ff; color: #3a7bf0; border: 2px solid #dbe6ff; text-align: center;
  }
  .lv.locked { background: #f1f3f7; color: #b3bacb; border-color: #e6e9f0; }
  .lv.done { background: #e7fbf1; color: #16a36a; border-color: #c4f0db; }
  .lv.active { outline: 3px solid #ffd66e; }

  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: #fff; border-top: 3px solid #ffe0c2;
    display: flex; padding: 5px 2px calc(5px + env(safe-area-inset-bottom));
    box-shadow: 0 -4px 16px rgba(120,90,160,.12);
  }
  .tab {
    flex: 1; border: none; background: transparent; padding: 5px 1px;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    color: #b0a3bf; font-size: 11px; font-weight: 800;
  }
  .tab .ic { font-size: 24px; }
  .tab.active { color: #ff7a59; }
  .tab.active .ic { transform: translateY(-2px) scale(1.1); }

  .overlay {
    position: fixed; inset: 0; z-index: 50; background: rgba(40,30,60,.45);
    display: none; align-items: flex-end; justify-content: center;
  }
  .overlay.show { display: flex; }
  .sheet {
    background: #fff; width: 100%; max-width: 880px; max-height: 92vh; overflow-y: auto;
    border-radius: 28px 28px 0 0; padding: 18px 16px 26px;
    animation: slideUp .25s ease;
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
  .sheet h2 { margin: 0 0 4px; font-size: 20px; display: flex; align-items: center; gap: 8px; }
  .sheet .close { float: right; font-size: 24px; color: #c2b6d0; background: none; line-height: 1; }
  .progress { height: 12px; background: #eef2fb; border-radius: 999px; overflow: hidden; margin: 10px 0 14px; }
  .progress > span { display: block; height: 100%; background: linear-gradient(90deg,#ffb24d,#ff6fa5); transition: width .3s; }

  .passage {
    background: #fff8ec; border: 2px solid #ffe2b0; border-radius: 16px;
    padding: 12px 14px; font-size: 16px; line-height: 1.8; color: #5b4a2e; margin-bottom: 14px;
  }
  .passage b { color: #d98300; }
  .qtext { font-size: 19px; font-weight: 900; margin: 6px 0 14px; line-height: 1.5; }
  .speak {
    display: inline-flex; align-items: center; gap: 6px; margin-left: 8px;
    background: #eef3ff; color: #3a7bf0; border-radius: 999px; padding: 4px 12px;
    font-size: 14px; font-weight: 800; vertical-align: middle;
  }
  .notts { font-size: 14px; color: #c0392b; background: #fff0ec; border:2px solid #ffd0c4; border-radius: 12px; padding: 8px 12px; margin: 4px 0 12px; font-weight: 700; }
  .notts b { color: #a3271b; }
  .opts { display: grid; gap: 11px; }
  .opt {
    width: 100%; text-align: left; padding: 16px 16px; border-radius: 16px;
    background: #f5f8ff; border: 3px solid #e3ecff; font-size: 18px; font-weight: 800; color: #3a3340;
    display: flex; align-items: center; gap: 10px;
  }
  .opt:active { transform: scale(.98); }
  .opt .key { width: 30px; height: 30px; border-radius: 10px; background: #3a7bf0; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; }
  .opt.correct { background: #e7fbf1; border-color: #16a36a; color: #0e7a4d; }
  .opt.wrong { background: #ffecec; border-color: #ff6b6b; color: #c0392b; }
  .opt:disabled { cursor: default; }
  .feedback { margin-top: 14px; font-size: 17px; font-weight: 900; min-height: 26px; }
  .feedback.ok { color: #16a36a; }
  .feedback.no { color: #e0573b; }

  .answer-box { display: flex; gap: 10px; align-items: center; margin: 8px 0 4px; }
  .answer-box input {
    flex: 1; padding: 16px; border: 3px solid #ffd0e0; border-radius: 16px;
    font-size: 24px; font-weight: 900; text-align: center; font-family: inherit;
  }
  .answer-box .btn { width: auto; padding: 16px 22px; font-size: 17px; }

  .big-letter { font-size: 96px; font-weight: 900; text-align: center; color: #ff7a59; margin: 6px 0 4px; letter-spacing: 2px; }
  .ref-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px,1fr)); gap: 8px; margin: 8px 0 4px; }
  .ref-chip { background: #f5f8ff; border: 2px solid #e3ecff; border-radius: 14px; padding: 8px 4px; text-align: center; font-size: 18px; font-weight: 900; color: #3a7bf0; }
  .ref-chip small { display: block; font-size: 11px; color: #9aa3b5; font-weight: 600; }
  .ref-title { font-weight: 900; margin: 12px 0 2px; font-size: 15px; color: #5a4a6a; }
  .pinyin-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #f5f8ff; border-radius: 14px; margin-bottom: 8px; }
  .pinyin-row .py { font-size: 22px; font-weight: 900; color: #3a7bf0; min-width: 74px; }
  .pinyin-row .hz { font-size: 22px; font-weight: 800; }
  .pinyin-row .eg { font-size: 13px; color: #8a93a6; }

  .reward { display: flex; align-items: center; gap: 10px; padding: 12px; background: #fff; border: 2px solid #ffe9f3; border-radius: 16px; margin-bottom: 10px; }
  .reward .emoji { font-size: 28px; }
  .reward .info { flex: 1; }
  .reward .info b { font-size: 15px; }
  .reward .info div { font-size: 12px; color: #958aa6; }
  .reward .cost { font-weight: 900; color: #d98300; }
  .reward .btn { width: auto; padding: 9px 14px; font-size: 14px; }
  .empty { text-align: center; color: #b0a3bf; padding: 26px 0; font-size: 14px; }
  .hidden { display: none !important; }
  .toast {
    position: fixed; left: 50%; top: 22%; transform: translateX(-50%);
    background: #3a3340; color: #fff; padding: 12px 20px; border-radius: 14px;
    font-weight: 800; z-index: 99; opacity: 0; transition: opacity .25s; pointer-events: none; font-size: 15px; text-align:center;
  }
  .toast.show { opacity: .96; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row .btn { flex: 1; min-width: 120px; }
  input.txt {
    width: 100%; padding: 12px 12px; border: 3px solid #ffd0e0; border-radius: 14px;
    font-size: 16px; font-family: inherit; margin-bottom: 10px;
  }
  .tip { font-size: 13px; color: #958aa6; margin: 4px 2px 10px; line-height: 1.5; }
  .timer { font-size: 16px; font-weight: 900; color: #ff5a3c; }
  @media (max-width: 520px) {
    .big-letter { font-size: 74px; }
    .topbar .name { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <span class="mascot">🦊</span>
  <span class="name" id="kidName">张依诺<small>学习乐园</small></span>
  <div class="stat">
    <button class="pill fire" id="firePill" style="display:none;" onclick="toast('连续打卡 '+state.streak+' 天啦，真棒！')">🔥 <span id="fireVal">0</span></button>
    <button class="pill" onclick="editName()">⭐ <span id="pointVal">0</span> 分<span class="edit">改名</span></button>
    <button class="pill star">🌟 <span id="starVal">0</span></button>
  </div>
</div>

<div class="tts-tip" id="ttsTip">🔇 这个设备暂不能发音～点右上角 <b>⋯</b> → <b>在浏览器打开</b> 就能听啦！也可以请爸爸妈妈照着念 📣</div>

<div class="wrap" id="wrap">
  <div class="hero">
    <span class="fox">🦊</span>
    <div>
      <h1 id="heroHi">👋 依诺，今天也要加油哦！</h1>

    </div>
  </div>

  <div class="section-title">🎯 选择学习关卡</div>
  <div class="grid" id="moduleGrid"></div>

  <div class="section-title">✨ 更多练习</div>
  <div class="grid" id="moreGrid"></div>

  <div class="card" style="margin-top:14px;">
    <h3>📊 我的成长</h3>
    <p>每个模块闯过一关，就能解锁下一关；全部答对还有额外奖励！</p>
    <div id="growthBars"></div>
  </div>
</div>

<div class="tabbar" id="tabbar">
  <button class="tab active" data-tab="home" onclick="switchTab('home')"><span class="ic">🏠</span>首页</button>
  <button class="tab" data-tab="pinyin" onclick="switchTab('pinyin')"><span class="ic">🔤</span>拼音</button>
  <button class="tab" data-tab="reading" onclick="switchTab('reading')"><span class="ic">📖</span>阅读</button>
  <button class="tab" data-tab="math" onclick="switchTab('math')"><span class="ic">➕</span>数学</button>
  <button class="tab" data-tab="english" onclick="switchTab('english')"><span class="ic">🔤</span>英语</button>
  <button class="tab" data-tab="reward" onclick="switchTab('reward')"><span class="ic">🎁</span>奖励</button>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function pickN(arr, n){ const c = arr.slice(); const out=[]; while(out.length<n && c.length){ out.push(c.splice(Math.floor(Math.random()*c.length),1)[0]); } return out; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

const TTS_OK = ('speechSynthesis' in window);
let _voices = [];
let _warmed = false;
function loadVoices(){ try { _voices = (window.speechSynthesis && window.speechSynthesis.getVoices()) || []; } catch(e){ _voices=[]; } }
if (TTS_OK) { loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(lang){
  if(!_voices.length) return null;
  const pre = (lang||'zh').slice(0,2).toLowerCase();
  return _voices.find(v=> (v.lang||'').toLowerCase().indexOf(pre)===0) || null;
}
function warmTTS(){
  if(_warmed || !TTS_OK) return; _warmed = true;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume=0; window.speechSynthesis.speak(u); } catch(e){}
}
function speak(text, lang){
  if(!text) return;
  if(!TTS_OK){ return; }   // 无语音：交由各页面显示文字，不报错
  warmTTS();
  try {
    const ss = window.speechSynthesis;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || 'zh-CN'; u.rate = 0.85; u.pitch = 1.05;
    const v = pickVoice(lang); if(v) u.voice = v;
    u.onerror = ()=>{};
    ss.speak(u);
  } catch(e){}
}

function renderLevels(key, box){

  if(m.max===0){ box.innerHTML='<span class="lv done">⚡ 计时挑战</span>'; return; }

    lv.onclick = ()=>{ if(i<=st.unlocked) startQuiz(key,i); else toast('先通关前面的关卡哦～'); };

/* ===================== 题目生成 ===================== */
function buildQuestions(mod, level){
  if(mod==='reading') return buildReading(level);
  if(mod==='words') { const n=5+level, out=[]; for(let i=0;i<n;i++) out.push(genWords(level)); return out; }
  if(mod==='mental') return [];
  const n = 5 + level;
  const out=[];
  for(let i=0;i<n;i++){
    if(mod==='pinyin') out.push(genPinyin(level));
    else if(mod==='math') out.push(genMath(level));
    else if(mod==='english') out.push(genEnglish(level));
  }
  return out;
}
function genPinyin(level){
  if(level===1){ // 分类
    const pool = shuffle([
      {v:rand(SHENGMU),t:'声母'},{v:rand(YUNMU_ALL),t:'韵母'},{v:rand(ZHENGTI),t:'整体认读'}
    ]);
    const item = rand(pool);
    return { prompt:'「'+item.v+'」属于哪一类？', options:['声母','韵母','整体认读'], answer:['声母','韵母','整体认读'].indexOf(item.t), speakText:item.v, speakLang:'zh-CN' };
  }
  if(level===2){ // 给汉字选声母
    const [hz,py] = rand(HANZI_PY);
    const sheng = py[0]==='y'||py[0]==='w' ? py[0] : (py.startsWith('zh')?'zh':py.startsWith('ch')?'ch':py.startsWith('sh')?'sh':py[0]);
    const opts = shuffle([sheng].concat(pickN(SHENGMU.filter(x=>x!==sheng),3)));
    return { prompt:'🔊「'+hz+'」的声母是？', options:opts, answer:opts.indexOf(sheng), speakText:hz, speakLang:'zh-CN' };
  }
  if(level===3){ // 给汉字选韵母
    const [hz,py] = rand(HANZI_PY);
    let yun = py.replace(/^[^aoeiuü]*/,'');
    if(py[0]==='y' && yun.indexOf('u')>=0) yun = yun.replace('u','ü');
    if(py[0]==='w' && yun.indexOf('u')>=0) yun = yun.replace('u','ü');
    if(!YUNMU_ALL.includes(yun)) yun = rand(YUNMU_ALL);
    const opts = shuffle([yun].concat(pickN(YUNMU_ALL.filter(x=>x!==yun),3)));
    return { prompt:'🔊「'+hz+'」的韵母是？', options:opts, answer:opts.indexOf(yun), speakText:hz, speakLang:'zh-CN' };
  }
  if(level===4){ // 听音选正确拼音
    const [hz,py] = rand(HANZI_PY);
    const opts = shuffle([py].concat(pickN(HANZI_PY.filter(x=>x[1]!==py).map(x=>x[1]),3)));
    return { prompt:'听一听，选出「'+hz+'」的拼音', options:opts, answer:opts.indexOf(py), speakText:hz, speakLang:'zh-CN' };
  }
  if(level===5){ // 给拼音选汉字（反选）
    const [hz,py] = rand(HANZI_PY);
    const opts = shuffle([hz].concat(pickN(HANZI_PY.filter(x=>x[0]!==hz).map(x=>x[0]),3)));
    return { prompt:'「'+py+'」是哪个字？', options:opts, answer:opts.indexOf(hz), speakText:py, speakLang:'zh-CN' };
  }
  // level6 综合
  if(Math.random()<0.5){
    const [hz,py] = rand(HANZI_PY);
    const opts = shuffle([py].concat(pickN(HANZI_PY.filter(x=>x[1]!==py).map(x=>x[1]),3)));
    return { prompt:'听一听，选出「'+hz+'」的拼音', options:opts, answer:opts.indexOf(py), speakText:hz, speakLang:'zh-CN' };
  }
  const [hz,py] = rand(HANZI_WORDS);
  const [wpy] = [py];
  const opts = shuffle([wpy].concat(pickN(HANZI_WORDS.filter(x=>x[1]!==wpy).map(x=>x[1]),3)));
  return { prompt:'听一听，选出「'+hz+'」的词语拼音', options:opts, answer:opts.indexOf(wpy), speakText:hz, speakLang:'zh-CN' };
}
function mathOpts(ans){
  const cand=[ans+1,ans-1,ans+2,ans-2,ans+3,ans-3,ans+5,ans-5];
  const opts = shuffle([ans].concat(pickN(cand.filter(v=>v>=0&&v!==ans),3)));
  return { options:opts, answer:opts.indexOf(ans) };
}
function genMath(level){
  const r = Math.random();
  const subj=['小羊','小鸡','苹果','气球','糖果','星星','小鱼','小兔'][rnd(0,7)];
  if(level===1){ // 10以内 加减（选择）
    const a=rnd(2,6), b=rnd(1,5);
    let ans,text;
    if(r<0.5){ ans=a+b; text='草地上有'+a+'只'+subj+'，又跑来'+b+'只，一共有几只'+subj+'？'; }
    else { const x=Math.max(a,b), y=Math.min(a,b); ans=x-y; text='盘子里有'+x+'个'+subj+'，吃掉'+y+'个，还剩几个？'; }
    const o=mathOpts(ans); return { prompt:text+'（算出是多少，选一选）', options:o.options, answer:o.answer, speakText:text, speakLang:'zh-CN' };
  }
  if(level===2){ // 20以内 加减（选择）
    const a=rnd(5,16), b=rnd(1,9);
    const thing=['铅笔','饼干','积木','橘子','贴纸','小花'][rnd(0,5)];
    let ans,text;
    if(r<0.5){ ans=a+b; text='小明有'+a+'支'+thing+'，妈妈又给他'+b+'支，现在一共有几支？'; }
    else { const x=Math.max(a,b), y=Math.min(a,b); ans=x-y; text='停车场原来有'+x+'辆'+thing+'，开走'+y+'辆，还剩几辆？'; }
    const o=mathOpts(ans); return { prompt:text+'（算出是多少，选一选）', options:o.options, answer:o.answer, speakText:text, speakLang:'zh-CN' };
  }
  // 以下关卡：自己输入数字（type:'input'）
  if(level===3){ // 两步运算
    const a=rnd(6,14), b=rnd(2,6), c=rnd(1,4); const ans=a+b-c;
    const text='小红有'+a+'颗糖，妈妈又给她'+b+'颗，她分给妹妹'+c+'颗，小红还剩几颗糖？';
    return { prompt:text+'（把答案写进框里）', type:'input', answer:ans, speakText:text, speakLang:'zh-CN' };
  }
  if(level===4){ // 排队 / 比多少
    if(r<0.5){
      const front=rnd(2,6), back=rnd(2,6); const ans=front+back+1;
      const text='小明排队，他前面有'+front+'人，后面有'+back+'人，这一队一共有几人？';
      return { prompt:text+'（把答案写进框里）', type:'input', answer:ans, speakText:text, speakLang:'zh-CN' };
    }
    const a=rnd(8,16), b=rnd(2,7); const ans=a+b;
    const big=['红花','男生','大苹果','白兔'][rnd(0,3)];
    const small=['黄花','女生','小苹果','灰兔'][rnd(0,3)];
    const text='花园里有'+a+'朵'+big+'，'+small+'比'+big+'多'+b+'朵，'+small+'有几朵？';
    return { prompt:text+'（把答案写进框里）', type:'input', answer:ans, speakText:text, speakLang:'zh-CN' };
  }
  if(level===5){ // 倍数 / 等分 / 人民币
    const k=Math.random();
    if(k<0.34){
      const a=rnd(3,8), b=rnd(2,4); const ans=a*b;
      const text='一个本子'+a+'元，铅笔盒的价钱是本的'+b+'倍，铅笔盒几元？';
      return { prompt:text+'（把答案写进框里）', type:'input', answer:ans, speakText:text, speakLang:'zh-CN' };
    } else if(k<0.67){
      const b=rnd(2,4), q=rnd(2,5); const a=b*q; const ans=q;
      const text='有'+a+'个橘子，平均放在'+b+'个盘子里，每个盘子放几个？';
      return { prompt:text+'（把答案写进框里）', type:'input', answer:ans, speakText:text, speakLang:'zh-CN' };
    }
    const yuan=rnd(2,9), jiao=rnd(1,9); const ans=yuan*10+jiao;
    const text=yuan+'元'+jiao+'角，一共是多少角？';
    return { prompt:text+'（把答案写进框里）', type:'input', answer:ans, speakText:text, speakLang:'zh-CN' };
  }
  // level6 混合两步 / 等量代换
  if(r<0.5){
    const a=rnd(20,45), b=rnd(3,12), c=rnd(2,9);
    let ans, text;
    if(Math.random()<0.5){ ans=a-b+c; text='公交车上原来有'+a+'人，到站下去'+b+'人，又上来'+c+'人，现在车上有几人？'; }
    else { ans=a+b-c; text='文具店进了'+a+'支笔，卖出'+b+'支，又进了'+c+'支，现在有几支笔？'; }
    return { prompt:text+'（把答案写进框里）', type:'input', answer:ans, speakText:text, speakLang:'zh-CN' };
  }
  const m=rnd(2,3), n=rnd(2,3); const ans=m*n;
  const text='已知 1🍊 = '+m+'颗🍇，1🍎 = '+n+'颗🍊，那么 1🍎 = ？颗🍇';
  return { prompt:text+'（把答案写进框里）', type:'input', answer:ans, speakText:text.replace(/🍇|🍊|🍎/g,function(c){return c;}), speakLang:'zh-CN' };
}
function genEnglish(level){
  if(level===1){ // 听音选字母
    const [L,w,e] = rand(ENGLISH_LETTERS);
    const opts = shuffle([L].concat(pickN(ENGLISH_LETTERS.filter(x=>x[0]!==L).map(x=>x[0]),3)));
    return { prompt:'🔊 听一听，是哪个字母？', options:opts, answer:opts.indexOf(L), speakText:L, speakLang:'en-US' };
  }
  if(level===2){ // 字母→例词
    const [L,w,e] = rand(ENGLISH_LETTERS);
    const opts = shuffle([w].concat(pickN(ENGLISH_LETTERS.filter(x=>x[1]!==w).map(x=>x[1]),3)));
    return { prompt:'字母「'+L+'」的例词是？ '+e, options:opts, answer:opts.indexOf(w), speakText:w, speakLang:'en-US' };
  }
  if(level===3){ // 听音选单词
    const [w,c,e] = rand(ENGLISH_WORDS);
    const opts = shuffle([w].concat(pickN(ENGLISH_WORDS.filter(x=>x[0]!==w).map(x=>x[0]),3)));
    return { prompt:e+' 「'+c+'」用英语怎么说？', options:opts, answer:opts.indexOf(w), speakText:w, speakLang:'en-US' };
  }
  if(level===4){ // 看中文选英语
    const [w,c,e] = rand(ENGLISH_WORDS);
    const opts = shuffle([w].concat(pickN(ENGLISH_WORDS.filter(x=>x[0]!==w).map(x=>x[0]),3)));
    return { prompt:'「'+c+'」用英语怎么说？ '+e, options:opts, answer:opts.indexOf(w), speakLang:'zh-CN' };
  }
  // level5 听音选中文意思
  const [w,c,e] = rand(ENGLISH_WORDS);
  const opts = shuffle([c].concat(pickN(ENGLISH_WORDS.filter(x=>x[0]!==w).map(x=>x[1]),3)));
  return { prompt:'🔊 听一听，「'+w+'」是什么意思？', options:opts, answer:opts.indexOf(c), speakText:w, speakLang:'en-US' };
}
function genWords(level){
  if(level<=2){ // 反义词
    const [a,b] = rand(FANYICI);
    const opts = shuffle([b].concat(pickN(FANYICI.filter(x=>x[0]!==a).map(x=>x[1]),3)));
    return { prompt:'「'+a+'」的反义词是？', options:opts, answer:opts.indexOf(b) };
  }
  if(level===3){ // 量词
    const [n,lc] = rand(LIANGCI);
    const others = LIANGCI.filter(x=>x[0]!==n).map(x=>x[1]);
    const opts = shuffle([lc].concat(pickN(others,3)));
    return { prompt:'一（ ）'+n+' —— 填量词', options:opts, answer:opts.indexOf(lc) };
  }
  // level4 综合：反义词 + 量词 混合
  if(Math.random()<0.5){
    const [a,b] = rand(FANYICI);
    const opts = shuffle([b].concat(pickN(FANYICI.filter(x=>x[0]!==a).map(x=>x[1]),3)));
    return { prompt:'「'+a+'」的反义词是？', options:opts, answer:opts.indexOf(b) };
  }
  const [n,lc] = rand(LIANGCI);
  const others = LIANGCI.filter(x=>x[0]!==n).map(x=>x[1]);
  const opts = shuffle([lc].concat(pickN(others,3)));
  return { prompt:'一（ ）'+n+' —— 填量词', options:opts, answer:opts.indexOf(lc) };
}
function buildReading(level){
  const band = Math.ceil(level/2); // 1,2,3
  let pool = READING_PASSAGES.filter(p=>p.lv===band);
  if(!pool.length) pool = READING_PASSAGES;
  const p = rand(pool);
  return p.qs.map(q=>({ passage:p, prompt:q.q, options:q.opts, answer:q.a }));
}

/* ===================== 答题引擎 ===================== */
let quiz = null;
let sessionStart = Date.now();
function startQuiz(mod, level){
  if(mod==='mental'){ startMental(); return; }
  closeSheet();
  const questions = buildQuestions(mod, level);
  quiz = { mod, level, questions, idx:0, score:0, wrongMode:false };
  renderQuiz();
}
function renderQuiz(){
  const q = quiz.questions[quiz.idx];
  const total = quiz.questions.length;
  let html = '<button class="close" onclick="quitQuiz()">×</button>';
  html += '<h2>'+MODULES[quiz.mod].icon+' '+MODULES[quiz.mod].name+' · 第'+quiz.level+'关</h2>';
  html += '<div class="progress"><span style="width:'+(quiz.idx/total*100)+'%"></span></div>';
  html += '<div style="font-size:14px;color:#958aa6;margin-bottom:8px;">第 '+(quiz.idx+1)+' / '+total+' 题　答对 '+quiz.score+' 题</div>';
  if(q.passage){ html += '<div class="passage">📖 <b>'+q.passage.title+'</b><br>'+q.passage.text+'</div>'; }
  if(q.speakText){
    if(TTS_OK){ html += '<div class="qtext">'+q.prompt+' <button class="speak" onclick="speak(\''+q.speakText+'\',\''+q.speakLang+'\')">🔊 听</button></div>'; }
    else { html += '<div class="qtext">'+q.prompt+'</div><div class="notts">🔇 请爸爸妈妈读给依诺听：<b>'+q.speakText+'</b></div>'; }
  } else { html += '<div class="qtext">'+q.prompt+'</div>'; }
  if(q.type==='input'){
    html += '<div class="answer-box"><input id="ansInput" type="number" inputmode="numeric" pattern="[0-9]*" placeholder="算一算，写答案" autocomplete="off"><button class="btn '+(MODULES[quiz.mod].color)+'" onclick="submitInput()">确定 ✅</button></div>';
  } else {
    const keys=['A','B','C','D'];
    html += '<div class="opts" id="optBox">';
    q.options.forEach((o,i)=>{ html += '<button class="opt" data-i="'+i+'" onclick="answer('+i+')"><span class="key">'+keys[i]+'</span>'+o+'</button>'; });
    html += '</div>';
  }
  html += '<div class="feedback" id="fb"></div>';
  openSheet(html);
  const inp = $('ansInput'); if(inp) inp.focus();
}
function answer(i){
  const q = quiz.questions[quiz.idx];
  if(quiz._locked) return; quiz._locked=true;
  const btns = document.querySelectorAll('#optBox .opt');
  const correct = (i===q.answer);
  btns.forEach((b,idx)=>{ b.disabled=true; if(idx===q.answer) b.classList.add('correct'); else if(idx===i) b.classList.add('wrong'); });
  markResult(correct, ['A','B','C','D'][q.answer]+'：'+q.options[q.answer], q, null);
}
function submitInput(){
  const q = quiz.questions[quiz.idx];
  if(quiz._locked) return; quiz._locked=true;
  const val = ($('ansInput').value||'').trim();
  const correct = (val!=='' && Number(val)===Number(q.answer));
  const inp = $('ansInput'); if(inp) inp.disabled=true;
  markResult(correct, '正确答案：'+q.answer, q, val);
}
function markResult(correct, correctText, q, wrongVal){
  const fb = $('fb');
  if(correct){
    quiz.score++; addPoints(5);
    fb.className='feedback ok'; fb.textContent='🎉 答对啦！+5分';
    if(q.speakText && TTS_OK) speak(q.speakText, q.speakLang);
  } else {
    fb.className='feedback no'; fb.textContent='💡 '+correctText;
    recordWrong(q, wrongVal);
  }
  setTimeout(()=>{ quiz._locked=false; nextQuestion(); }, correct?850:1500);
}
function nextQuestion(){
  quiz.idx++;
  if(quiz.idx >= quiz.questions.length){ finishQuiz(); }
  else renderQuiz();
}
function quitQuiz(){ if(confirm('退出本次练习？已得的积分会保留。')){ quiz=null; closeSheet(); renderHome(); } }
function recordWrong(q, wrongVal){
  if(state.wrongs.length > 300) state.wrongs.shift();
  state.wrongs.push({ mod:quiz.mod, level:quiz.level, q:JSON.parse(JSON.stringify(q)), wrong:wrongVal, time:Date.now() });
  saveState();
}
function updateStreak(){
  const today = new Date().toDateString();
  const y = new Date(Date.now()-86400000).toDateString();
  if(state.lastDay===today) return;
  state.streak = (state.lastDay===y) ? state.streak+1 : 1;
  state.lastDay = today; saveState();
}
function finishQuiz(){
  const mod=quiz.mod, level=quiz.level, total=quiz.questions.length, score=quiz.score;
  const rate = score/total;
  let bonus=0, newStar=false, unlockedNext=false;
  if(rate>=0.6){
    updateStreak();
    const st=state.modules[mod];
    if(st && st.stars < level){ st.stars = level; newStar=true; addStars(1); }
    bonus = 20; addPoints(bonus);
    if(st && MODULES[mod].max && level < MODULES[mod].max && st.unlocked < level+1){
      st.unlocked = level+1; st.level = Math.min(level+1, MODULES[mod].max); unlockedNext=true;
    }
    if(st) st.points += score*5 + bonus;
    saveState();
  }
  let html='<button class="close" onclick="closeSheet();renderHome();">×</button>';
  html+='<h2>🏆 第'+level+'关完成！</h2>';
  html+='<div style="text-align:center;padding:14px 0;">';
  html+='<div style="font-size:58px;font-weight:900;color:#ff7a59;">'+score+' / '+total+'</div>';
  html+='<div style="color:#958aa6;margin:6px 0 14px;">'+(rate>=0.6?'太棒了，过关！🎉':(rate>=0.4?'不错，再练练更稳！':'加油，多听多读就会了！'))+'</div>';
  html+='<div class="row" style="justify-content:center;">';
  html+='<div class="pill">⭐ +'+(score*5)+' 分</div>';
  if(bonus) html+='<div class="pill">🎁 通关 +'+bonus+'分</div>';
  if(newStar) html+='<div class="pill star">🌟 新星星！</div>';
  if(state.streak>1) html+='<div class="pill fire">🔥 连续'+state.streak+'天</div>';
  html+='</div></div>';
  if(unlockedNext) html+='<div class="tip" style="text-align:center;">🔓 解锁了第'+(level+1)+'关，回首页就能看到！</div>';
  if((Date.now()-sessionStart) > 15*60000) html+='<div class="tip" style="text-align:center;">👀 学了有一会儿啦，休息一下眼睛吧～</div>';
  if(state.wrongs.length) html+='<div class="tip" style="text-align:center;">📕 刚才错了一题，已收进「错题本」，可以再练哦</div>';
  html+='<div class="row" style="margin-top:16px;">';
  html+='<button class="btn '+(MODULES[mod].color)+'" onclick="startQuiz(\''+mod+'\','+(rate>=0.6?Math.min(level+1,(MODULES[mod].max||level+1)):level)+')">再玩一次</button>';
  html+='<button class="btn ghost" onclick="closeSheet();renderHome();">回首页</button></div>';
  openSheet(html);
  renderLevels(mod); renderGrowth();
  if(rate>=0.6) confetti();
}
function confetti(){
  const emojis=['🎉','⭐','🌟','💫','🎊','💖'];
  for(let i=0;i<26;i++){
    const s=document.createElement('div');
    s.textContent=rand(emojis);
    s.style.cssText='position:fixed;left:'+(Math.random()*100)+'vw;top:-40px;font-size:'+(16+Math.random()*22)+'px;z-index:200;pointer-events:none;transition:top 1.7s cubic-bezier(.3,.7,.4,1), transform 1.7s;';
    document.body.appendChild(s);
    requestAnimationFrame(()=>{ s.style.top=(95+Math.random()*15)+'vh'; s.style.transform='rotate('+(Math.random()*720-360)+'deg)'; });
    setTimeout(()=>s.remove(),1750);
  }
}

/* ===================== 错题本 ===================== */
function renderWrongBook(){
  let html='<button class="close" onclick="closeSheet()">×</button>';
  html+='<h2>📕 错题本</h2>';
  html+='<p class="tip">这里收集了做错的题，多练几遍就记住啦！当前共 '+state.wrongs.length+' 题</p>';
  if(state.wrongs.length){
    html+='<div class="row" style="margin-bottom:10px;">';
    html+='<button class="btn purple" onclick="startWrongQuiz()">🔁 再练一次（'+state.wrongs.length+'题）</button>';
    html+='<button class="btn ghost" onclick="if(confirm(\'清空错题本？\')){ state.wrongs=[]; saveState(); renderWrongBook(); }">清空</button></div>';
  }
  const box='<div id="wrongList"></div>';
  html+=box;
  openSheet(html);
  const list=$('wrongList'); if(!list) return;
  if(!state.wrongs.length){ list.innerHTML='<div class="empty">还没有错题，真厉害！🌟</div>'; return; }
  state.wrongs.slice().reverse().forEach((w,i)=>{
    const el=document.createElement('div'); el.className='reward';
    const q=w.q;
    const correct = q.type==='input' ? q.answer : q.options[q.answer];
    el.innerHTML='<span class="emoji">❌</span><div class="info"><b>'+MODULES[w.mod].name+' 第'+w.level+'关</b><div>'+q.prompt+'　正确答案：'+correct+'</div></div>';
    list.appendChild(el);
  });
}
function startWrongQuiz(){
  if(!state.wrongs.length){ toast('错题本空空如也～'); return; }
  closeSheet();
  quiz = { mod:'wrong', level:0, questions: state.wrongs.slice(), idx:0, score:0, wrongMode:true };
  renderQuiz();
}

/* ===================== 口算速算（计时挑战） ===================== */
let mental = null;
function startMental(){
  closeSheet();
  mental = { score:0, total:0, time:60, q:genMental() };
  renderMental();
  mental.timer = setInterval(()=>{
    mental.time--; const t=$('mentalTimer'); if(t) t.textContent=mental.time;
    if(mental.time<=0) endMental();
  }, 1000);
}
function genMental(){
  const a=rnd(1,9), b=rnd(1,9);
  const op=rnd(0,2);
  let text, ans;
  if(op===0){ ans=a+b; text=a+' + '+b+' = ?'; }
  else if(op===1){ const x=Math.max(a,b), y=Math.min(a,b); ans=x-y; text=x+' - '+y+' = ?'; }
  else { ans=a*b; text=a+' × '+b+' = ?'; }
  return { text, ans };
}
function renderMental(){
  const q=mental.q;
  let html='<button class="close" onclick="endMental()">×</button>';
  html+='<h2>⚡ 口算速算 · 计时挑战</h2>';
  html+='<div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0 10px;">';
  html+='<span class="timer">⏱ <span id="mentalTimer">'+mental.time+'</span> 秒</span>';
  html+='<span style="font-weight:900;color:#16a36a;">✅ '+mental.score+' 题</span></div>';
  html+='<div class="qtext" style="font-size:40px;text-align:center;margin:18px 0;">'+q.text+'</div>';
  html+='<div class="answer-box"><input id="mentalInput" type="number" inputmode="numeric" pattern="[0-9]*" placeholder="写答案" autocomplete="off"><button class="btn teal" onclick="submitMental()">确定</button></div>';
  html+='<div class="tip" style="text-align:center;">越快越多越厉害！最高纪录 '+state.mentalBest+' 题</div>';
  openSheet(html);
  const inp=$('mentalInput'); if(inp) inp.focus();
}
function submitMental(){
  const val=($('mentalInput').value||'').trim();
  if(val==='') return;
  if(Number(val)===mental.q.ans){ mental.score++; mental.total++; addPoints(2); }
  else { mental.total++; }
  mental.q = genMental();
  renderMental();
}
function endMental(){
  if(mental && mental.timer) clearInterval(mental.timer);
  if(!mental) return;
  if(mental.score > state.mentalBest){ state.mentalBest = mental.score; saveState(); }
  let html='<button class="close" onclick="closeSheet();renderHome();">×</button>';
  html+='<h2>⚡ 时间到！</h2>';
  html+='<div style="text-align:center;padding:14px 0;">';
  html+='<div style="font-size:56px;font-weight:900;color:#27b5ae;">'+mental.score+'</div>';
  html+='<div style="color:#958aa6;">答对 '+mental.score+' 题　最高纪录 '+state.mentalBest+' 题</div>';
  html+='<div class="pill" style="margin-top:10px;">⭐ +'+(mental.score*2)+' 分</div>';
  html+='</div>';
  html+='<div class="row" style="margin-top:16px;">';
  html+='<button class="btn teal" onclick="startMental()">再来一次</button>';
  html+='<button class="btn ghost" onclick="closeSheet();renderHome();">回首页</button></div>';
  openSheet(html);
  mental=null;
  renderGrowth();
}

/* ===================== 奖励：临时约定 ===================== */
function renderReward(){
  let html='<button class="close" onclick="switchTab(\'home\')">×</button>';
  html+='<h2>🎁 我的约定</h2>';
  html+='<p class="tip">和爸爸妈妈商量好一件想做的事，请爸妈在这里建一个「约定」。你做到了点「我完成啦」，等爸妈确认就能拿到积分～ 当前积分：⭐ '+state.totalPoints+'</p>';
  html+='<button class="btn purple" style="margin-bottom:10px;" onclick="openParentPanel()">👨‍👩‍👧 家长入口（建约定 / 确认完成）</button>';
  html+='<div id="goalTodo"></div>';
  html+='<div class="section-title">⏳ 等爸妈确认</div><div id="goalDone"></div>';
  html+='<div class="section-title">✅ 已达成</div><div id="goalApproved"></div>';
  html+='<div class="section-title">📕 错题本（'+state.wrongs.length+'）</div>';
  html+='<button class="btn ghost" onclick="renderWrongBook()">查看错题本</button>';
  openSheet(html);
  renderGoals();
}
function renderGoals(){
  const todo=$('goalTodo'), done=$('goalDone'), appr=$('goalApproved');
  if(!todo) return;
  const t = state.goals.filter(g=>g.status==='todo');
  const d = state.goals.filter(g=>g.status==='done');
  const a = state.goals.filter(g=>g.status==='approved');
  todo.innerHTML = t.length ? '' : '<div class="empty">还没有约定，请爸妈帮你建一个吧～</div>';
  t.forEach(g=>{
    const el=document.createElement('div'); el.className='reward';
    el.innerHTML='<span class="emoji">🎯</span><div class="info"><b>'+g.title+'</b><div class="cost">'+g.points+' 分'+(g.note?(' · '+g.note):'')+'</div></div>';
    const btn=document.createElement('button'); btn.className='btn green'; btn.style.cssText='width:auto;padding:9px 12px;font-size:13px;'; btn.textContent='我完成啦 ✅';
    btn.onclick=()=>childMarkDone(g.id);
    el.appendChild(btn); todo.appendChild(el);
  });
  done.innerHTML = d.length ? '' : '<div class="empty">暂无</div>';
  d.forEach(g=>{
    const el=document.createElement('div'); el.className='reward';
    el.innerHTML='<span class="emoji">⏳</span><div class="info"><b>'+g.title+'</b><div>已申请 · 等爸妈确认（'+g.points+'分）</div></div>';
    done.appendChild(el);
  });
  appr.innerHTML = a.length ? '' : '<div class="empty">暂无</div>';
  a.forEach(g=>{
    const el=document.createElement('div'); el.className='reward';
    el.innerHTML='<span class="emoji">'+g.emoji+'</span><div class="info"><b>'+g.title+'</b><div>已达成 · 爸妈已确认 ✅ +'+g.points+'分</div></div>';
    appr.appendChild(el);
  });
}
function childMarkDone(id){
  const g=state.goals.find(x=>x.id===id); if(!g||g.status!=='todo') return;
  g.status='done'; saveState();
  toast('📨 已告诉爸妈你完成啦，等确认～');
  renderGoals();
}
/* ---------- 家长面板（PIN 门禁） ---------- */
function openParentPanel(){
  const pin = prompt('请输入家长密码（默认 1234）：', '');
  if(pin===null) return;
  if(pin !== String(state.parentPin)){ toast('密码不对，无法进入家长入口'); return; }
  renderParentPanel();
}
function renderParentPanel(){
  let html='<button class="close" onclick="renderReward()">×</button>';
  html+='<h2>👨‍👩‍👧 家长入口</h2>';
  html+='<p class="tip">'+state.kidName+' 当前积分：⭐ '+state.totalPoints+' ｜ 已达成 '+state.goals.filter(g=>g.status==='approved').length+' 项</p>';
  html+='<div class="section-title">➕ 新建临时约定</div>';
  html+='<input class="txt" id="gTitle" placeholder="事项，如：整理好自己的书包">';
  html+='<input class="txt" id="gPoints" placeholder="完成可得多少分，如 30" type="number">';
  html+='<input class="txt" id="gNote" placeholder="给孩子的提示（可选），如：自己收拾好">';
  html+='<button class="btn orange" onclick="createGoal()">建立约定</button>';
  html+='<div class="section-title">⏳ 待确认完成（'+state.goals.filter(g=>g.status==='done').length+'）</div>';
  html+='<div id="parentDone"></div>';
  html+='<div class="section-title">🛠 管理约定</div><div id="parentGoals"></div>';
  html+='<div class="section-title">🔑 修改家长密码</div>';
  html+='<input class="txt" id="newPin" placeholder="输入新密码（数字）" type="number">';
  html+='<button class="btn ghost" onclick="changePin()">保存新密码</button>';
  openSheet(html);
  renderParentDone(); renderParentGoals();
}
function createGoal(){
  const title=($('gTitle').value||'').trim();
  const points=parseInt($('gPoints').value,10);
  const note=($('gNote').value||'').trim();
  if(!title){ toast('请填事项名称'); return; }
  if(!points||points<1){ toast('请填正确的分数'); return; }
  state.goals.unshift({ id:Date.now(), emoji:'🎯', title, points, note, status:'todo', time:Date.now() });
  saveState(); toast('🎯 约定已建立：'+title);
  $('gTitle').value=''; $('gPoints').value=''; $('gNote').value='';
  renderParentGoals();
}
function renderParentDone(){
  const box=$('parentDone'); if(!box) return;
  const list=state.goals.filter(g=>g.status==='done');
  if(!list.length){ box.innerHTML='<div class="empty">暂时没有等确认的～</div>'; return; }
  box.innerHTML='';
  list.forEach(g=>{
    const el=document.createElement('div'); el.className='reward';
    el.innerHTML='<span class="emoji">⏳</span><div class="info"><b>'+g.title+'</b><div>'+g.points+' 分'+(g.note?(' · '+g.note):'')+'</div></div>';
    const ok=document.createElement('button'); ok.className='btn green'; ok.style.cssText='width:auto;padding:8px 12px;font-size:13px;'; ok.textContent='批准';
    ok.onclick=()=>approveGoal(g.id);
    const no=document.createElement('button'); no.className='btn ghost'; no.style.cssText='width:auto;padding:8px 12px;font-size:13px;margin-left:6px;'; no.textContent='打回';
    no.onclick=()=>rejectGoal(g.id);
    el.appendChild(ok); el.appendChild(no); box.appendChild(el);
  });
}
function approveGoal(id){
  const g=state.goals.find(x=>x.id===id); if(!g) return;
  g.status='approved'; addPoints(g.points);
  saveState(); toast('✅ 已批准：'+g.title+'（+'+(g.points)+'分）');
  renderParentPanel(); renderReward();
}
function rejectGoal(id){
  const g=state.goals.find(x=>x.id===id); if(!g) return;
  g.status='todo'; saveState(); toast('已打回，依诺再努力一下～');
  renderParentPanel(); renderReward();
}
function renderParentGoals(){
  const box=$('parentGoals'); if(!box) return; box.innerHTML='';
  if(!state.goals.length){ box.innerHTML='<div class="empty">还没有约定</div>'; return; }
  state.goals.forEach(g=>{
    const map={todo:'待完成',done:'待确认',approved:'已达成'};
    const el=document.createElement('div'); el.className='reward';
    el.innerHTML='<span class="emoji">🎯</span><div class="info"><b>'+g.title+'</b><div class="cost">'+g.points+'分 · '+map[g.status]+'</div></div>';
    const del=document.createElement('button'); del.className='btn ghost'; del.style.cssText='width:auto;padding:8px 12px;font-size:13px;'; del.textContent='删除';
    del.onclick=()=>{ if(confirm('删除这个约定？')){ state.goals=state.goals.filter(x=>x.id!==g.id); saveState(); renderParentGoals(); renderReward(); } };
    el.appendChild(del); box.appendChild(el);
  });
}
function changePin(){
  const v=($('newPin').value||'').trim();
  if(!v){ toast('请输入新密码'); return; }
  state.parentPin = v; saveState();
  toast('🔑 家长密码已修改'); $('newPin').value='';
}

/* ===================== 弹层 / Tab ===================== */
function openSheet(html){ $('sheet').innerHTML=html; $('overlay').classList.add('show'); }
function closeSheet(){ $('overlay').classList.remove('show'); }
function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t=> t.classList.toggle('active', t.dataset.tab===tab));
  closeSheet();
  if(tab==='home'){ renderHome(); }
  else if(tab==='reward'){ renderReward(); }
  else { openModule(tab); }
}
function editName(){
  const n=prompt('给宝贝起个名字吧：', state.kidName);
  if(n && n.trim()){ state.kidName=n.trim(); saveState(); refreshTop(); const hi=$('heroHi'); if(hi) hi.textContent='👋 '+state.kidName+'，今天也要加油哦！'; }
}

/* ===================== 初始化 ===================== */
if(!TTS_OK){ const tip=$('ttsTip'); if(tip) tip.classList.add('show'); }
refreshTop();
renderHome();
if(state.kidName) { const hi=$('heroHi'); if(hi) hi.textContent='👋 '+state.kidName+'，今天也要加油哦！'; }
$('overlay').addEventListener('click', e=>{ if(e.target===$('overlay')){ if(!quiz && !mental) closeSheet(); } });
</script>
