<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平台规则 · 高压线</title>
<style>
  :root{ --primary:#10b981; --primary-dark:#059669; --primary-light:rgba(16,185,129,.1);
         --danger:#e05252; --danger-bg:rgba(224,82,82,.08); --warn:#c2660a; --warn-bg:rgba(230,145,56,.12);
         --info:#2563eb; --info-bg:rgba(37,99,235,.08);
         --text:#1e293b; --muted:#64748b; --border:#e2e8f0; --bg:#f7f9f8; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;gap:12px;padding:14px 20px;background:#fff;
          border-bottom:1px solid var(--border);flex-wrap:wrap;position:sticky;top:0;z-index:10;}
  .topbar h1{font-size:18px;font-weight:800;letter-spacing:.5px;}
  .badge{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;white-space:nowrap;}
  .badge.admin{background:var(--danger-bg);color:var(--danger);}
  .badge.readonly{background:#f1f5f9;color:var(--muted);}
  .search-wrap{flex:1;min-width:200px;max-width:420px;position:relative;}
  .search-wrap input{width:100%;padding:9px 14px 9px 36px;border:1.5px solid var(--border);
          border-radius:22px;font-size:14px;outline:none;transition:border-color .15s;background:#fff;}
  .search-wrap input:focus{border-color:var(--primary);}
  .search-wrap .icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.45;}
  .btn{padding:8px 18px;border:none;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;
       font-family:inherit;transition:all .15s;white-space:nowrap;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-primary[disabled]{opacity:.5;cursor:not-allowed;}
  .btn-ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary);}
  .btn-ghost:hover{background:var(--primary-light);}
  .wrap{width:100%;max-width:1080px;margin:0 auto;padding:16px 20px 60px;}
  /* 平台筛选 chips */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{padding:6px 16px;border-radius:18px;border:1.5px solid var(--border);background:#fff;
        font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;user-select:none;}
  .chip:hover{border-color:var(--primary);color:var(--primary-dark);}
  .chip.on{background:var(--primary);border-color:var(--primary);color:#fff;}
  /* 规则统计条 */
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px 16px;
        font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;font-weight:600;}
  .stat b{font-size:17px;font-weight:800;}
  .stat.s-hv b{color:var(--danger);} .stat.s-imp b{color:var(--warn);} .stat.s-tip b{color:var(--info);} .stat.s-all b{color:var(--primary-dark);}
  /* 规则卡（网格布局） */
  #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
  .rule{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;
        display:flex;flex-direction:column;position:relative;transition:box-shadow .15s,transform .15s;}
  .rule:hover{box-shadow:0 6px 20px rgba(15,23,42,.09);transform:translateY(-2px);}
  .rule::before{content:'';display:block;height:4px;flex-shrink:0;}
  .rule.lv-高压线::before{background:linear-gradient(90deg,#ef4444,#fb7185);}
  .rule.lv-重要::before{background:linear-gradient(90deg,#f59e0b,#fbbf24);}
  .rule.lv-提醒::before{background:linear-gradient(90deg,#3b82f6,#60a5fa);}
  .rule.lv-高压线{background:linear-gradient(180deg,#fff5f5,#ffffff 46px);}
  .rule.pinned{border-color:#f59e0b;box-shadow:inset 0 0 0 1px #f59e0b;}
  .rule-body{padding:14px 16px 12px;flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;}
  .rule-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .lv-tag{font-size:11px;font-weight:800;padding:2px 10px;border-radius:10px;flex-shrink:0;}
  .lv-tag.高压线{background:var(--danger-bg);color:var(--danger);}
  .lv-tag.重要{background:var(--warn-bg);color:var(--warn);}
  .lv-tag.提醒{background:var(--info-bg);color:var(--info);}
  .pf-tag{font-size:11px;font-weight:600;padding:2px 10px;border-radius:10px;background:#f1f5f9;color:var(--muted);flex-shrink:0;}
  .pin-flag{font-size:13px;margin-left:auto;}
  .rule-title{font-size:15px;font-weight:800;line-height:1.45;}
  .rule-content{font-size:13px;color:var(--muted);line-height:1.75;white-space:pre-wrap;word-break:break-word;flex:1;}
  /* 卡片底部操作条（admin） */
  .rule-foot{display:flex;gap:6px;padding:9px 12px;border-top:1px dashed var(--border);background:#fafcfa;}
  .rule-foot .fb{flex:1;padding:5px 0;font-size:12px;font-weight:600;border:none;border-radius:8px;
                 cursor:pointer;font-family:inherit;background:#f1f5f9;color:var(--muted);transition:all .15s;white-space:nowrap;}
  .rule-foot .fb:hover{background:#e2e8f0;}
  .rule-foot .fb-pin{background:var(--warn-bg);color:var(--warn);}
  .rule-foot .fb-pin:hover{background:#fde8cd;}
  .rule-foot .fb-nav{flex:0 0 34px;}
  .rule-foot .fb-edit{background:var(--primary-light);color:var(--primary-dark);}
  .rule-foot .fb-edit:hover{background:rgba(16,185,129,.18);}
  .rule-foot .fb-del{background:var(--danger-bg);color:var(--danger);}
  .rule-foot .fb-del:hover{background:rgba(224,82,82,.16);}
  .empty{text-align:center;padding:50px 0;color:var(--muted);font-size:14px;grid-column:1/-1;}
  .empty .big{font-size:42px;display:block;margin-bottom:10px;opacity:.4;}
  /* 弹窗 */
  .modal-mask{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;overflow:hidden;padding:20px;}
  .modal-mask.active{display:block;}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;
         padding:22px;margin:5vh auto;position:relative;overscroll-behavior:contain;}
  .modal h2{font-size:16px;font-weight:800;margin-bottom:16px;}
  .form-item{margin-bottom:12px;}
  .form-item label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px;}
  .form-item input[type=text],.form-item select,.form-item textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);
         border-radius:10px;font-size:14px;outline:none;font-family:inherit;transition:border-color .15s;background:#fff;}
  .form-item textarea{min-height:110px;resize:vertical;line-height:1.6;}
  .form-item input:focus,.form-item select:focus,.form-item textarea:focus{border-color:var(--primary);}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions .btn{flex:1;padding:10px 0;font-size:14px;}
  .btn-cancel{background:#f1f5f9;color:var(--muted);}
  /* 灯箱化提示 */
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);
         background:rgba(30,41,59,.9);color:#fff;font-size:13px;padding:9px 20px;border-radius:22px;
         opacity:0;pointer-events:none;transition:all .25s;z-index:300;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .auth-mask{display:none;position:fixed;inset:0;background:var(--bg);z-index:50;
             align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--muted);}
  .auth-mask.active{display:flex;}
  .auth-mask .big{font-size:44px;}
</style>
</head>
<body>

<div class="topbar">
  <h1>📏 平台规则 · 高压线</h1>
  <span class="badge readonly" id="roleBadge">加载中…</span>
  <div class="search-wrap">
    <span class="icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜规则标题 / 内容…" autocomplete="off">
  </div>
  <button class="btn btn-ghost" id="btnRefresh" title="重新加载">🔄</button>
  <button class="btn btn-primary" id="btnAdd" style="display:none;">＋ 新增规则</button>
</div>

<div class="wrap">
  <div class="chips" id="pfChips"></div>
  <div class="stats" id="stats"></div>
  <div id="list"><div class="empty"><span class="big">⏳</span>正在加载平台规则…</div></div>
</div>

<div class="auth-mask" id="authMask">
  <span class="big">🔐</span>
  <div>请先在<strong>工作台登录</strong>，然后刷新本页</div>
</div>

<!-- 新增/编辑弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h2 id="modalTitle">新增规则</h2>
    <div class="form-item">
      <label>所属平台 *</label>
      <select id="fPlatform">
        <option value="通用">通用（全平台）</option>
        <option value="抖音">抖音</option>
        <option value="拼多多">拼多多</option>
        <option value="天猫">天猫</option>
        <option value="京东">京东</option>
        <option value="快手">快手</option>
        <option value="小红书">小红书</option>
      </select>
    </div>
    <div class="form-item">
      <label>等级 *</label>
      <select id="fLevel">
        <option value="高压线">🔴 高压线（碰了就处罚/开除）</option>
        <option value="重要">🟠 重要（违规扣分/罚款）</option>
        <option value="提醒">🔵 提醒（注意规避）</option>
      </select>
    </div>
    <div class="form-item">
      <label>规则标题 *</label>
      <input type="text" id="fTitle" placeholder="如：严禁引导站外交易" autocomplete="off" autocorrect="off" autocapitalize="off">
    </div>
    <div class="form-item">
      <label>详细说明</label>
      <textarea id="fContent" placeholder="具体什么不能做、违规后果等（可换行）"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" id="btnCancel">取消</button>
      <button class="btn btn-primary" id="btnSave">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
'use strict';
/* ==================== 配置 ==================== */
const SUPABASE_URL = 'https://ienmejlxukhrxjjxvfqf.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imllbm1lamx4dWtocnhqanh2ZnFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMTgyMjgsImV4cCI6MjEwMDc5NDIyOH0.Z6n6eMSgTVSFeXg1y8Inzh5LQenSgonNWE2plZM29co';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const LEVELS = ['高压线','重要','提醒'];
const PLATFORMS = ['通用','抖音','拼多多','天猫','京东','快手','小红书'];

/* ==================== 状态 ==================== */
let rules = [];
let isAdmin = false;
let editingId = null;      // 编辑中的规则 id
let curPlatform = '';      // 当前筛选的平台（空=未初始化）

const $ = id => document.getElementById(id);

/* ==================== 工具 ==================== */
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(()=>t.classList.remove('show'), 1800);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function lvWeight(l){ return LEVELS.indexOf(l) === -1 ? 9 : LEVELS.indexOf(l); }

/* ==================== 初始化 ==================== */
(async function init(){
  try{
    const { data:{ session } } = await sb.auth.getSession();
    const user = session && session.user;
    if(!user){
      const b = $('roleBadge'); b.className='badge readonly'; b.textContent='🔒 未登录';
      $('authMask').classList.add('active'); renderChips(); renderList(); return;
    }
    let role = user.app_metadata && user.app_metadata.role;
    try{
      const { data:p } = await sb.from('profiles').select('role').eq('id', user.id).single();
      if(p) role = p.role;
    }catch(e){ console.warn('profiles load', e); }
    isAdmin = (role === 'admin');
    const badge = $('roleBadge');
    badge.className = isAdmin ? 'badge admin' : 'badge readonly';
    badge.textContent = isAdmin ? '👑 管理员 · 可维护' : '📖 只读';
    if(isAdmin) $('btnAdd').style.display = '';
    await loadRules();
  }catch(e){
    console.error(e);
    $('list').innerHTML = '<div class="empty"><span class="big">⚠️</span>初始化失败：' + esc(e.message) + '</div>';
  }
})();

/* ==================== 缓存 & 加载 ==================== */
var RULES_CACHE_VER = 'v2';
function rulesCacheGet(){ try{ var r=localStorage.getItem('kefu_cache_platform_rules'); if(!r) return null; var o=JSON.parse(r); if(!o||o.ver!==RULES_CACHE_VER) return null; return o.data; }catch(e){return null;} }
function rulesCacheSet(d){ try{ localStorage.setItem('kefu_cache_platform_rules', JSON.stringify({ver:RULES_CACHE_VER,ts:Date.now(),data:d})); }catch(e){} }

async function loadRules(){
  var cached = rulesCacheGet();
  if (cached && cached.length){ rules = cached; renderChips(); renderList(); }
  const { data, error } = await sb.from('platform_rules')
    .select('id,platform,level,title,content,sort_order,pinned,created_at')
    .order('sort_order', { ascending:true })
    .order('created_at', { ascending:true });
  if(error){
    if(!cached||!cached.length){
      $('list').innerHTML = '<div class="empty"><span class="big">⚠️</span>' + esc(error.message) +
        '<br><br>若提示表不存在，请先在 Supabase 执行 create_platform_rules.sql</div>';
    }
    return;
  }
  rules = data || [];
  rulesCacheSet(rules);
  renderChips();
  renderList();
}

/* ==================== 渲染 ==================== */
function renderChips(){
  const pfList = PLATFORMS.filter(p => rules.some(r => r.platform === p))
    .concat(rules.map(r=>r.platform).filter(p => !PLATFORMS.includes(p)));
  if(!curPlatform || !pfList.includes(curPlatform)) curPlatform = pfList[0] || '';
  $('pfChips').innerHTML = pfList.map(p =>
    `<span class="chip${p===curPlatform?' on':''}" data-pf="${esc(p)}">${esc(p)}</span>`).join('');
}
$('pfChips').addEventListener('click', e => {
  const chip = e.target.closest('.chip'); if(!chip) return;
  curPlatform = chip.dataset.pf;
  renderChips(); renderList();
});

let _curList = [];   // 当前渲染的规则列表（供上移/下移定位）

function renderList(){
  const kw = ($('searchInput').value || '').trim().toLowerCase();
  let list = rules.filter(r => r.platform === curPlatform);
  if(kw) list = rules.filter(r =>
      (r.title||'').toLowerCase().includes(kw) ||
      (r.content||'').toLowerCase().includes(kw) ||
      (r.platform||'').toLowerCase().includes(kw));
  list = list.slice().sort((a,b) =>
    (b.pinned?1:0)-(a.pinned?1:0) ||
    (a.platform===curPlatform?0:1)-(b.platform===curPlatform?0:1) ||
    lvWeight(a.level)-lvWeight(b.level) ||
    (a.sort_order||0)-(b.sort_order||0) ||
    new Date(a.created_at)-new Date(b.created_at));
  _curList = list;
  // 统计条（按当前平台全部规则统计，不受搜索影响）
  const pfRules = rules.filter(r => r.platform === curPlatform);
  const cnt = lv => pfRules.filter(r => (r.level||'提醒') === lv).length;
  $('stats').innerHTML = pfRules.length ? `
    <span class="stat s-all">📋 全部 <b>${pfRules.length}</b></span>
    <span class="stat s-hv">🔴 高压线 <b>${cnt('高压线')}</b></span>
    <span class="stat s-imp">🟠 重要 <b>${cnt('重要')}</b></span>
    <span class="stat s-tip">🔵 提醒 <b>${cnt('提醒')}</b></span>` : '';
  if(!list.length){
    $('list').innerHTML = '<div class="empty"><span class="big">📏</span>' +
      (kw ? '没有匹配「' + esc(kw) + '」的规则' : '该平台暂无规则' + (isAdmin ? '，点右上角「＋ 新增规则」添加' : '')) + '</div>';
    return;
  }
  $('list').innerHTML = list.map(r => `
    <div class="rule lv-${esc(r.level||'提醒')}${r.pinned?' pinned':''}" data-id="${r.id}">
      <div class="rule-body">
        <div class="rule-title-row">
          <span class="lv-tag ${esc(r.level||'提醒')}">${r.level==='高压线'?'🔴':(r.level==='重要'?'🟠':'🔵')} ${esc(r.level||'提醒')}</span>
          <span class="pf-tag">${esc(r.platform)}</span>
          ${r.pinned?'<span class="pin-flag" title="已置顶">📌</span>':''}
        </div>
        <div class="rule-title">${esc(r.title)}</div>
        ${r.content ? `<div class="rule-content">${esc(r.content)}</div>` : ''}
      </div>
      ${isAdmin ? `<div class="rule-foot">
        <button class="fb fb-pin" data-act="pin">${r.pinned?'📌 取消置顶':'📌 置顶'}</button>
        <button class="fb fb-nav" data-act="up" title="上移">↑</button>
        <button class="fb fb-nav" data-act="down" title="下移">↓</button>
        <button class="fb fb-edit" data-act="edit" title="编辑">✏️</button>
        <button class="fb fb-del" data-act="del" title="删除">🗑</button>
      </div>` : ''}
    </div>`).join('');
}

$('list').addEventListener('click', e => {
  const card = e.target.closest('.rule'); if(!card) return;
  const actEl = e.target.closest('[data-act]'); if(!actEl) return;
  const r = rules.find(x => x.id === card.dataset.id); if(!r) return;
  const act = actEl.dataset.act;
  if(act === 'edit') openModal(r);
  else if(act === 'del') delRule(r);
  else if(act === 'pin') pinRule(r);
  else if(act === 'up') moveRule(r, -1);
  else if(act === 'down') moveRule(r, 1);
});
$('searchInput').addEventListener('input', renderList);
$('btnRefresh').addEventListener('click', () => { toast('刷新中…'); loadRules(); });

/* ==================== 新增 / 编辑 / 删除 ==================== */
function openModal(r){
  editingId = r ? r.id : null;
  $('modalTitle').textContent = r ? '编辑规则' : '新增规则';
  $('fPlatform').value = r ? (r.platform||'通用') : (curPlatform && PLATFORMS.includes(curPlatform) ? curPlatform : '通用');
  $('fLevel').value = r ? (r.level||'提醒') : '提醒';
  $('fTitle').value = r ? (r.title||'') : '';
  $('fContent').value = r ? (r.content||'') : '';
  $('modalMask').classList.add('active');
  setTimeout(()=> $('fTitle').focus({preventScroll:true}), 50);
}
function closeModal(){ $('modalMask').classList.remove('active'); editingId = null; }
$('btnAdd').addEventListener('click', () => openModal(null));
$('btnCancel').addEventListener('click', closeModal);
/* 点遮罩空白关闭：但拖动选择文字时鼠标拖出弹窗松手也会在遮罩上触发 click，
   须记录按下位置，按下点在遮罩上且未移动才算真点空白，否则误关弹窗（闪退） */
var _maskDown = null;
$('modalMask').addEventListener('mousedown', e => { _maskDown = { x:e.clientX, y:e.clientY, onMask: e.target === $('modalMask') }; });
$('modalMask').addEventListener('click', e => {
  if(e.target !== $('modalMask') || !_maskDown || !_maskDown.onMask) return;
  if(Math.hypot(e.clientX - _maskDown.x, e.clientY - _maskDown.y) > 6) return;
  closeModal();
});

$('btnSave').addEventListener('click', async () => {
  const platform = $('fPlatform').value;
  const level = $('fLevel').value;
  const title = $('fTitle').value.trim();
  const content = $('fContent').value.trim();
  if(!title){ toast('请填写规则标题'); $('fTitle').focus(); return; }
  const btn = $('btnSave'); btn.disabled = true; btn.textContent = '保存中…';
  try{
    const row = { platform, level, title, content: content || null };
    if(editingId){
      const { error } = await sb.from('platform_rules').update(row).eq('id', editingId);
      if(error) throw error;
      toast('✅ 已保存');
    }else{
      const maxSort = rules.reduce((m,r)=>Math.max(m, r.sort_order||0), 0);
      row.sort_order = maxSort + 1;
      const { error } = await sb.from('platform_rules').insert(row);
      if(error) throw error;
      toast('✅ 已添加');
    }
    closeModal();
    await loadRules();
  }catch(e){
    console.error(e);
    toast('❌ ' + (e.message || '保存失败'));
  }finally{
    btn.disabled = false; btn.textContent = '保存';
  }
});

/* 置顶 / 上移 / 下移 */
async function pinRule(r){
  try{
    const { error } = await sb.from('platform_rules').update({ pinned: !r.pinned }).eq('id', r.id);
    if(error) throw error;
    toast(r.pinned ? '已取消置顶' : '📌 已置顶');
    await loadRules();
  }catch(e){
    console.error(e);
    toast('❌ ' + (e.message || '操作失败'));
  }
}

async function moveRule(r, dir){
  const idx = _curList.findIndex(x => x.id === r.id);
  const t = _curList[idx + dir];
  if(!t){ toast(dir < 0 ? '已经在最前面了' : '已经在最后面了'); return; }
  const sa = r.sort_order || 0, sb2 = t.sort_order || 0;
  const na = sb2;
  const nb = (sa === sb2) ? sb2 + (dir < 0 ? -1 : 1) : sa;
  try{
    const { error: e1 } = await sb.from('platform_rules').update({ sort_order: na }).eq('id', r.id);
    if(e1) throw e1;
    const { error: e2 } = await sb.from('platform_rules').update({ sort_order: nb }).eq('id', t.id);
    if(e2) throw e2;
    toast('✅ 已调整顺序');
    await loadRules();
  }catch(e){
    console.error(e);
    toast('❌ ' + (e.message || '操作失败'));
  }
}

async function delRule(r){
  if(!confirm('确定删除规则「' + (r.title||'') + '」？')) return;
  try{
    const { error } = await sb.from('platform_rules').delete().eq('id', r.id);
    if(error) throw error;
    toast('已删除');
    await loadRules();
  }catch(e){
    console.error(e);
    toast('❌ ' + (e.message || '删除失败'));
  }
}
</script>
</body>
