<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商务合作 · 商务种草</title>
<style>
  :root{ --primary:#10b981; --primary-dark:#059669; --primary-light:rgba(16,185,129,.1);
         --text:#1e293b; --muted:#64748b; --border:#e2e8f0; --bg:#f7f9f8; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;gap:10px;padding:12px 18px;background:#fff;
          border-bottom:1px solid var(--border);flex-wrap:wrap;position:sticky;top:0;z-index:10;}
  .topbar h1{font-size:17px;font-weight:800;letter-spacing:.5px;white-space:nowrap;}
  .badge{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;background:var(--primary-light);color:var(--primary-dark);white-space:nowrap;}
  .badge.admin{background:#fff7ed;color:#c2410c;}
  .badge.ro{background:#f1f5f9;color:#64748b;}
  .sp{flex:1;}
  .search{position:relative;min-width:210px;}
  .search input{width:100%;padding:8px 12px 8px 32px;border:1.5px solid var(--border);border-radius:9px;font-size:13.5px;font-family:inherit;outline:none;background:var(--bg);}
  .search input:focus{border-color:var(--primary);background:#fff;}
  .search .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);}
  .btn{border:none;border-radius:9px;padding:9px 15px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:filter .15s;white-space:nowrap;}
  .btn:hover{filter:brightness(.94);}
  .btn.g{background:var(--primary);color:#fff;}
  .btn.o{background:#fff;border:1.5px solid var(--border);color:#334155;}
  .wrap{width:100%;max-width:1440px;margin:0 auto;padding:14px 16px 60px;flex:1;}
  .tip{font-size:12.5px;color:#475569;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:10px;
       padding:9px 13px;margin-bottom:16px;line-height:1.6;}
  .sec{margin-bottom:22px;}
  .sec-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .sec-title{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
  .sec-title::before{content:'';width:4px;height:15px;border-radius:2px;display:inline-block;background:var(--primary);}
  .sec-title .n{font-size:11.5px;font-weight:600;color:var(--muted);background:#e8edf2;border-radius:10px;padding:2px 9px;}
  .grp-cp{border:1px solid #a7f3d0;background:#ecfdf5;color:#047857;border-radius:8px;
          font-size:11.5px;font-weight:700;padding:5px 10px;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .grp-cp:hover{background:#d1fae5;border-color:#6ee7b7;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:9px;}
  .item{background:#fff;border:1.5px solid var(--border);border-radius:11px;padding:10px 11px;
        display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .15s,box-shadow .15s;}
  .item:hover{border-color:#6ee7b7;box-shadow:0 3px 12px rgba(16,185,129,.09);}
  .row1{display:flex;align-items:center;gap:6px;min-width:0;}
  .name{font-size:14.5px;font-weight:800;flex:1;word-break:break-all;line-height:1.35;min-width:0;}
  .ops{display:flex;gap:4px;flex:0 0 auto;}
  .ops button{border:1px solid var(--border);background:#fff;border-radius:6px;
              font-size:11px;padding:3px 7px;cursor:pointer;font-family:inherit;color:#475569;line-height:1;}
  .ops button:hover{border-color:var(--primary);color:var(--primary-dark);}
  .codebox{display:flex;align-items:center;gap:6px;background:#f0fdf9;border:1.5px dashed #6ee7b7;
           border-radius:9px;padding:8px 10px;cursor:pointer;min-width:0;}
  .codebox:hover{background:#d1fae5;border-color:var(--primary);}
  .codebox .code{font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
                 font-size:14px;font-weight:800;letter-spacing:.3px;color:#065f46;flex:1;word-break:break-all;line-height:1.35;}
  .codebox .ci{font-size:12px;color:var(--primary-dark);flex:0 0 auto;}
  .note{font-size:11.5px;color:var(--muted);line-height:1.45;word-break:break-all;}
  .row2{display:flex;align-items:center;gap:6px;margin-top:auto;}
  .ch-tag{font-size:10.5px;font-weight:700;color:#0369a1;background:#eff6ff;border-radius:5px;padding:2px 6px;white-space:nowrap;}
  .cp{margin-left:auto;border:1px solid var(--border);background:#fff;color:#334155;
      border-radius:7px;font-size:11.5px;font-weight:700;padding:4px 9px;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .cp:hover{border-color:var(--primary);color:var(--primary-dark);background:#f0fdf9;}
  .empty{color:var(--muted);font-size:13px;background:#fff;border:1px dashed var(--border);border-radius:10px;padding:22px;text-align:center;}
  /* 弹窗 */
  .mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:99;display:none;align-items:center;justify-content:center;}
  .mask.show{display:flex;}
  .modal{background:#fff;border-radius:14px;width:min(420px,calc(100vw - 36px));padding:20px 22px;max-height:90vh;overflow:auto;}
  .modal h3{font-size:16px;font-weight:800;margin-bottom:12px;}
  .modal label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 5px;}
  .modal input,.modal textarea{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;font-family:inherit;outline:none;background:#fff;}
  .modal textarea{resize:vertical;line-height:1.6;}
  .modal input:focus,.modal textarea:focus{border-color:var(--primary);}
  .modal .hint{font-size:12px;color:var(--muted);line-height:1.6;background:var(--bg);border-radius:8px;padding:8px 10px;margin-bottom:10px;}
  .modal .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}
  .toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;
         padding:10px 20px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .25s;z-index:200;max-width:90vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .authmask{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--muted);font-size:14px;}
  .authmask.active{display:flex;}
  @media (max-width:560px){ .grid{grid-template-columns:1fr 1fr;} .topbar h1{font-size:15px;} }
</style>
</head>
<body>
  <div class="topbar">
    <h1>🤝 商务合作</h1>
    <span class="badge" id="roleBadge">…</span>
    <div class="sp"></div>
    <div class="search"><span class="ico">🔍</span><input id="q" placeholder="搜花名 / 号码 / 备注" autocomplete="off"></div>
    <button class="btn o" id="btnCopyAll">📋 复制全部</button>
    <button class="btn o" id="btnImport" style="display:none;">📥 批量导入</button>
    <button class="btn g" id="btnAdd" style="display:none;">＋ 新增</button>
  </div>
  <div class="wrap">
    <div class="tip">💡 客户 / 达人进线咨询合作时，按对应渠道找到商务种草号：<b>点绿色号码块</b>只复制号码，点「📋 复制整条」复制「花名：号码」。管理员可自行增删维护。</div>
    <div id="groups"></div>
  </div>

  <!-- 新增 / 编辑 -->
  <div class="mask" id="formMask">
    <div class="modal">
      <h3 id="formTitle">新增商务种草</h3>
      <label>渠道分组</label>
      <input id="fChannel" list="channelList" placeholder="如：全渠道-商务达人" autocomplete="off">
      <datalist id="channelList">
        <option value="全渠道-商务达人"></option>
        <option value="快手-商务达人"></option>
        <option value="全渠道种草"></option>
      </datalist>
      <label>花名 / 对接人</label>
      <input id="fPerson" placeholder="如：甜甜3" autocomplete="off">
      <label>商务种草（微信号 / 合作码）</label>
      <input id="fCode" placeholder="如：YOUHOOLENS10" autocomplete="off">
      <label>备注（可选）</label>
      <input id="fRemark" placeholder="如：只对接达人合作" autocomplete="off">
      <label>排序号（数字小的排前面）</label>
      <input id="fSort" type="number" value="0" autocomplete="off">
      <div class="btns">
        <button class="btn o" id="fCancel">取消</button>
        <button class="btn g" id="fSave">保存</button>
      </div>
    </div>
  </div>

  <!-- 批量导入 -->
  <div class="mask" id="importMask">
    <div class="modal">
      <h3>📥 批量导入</h3>
      <div class="hint">直接粘贴带【渠道】分组的原文，一行一条「花名：号码」（中文/英文冒号、空格分隔都行）。已存在的「同渠道＋同花名」会自动跳过。</div>
      <textarea id="fImport" rows="10" placeholder="【全渠道-商务达人】&#10;甜甜3：YOUHOOLENS10&#10;甜甜4：YOUHOOLENS9&#10;&#10;【全渠道种草】&#10;优优：youhoo010"></textarea>
      <div class="btns">
        <button class="btn o" id="impCancel">取消</button>
        <button class="btn g" id="impSave">导入</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="authmask" id="authMask">🔒 请先在工作台登录后查看</div>

<script src="vendor/supabase.min.js?v=2"></script>
<script>
'use strict';
/* 2026-11-06 商务合作（商务种草）：客服进线咨询合作时发对应渠道的对接号 */
const SUPABASE_URL = 'https://icfgireprowcqwdodfqx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImljZmdpcmVwcm93Y3F3ZG9kZnF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0ODMwNjEsImV4cCI6MjEwODA1OTA2MX0.T8yex8pjNBE0ch3vPKL3xPQPOqw3ExS4mwRsjT2FhzE';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* 渠道顺序（茹姐 11-06 给的原文顺序）；其他自定义渠道排在后面 */
const CHANNEL_ORDER = ['全渠道-商务达人', '快手-商务达人', '全渠道种草'];
const CHANNEL_ICON  = { '全渠道-商务达人':'🌐', '快手-商务达人':'⚡', '全渠道种草':'🌱' };

let rows = [];
let isAdmin = false;
let editingId = null;

const $ = id => document.getElementById(id);
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(()=>t.classList.remove('show'), 1900);
}
function channelRank(ch){
  const i = CHANNEL_ORDER.indexOf(ch);
  return i === -1 ? 100 : i;   // 自定义渠道统一排后面，再按名称排
}

/* ==================== 数据 ==================== */
async function load(){
  const { data, error } = await sb.from('biz_contacts').select('*');
  if (error) { toast('读取失败：' + error.message); return; }
  rows = data || [];
  render();
}

function filtered(){
  const q = $('q').value.trim().toLowerCase();
  if (!q) return rows;
  return rows.filter(x =>
    (x.channel + ' ' + x.person + ' ' + x.code + ' ' + (x.remark||'')).toLowerCase().includes(q));
}

/* 分组：先按固定渠道顺序，组内 sort_order → id */
function grouped(){
  const list = filtered().slice().sort((a,b)=>{
    const c = channelRank(a.channel) - channelRank(b.channel);
    if (c) return c;
    if (channelRank(a.channel) === 100){
      const cc = a.channel.localeCompare(b.channel, 'zh-CN');
      if (cc) return cc;
    }
    const s = (Number(a.sort_order)||0) - (Number(b.sort_order)||0);
    return s || (Number(a.id) - Number(b.id));
  });
  const map = new Map();
  list.forEach(x => { if (!map.has(x.channel)) map.set(x.channel, []); map.get(x.channel).push(x); });
  return [...map.entries()].map(([channel, arr]) => ({ channel, arr }));
}

function lineOf(x){ return x.person + '：' + x.code; }
function groupText(ch, arr){ return '【' + ch + '】\n' + arr.map(lineOf).join('\n'); }
function buildAllText(){ return grouped().map(g => groupText(g.channel, g.arr)).join('\n\n'); }

async function copyText(txt, okMsg){
  if (!txt) { toast('没有可复制的内容'); return; }
  try { await navigator.clipboard.writeText(txt); toast(okMsg); return; }
  catch(e){ /* iframe 里 clipboard API 可能被挡，走兜底 */ }
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch(_){}
  document.body.removeChild(ta);
  toast(ok ? okMsg : '复制失败，请手动选中复制');
}

/* ==================== 渲染 ==================== */
function cardHtml(x){
  return '<div class="item" data-id="' + x.id + '">' +
    '<div class="row1">' +
      '<span class="name">' + esc(x.person) + '</span>' +
      (isAdmin ? '<div class="ops"><button data-act="edit" title="编辑">✏️</button><button data-act="del" title="删除">🗑️</button></div>' : '') +
    '</div>' +
    '<div class="codebox" data-act="copycode" title="点一下只复制号码">' +
      '<span class="code">' + esc(x.code) + '</span><span class="ci">📋</span>' +
    '</div>' +
    (x.remark ? '<div class="note">' + esc(x.remark) + '</div>' : '') +
    '<div class="row2">' +
      '<span class="ch-tag">' + esc(CHANNEL_ICON[x.channel] ? (CHANNEL_ICON[x.channel] + ' ' + x.channel) : x.channel) + '</span>' +
      '<button class="cp" data-act="copyone" title="复制「花名：号码」">📋 复制整条</button>' +
    '</div>' +
  '</div>';
}

function render(){
  const gs = grouped();
  if (!gs.length){
    $('groups').innerHTML = '<div class="empty">' + ($('q').value.trim() ? '没有匹配的商务种草，换个关键词试试' : '暂无商务种草，管理员可点右上角「＋ 新增」') + '</div>';
  } else {
    $('groups').innerHTML = gs.map(g =>
      '<div class="sec">' +
        '<div class="sec-head">' +
          '<div class="sec-title">' + esc(CHANNEL_ICON[g.channel] ? (CHANNEL_ICON[g.channel] + ' ' + g.channel) : g.channel) +
            '<span class="n">' + g.arr.length + ' 个</span></div>' +
          '<button class="grp-cp" data-grp="' + esc(g.channel) + '">📋 复制本组</button>' +
        '</div>' +
        '<div class="grid">' + g.arr.map(cardHtml).join('') + '</div>' +
      '</div>').join('');
  }
  refreshDatalist();
}

function refreshDatalist(){
  const set = new Set(CHANNEL_ORDER.concat(rows.map(x => x.channel)));
  $('channelList').innerHTML = [...set].map(c => '<option value="' + esc(c) + '"></option>').join('');
}

/* ==================== 事件委托 ==================== */
$('groups').addEventListener('click', function(e){
  const grpBtn = e.target.closest('[data-grp]');
  if (grpBtn){
    const ch = grpBtn.getAttribute('data-grp');
    const g = grouped().find(v => v.channel === ch);
    if (g) copyText(groupText(ch, g.arr), '「' + ch + '」' + g.arr.length + ' 条已复制 📋');
    return;
  }
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const item = btn.closest('.item');
  if (!item) return;
  const x = rows.find(v => String(v.id) === String(item.getAttribute('data-id')));
  if (!x) return;
  const act = btn.getAttribute('data-act');
  if (act === 'copycode') copyText(x.code, '号码 ' + x.code + ' 已复制 📋');
  else if (act === 'copyone') copyText(lineOf(x), '已复制「' + lineOf(x) + '」📋');
  else if (act === 'edit') openForm(x);
  else if (act === 'del') delItem(x);
});

/* ==================== 表单 ==================== */
function openForm(x){
  if (!isAdmin) return;
  editingId = x ? x.id : null;
  $('formTitle').textContent = x ? '编辑商务种草' : '新增商务种草';
  $('fChannel').value = x ? x.channel : CHANNEL_ORDER[0];
  $('fPerson').value  = x ? x.person : '';
  $('fCode').value    = x ? x.code : '';
  $('fRemark').value  = x ? (x.remark || '') : '';
  $('fSort').value    = x ? (x.sort_order || 0) : 0;
  $('formMask').classList.add('show');
  setTimeout(()=>{ try{ $('fPerson').focus(); }catch(e){} }, 60);
}

async function save(){
  const person = $('fPerson').value.trim();
  const code   = $('fCode').value.trim();
  if (!person) { toast('请填花名 / 对接人'); return; }
  if (!code)   { toast('请填商务种草号'); return; }
  const patch = {
    channel: $('fChannel').value.trim() || CHANNEL_ORDER[0],
    person, code,
    remark: $('fRemark').value.trim(),
    sort_order: Number($('fSort').value || 0),
    updated_at: new Date().toISOString()
  };
  let error;
  if (editingId) ({ error } = await sb.from('biz_contacts').update(patch).eq('id', editingId));
  else           ({ error } = await sb.from('biz_contacts').insert(patch));
  if (error) { toast('保存失败：' + error.message); return; }
  $('formMask').classList.remove('show');
  toast(editingId ? '已保存 ✅' : '已新增 ✅');
  load();
}

async function delItem(x){
  if (!isAdmin) return;
  if (!confirm('确定删除「' + x.person + '：' + x.code + '」吗？')) return;
  const { error } = await sb.from('biz_contacts').delete().eq('id', x.id);
  if (error) { toast('删除失败：' + error.message); return; }
  toast('已删除'); load();
}

/* ==================== 批量导入 ==================== */
/* 支持【渠道】分组行 + 「花名：号码」；兼容 : / ： / 空格 / 制表符 */
function parseImport(txt){
  const out = [];
  let ch = '';
  String(txt || '').split(/\r?\n/).forEach(raw => {
    const line = raw.trim();
    if (!line) return;
    const mh = line.match(/^[【\[]\s*(.+?)\s*[】\]]\s*$/);
    if (mh) { ch = mh[1].trim(); return; }
    const m = line.match(/^(.+?)\s*[:：]\s*(.+)$/) || line.match(/^(\S+)\s+(.+)$/);
    if (!m) return;
    const person = m[1].trim(), code = m[2].trim();
    if (!person || !code) return;
    out.push({ channel: ch || CHANNEL_ORDER[0], person, code });
  });
  return out;
}

async function doImport(){
  const parsed = parseImport($('fImport').value);
  if (!parsed.length) { toast('没识别到「花名：号码」，检查一下格式'); return; }
  const seen = new Set(rows.map(x => x.channel + '\u0000' + x.person));
  const fresh = [];
  parsed.forEach(x => {
    const k = x.channel + '\u0000' + x.person;
    if (seen.has(k)) return;
    seen.add(k);
    fresh.push({ channel: x.channel, person: x.person, code: x.code, sort_order: 0,
                 created_at: new Date().toISOString(), updated_at: new Date().toISOString() });
  });
  const skipped = parsed.length - fresh.length;
  if (!fresh.length) { toast('这 ' + skipped + ' 条都已存在，没有重复导入'); return; }
  const { error } = await sb.from('biz_contacts').insert(fresh);
  if (error) { toast('导入失败：' + error.message); return; }
  $('importMask').classList.remove('show');
  $('fImport').value = '';
  toast('已导入 ' + fresh.length + ' 条' + (skipped ? '（跳过已存在 ' + skipped + ' 条）' : '') + ' ✅');
  load();
}

/* ==================== 初始化 ==================== */
(async function init(){
  try{
    const { data:{ session } } = await sb.auth.getSession();
    const user = session && session.user;
    if (!user){
      $('roleBadge').className = 'badge ro'; $('roleBadge').textContent = '🔒 未登录';
      $('authMask').classList.add('active'); return;
    }
    let role = user.app_metadata && user.app_metadata.role;
    try{
      const { data:p } = await sb.from('profiles').select('role,name,real_name').eq('id', user.id).single();
      if (p) role = p.role;
    }catch(e){ console.warn('profiles load', e); }
    isAdmin = (role === 'admin');
    if (isAdmin){
      $('roleBadge').className = 'badge admin'; $('roleBadge').textContent = '👑 管理员 · 可维护';
      $('btnAdd').style.display = ''; $('btnImport').style.display = '';
    } else {
      $('roleBadge').className = 'badge ro'; $('roleBadge').textContent = '📖 只读查看';
    }
    await load();
  }catch(e){
    console.warn(e);
    toast('初始化失败，请刷新重试');
  }
})();

$('btnAdd').addEventListener('click', ()=>openForm(null));
$('fCancel').addEventListener('click', ()=>$('formMask').classList.remove('show'));
$('fSave').addEventListener('click', save);
$('btnImport').addEventListener('click', ()=>{ $('importMask').classList.add('show'); setTimeout(()=>{ try{ $('fImport').focus(); }catch(e){} }, 60); });
$('impCancel').addEventListener('click', ()=>$('importMask').classList.remove('show'));
$('impSave').addEventListener('click', doImport);
$('btnCopyAll').addEventListener('click', ()=>copyText(buildAllText(), '全部清单已复制 📋'));
$('q').addEventListener('input', render);
// 点遮罩本身才关（拖选文字不误关）
$('formMask').addEventListener('click', function(e){ if (e.target === this) this.classList.remove('show'); });
$('importMask').addEventListener('click', function(e){ if (e.target === this) this.classList.remove('show'); });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){
    $('formMask').classList.remove('show');
    $('importMask').classList.remove('show');
  }
});

/* 冒烟测试用的只读状态出口（顶层 let 在 page.evaluate 里读不到） */
window.bizState = function(){
  return { rows: rows.slice(), isAdmin, groups: grouped(), search: $('q').value, allText: buildAllText() };
};
window.bizParseImport = parseImport;
</script>
