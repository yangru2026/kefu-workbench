<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花色素材</title>
<style>
  :root{ --primary:#10b981; --primary-dark:#059669; --primary-light:rgba(16,185,129,.1);
         --text:#1e293b; --muted:#64748b; --border:#e2e8f0; --bg:#f7f9f8; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;gap:10px;padding:12px 18px;background:#fff;
          border-bottom:1px solid var(--border);flex-wrap:wrap;position:sticky;top:0;z-index:10;}
  .topbar h1{font-size:17px;font-weight:800;letter-spacing:.5px;}
  .badge{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;background:var(--primary-light);color:var(--primary-dark);}
  .badge.admin{background:#fff7ed;color:#c2410c;}
  .badge.ro{background:#f1f5f9;color:#64748b;}
  .sp{flex:1;}
  .search{position:relative;min-width:200px;}
  .search input{width:100%;padding:8px 12px 8px 32px;border:1.5px solid var(--border);border-radius:9px;font-size:13.5px;font-family:inherit;outline:none;background:var(--bg);}
  .search input:focus{border-color:var(--primary);background:#fff;}
  .search .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);}
  .btn{border:none;border-radius:9px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:filter .15s;}
  .btn:hover{filter:brightness(.94);}
  .btn.g{background:var(--primary);color:#fff;}
  .btn.o{background:#fff;border:1.5px solid var(--border);color:#334155;}
  .wrap{width:100%;max-width:1440px;margin:0 auto;padding:14px 16px 60px;flex:1;}
  /* 顶部分类切换（茹姐 2026-11-06：点一下只看那一类） */
  .filters{margin-bottom:10px;}
  .frow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:6px;}
  .flabel{font-size:11px;font-weight:700;color:var(--muted);min-width:32px;}
  .chip{border:1.5px solid var(--border);background:#fff;color:#475569;border-radius:16px;
        padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;line-height:1.3;}
  .chip:hover{border-color:var(--primary);color:var(--primary-dark);}
  .chip.active{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border-color:transparent;}
  .chip .cnt{font-size:10.5px;opacity:.75;margin-left:2px;}
  .selfilter{border:1.5px solid var(--border);border-radius:9px;padding:7px 9px;font-size:12.5px;
             font-family:inherit;color:#334155;background:#fff;outline:none;}
  .selfilter:focus{border-color:var(--primary);}
  /* 卡片网格（缩小版：一屏放更多） */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:9px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:11px;overflow:hidden;
        display:flex;flex-direction:column;transition:all .2s;position:relative;}
  .card:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(15,23,42,.08);border-color:#a7f3d0;}
  .cover{position:relative;aspect-ratio:1/1;background:linear-gradient(135deg,#f1f5f9,#e8eef0);cursor:zoom-in;}
  .cover img{width:100%;height:100%;object-fit:cover;display:block;}
  .cover .ph{position:absolute;inset:0;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;color:#cbd5e1;font-size:11px;}
  .cover .ph .big{font-size:24px;}
  .nimg{position:absolute;right:5px;bottom:5px;background:rgba(15,23,42,.65);color:#fff;font-size:9.5px;
        font-weight:700;border-radius:8px;padding:1px 6px;}
  .cbody{padding:6px 7px 7px;display:flex;flex-direction:column;gap:3px;flex:1;}
  .cname{font-size:12px;font-weight:800;line-height:1.3;word-break:break-all;}
  .ctags{display:flex;gap:3px;flex-wrap:wrap;}
  .ctags span{font-size:9.5px;font-weight:700;border-radius:7px;padding:1px 5px;white-space:nowrap;}
  .tg-brand{background:#ecfdf5;color:#047857;}
  .tg-series{background:#eff6ff;color:#2563eb;}
  .tg-type{background:#fef3c7;color:#b45309;}
  /* 状态分组小标题（茹姐 2026-11-06：上新最前、下架最后） */
  .sgroup{margin-bottom:10px;}
  .sgroup-h{display:flex;align-items:center;gap:7px;margin:0 2px 6px;font-size:12px;font-weight:800;color:#0f766e;}
  .sgroup-h:before{content:"";width:3px;height:12px;border-radius:3px;background:var(--primary);}
  .sgroup-h .n{font-size:10.5px;font-weight:600;color:var(--muted);}
  .sgroup-new .sgroup-h{color:#15803d;}
  .sgroup-new .sgroup-h:before{background:#22c55e;}
  .sgroup-off .sgroup-h{color:#94a3b8;}
  .sgroup-off .sgroup-h:before{background:#cbd5e1;}
  /* 参数 / 话术 / 复制 */
  .cparams{display:flex;flex-wrap:wrap;gap:3px;}
  .cparams span{font-size:9.5px;background:#f1f5f9;color:#64748b;border-radius:5px;padding:1px 5px;white-space:nowrap;}
  .cparams span b{font-weight:700;color:#0f766e;}
  .cdesc-wrap{position:relative;border-top:1px dashed var(--border);padding-top:5px;}
  .cdesc{font-size:10.5px;color:#475569;line-height:1.42;word-break:break-word;padding-right:38px;
         max-height:4.3em;overflow-y:auto;scrollbar-width:thin;}
  .cno-desc{font-size:10px;color:#cbd5e1;}
  .copy-btn{position:absolute;right:0;top:4px;border:1px solid #a7f3d0;background:#ecfdf5;color:#047857;
            border-radius:6px;font-size:9.5px;font-weight:700;padding:2px 5px;cursor:pointer;font-family:inherit;line-height:1.3;}
  .copy-btn:hover{background:#d1fae5;}
  .card.off{opacity:.66;background:#fafafa;}
  .card.off .cover img{filter:grayscale(.72);}
  .card.new{border-color:#86efac;box-shadow:inset 0 0 0 1.5px #bbf7d0;}
  .tag-off{background:#e2e8f0;color:#94a3b8;font-size:9.5px;font-weight:700;border-radius:7px;padding:1px 5px;}
  .tag-new{background:#dcfce7;color:#15803d;font-size:9.5px;font-weight:700;border-radius:7px;padding:1px 5px;}
  .eyemark{position:absolute;left:5px;top:5px;background:rgba(16,185,129,.93);color:#fff;
           font-size:9px;font-weight:700;border-radius:7px;padding:1px 5px;}
  /* 卡片操作：上新 / 下架 / 修改 / 删除（仅管理员） */
  .ops{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:2px;}
  .ops button{border:1px solid var(--border);background:#fff;border-radius:6px;font-size:10px;
              padding:2px 3px;cursor:pointer;font-family:inherit;color:#475569;line-height:1.3;white-space:nowrap;}
  .ops button:hover{border-color:var(--primary);color:var(--primary-dark);}
  .ops button.flag-new.on{background:#dcfce7;border-color:#86efac;color:#15803d;font-weight:800;}
  .ops button.flag-off.on{background:#fee2e2;border-color:#fca5a5;color:#b91c1c;font-weight:800;}
  .empty{text-align:center;padding:70px 20px;color:var(--muted);font-size:14px;}
  .empty .big{font-size:44px;margin-bottom:10px;}
  /* 灯箱 */
  .lmask{position:fixed;inset:0;background:rgba(15,23,42,.78);z-index:99;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px;}
  .lmask.show{display:flex;}
  .lmask img{max-width:min(92vw,860px);max-height:74vh;border-radius:12px;background:#fff;}
  .lthumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:90vw;}
  .lthumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:pointer;max-height:64px;
               border:2px solid transparent;opacity:.75;}
  .lthumbs img.on{border-color:var(--primary);opacity:1;}
  .lclose{position:absolute;top:14px;right:16px;background:rgba(255,255,255,.15);border:none;color:#fff;
          font-size:22px;width:40px;height:40px;border-radius:50%;cursor:pointer;}
  .lname{color:#fff;font-size:14px;font-weight:700;}
  /* 弹窗表单 */
  .fmask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:98;display:none;align-items:center;justify-content:center;}
  .fmask.show{display:flex;}
  .modal{background:#fff;border-radius:14px;width:min(430px,calc(100vw - 36px));padding:20px 22px;max-height:90vh;overflow:auto;}
  .modal h3{font-size:16px;font-weight:800;margin-bottom:12px;}
  .modal label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 5px;}
  .modal input,.modal select,.modal textarea{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;font-family:inherit;outline:none;}
  .modal textarea{resize:vertical;}
  .modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--primary);}
  .frow{display:flex;gap:10px;}
  .frow>div{flex:1;}
  .upzone{border:1.5px dashed var(--border);border-radius:10px;padding:10px;text-align:center;color:var(--muted);
          font-size:12.5px;cursor:pointer;background:var(--bg);}
  .upzone:hover{border-color:var(--primary);color:var(--primary-dark);}
  .upzone input{display:none;}
  .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .thumbs .t{position:relative;width:62px;height:62px;border-radius:8px;overflow:hidden;background:#f1f5f9;}
  .thumbs .t img{width:100%;height:100%;object-fit:cover;}
  .thumbs .t .del{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;border:none;
                  background:rgba(220,38,38,.9);color:#fff;font-size:11px;line-height:18px;padding:0;cursor:pointer;}
  .modal .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
  .toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;
         padding:10px 20px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .25s;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .authmask{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--muted);font-size:14px;}
  .authmask.active{display:flex;}
</style>
</head>
<body>
  <div class="topbar">
    <h1>🎨 花色素材</h1>
    <span class="badge" id="roleBadge">…</span>
    <div class="sp"></div>
    <div class="search"><span class="ico">🔍</span><input id="q" placeholder="搜花色/系列" autocomplete="off"></div>
    <select id="statusFilter" class="selfilter" title="按状态筛选">
      <option value="">全部状态</option>
      <option value="new">⬆ 上新</option>
      <option value="on">在售</option>
      <option value="off">⬇ 已下架</option>
    </select>
    <button class="btn o" id="btnSync" style="display:none;">🔄 同步明细表</button>
    <button class="btn" id="btnImgSync" style="display:none;" title="在飞书表里换了图之后用：重新下载源表图片并覆盖">🖼️ 更新图片</button>
    <button class="btn g" id="btnAdd" style="display:none;">＋ 新增</button>
  </div>
  <div class="wrap">
    <div class="filters">
      <div class="frow" id="filterType"></div>
      <div class="frow" id="filterSeries"></div>
    </div>
    <div id="grid"></div>
    <div class="empty" id="empty" style="display:none;">
      <div class="big">🌸</div>
      还没有素材，等管理员上传
    </div>
  </div>

  <!-- 灯箱 -->
  <div class="lmask" id="lmask">
    <button class="lclose" id="lclose">×</button>
    <div class="lname" id="lname"></div>
    <img id="limg" alt="素材大图">
    <div class="lthumbs" id="lthumbs"></div>
  </div>

  <!-- 新增/编辑 -->
  <div class="fmask" id="fmask">
    <div class="modal">
      <h3 id="fTitle">新增花色</h3>
      <div class="frow">
        <div><label>品牌</label>
          <select id="fBrand"><option>弥生</option><option>极氧</option></select></div>
        <div><label>抛型（可选）</label>
          <select id="fType"><option value="">不填</option><option>日抛</option><option>半年抛</option><option>月抛</option><option>年抛</option></select></div>
      </div>
      <label>花色名 *</label>
      <input id="fName" placeholder="如：少女漫" autocomplete="off">
      <label>系列（可选）</label>
      <input id="fSeries" placeholder="如：少女漫系列 / 定轴" autocomplete="off">
      <label>一句话卖点（可选，客服直接照着发）</label>
      <textarea id="fDesc" rows="2" placeholder="如：自带高光不挑人，素颜也能戴" style="resize:vertical;" autocomplete="off"></textarea>
      <label>👁️ 上眼图（可多选）</label>
      <div class="upzone" id="upEye">点击选择图片，可一次多张<input type="file" id="fileEye" accept="image/*" multiple></div>
      <div class="thumbs" id="thEye"></div>
      <label>Lens 镜片图（可多选）</label>
      <div class="upzone" id="upLens">点击选择图片，可一次多张<input type="file" id="fileLens" accept="image/*" multiple></div>
      <div class="thumbs" id="thLens"></div>
      <div class="btns">
        <button class="btn o" id="fCancel">取消</button>
        <button class="btn g" id="fSave">保存</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="authmask" id="authMask">🔒 请先在工作台登录后查看</div>

<script src="vendor/supabase.min.js?v=2"></script>
<script>
'use strict';
const SUPABASE_URL = 'https://icfgireprowcqwdodfqx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImljZmdpcmVwcm93Y3F3ZG9kZnF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0ODMwNjEsImV4cCI6MjEwODA1OTA2MX0.T8yex8pjNBE0ch3vPKL3xPQPOqw3ExS4mwRsjT2FhzE';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let items = [];
let isAdmin = false;
let editingId = null;      // 编辑中的记录 id
let typeFilter = '全部';       // 顶部分类切换：抛型
let seriesFilter = '全部';     // 顶部分类切换：系列

/* ===== 分类口径（茹姐 2026-11-05）：抛型 半年抛→日抛；系列按指定顺序，人鱼／拼多多专属置后 ===== */
const TYPE_ORDER = ['半年抛','日抛'];
const SERIES_ORDER = ['少女漫','随便花','女高','初音','心动信号','心动调频','花厨小熊','人鱼','拼多多专属'];
const SERIES_ALIAS = {
  '少女漫日抛':'少女漫', '少女漫系列':'少女漫',
  '随便花系列':'随便花', '女高系列':'女高',
  '初音未来系列':'初音', '初音未来':'初音',
  '心动信号':'心动信号', '心动调频':'心动调频',
  '花厨小熊-日抛':'花厨小熊', '花厨小熊系列':'花厨小熊',
  '人鱼系列日抛':'人鱼', '人鱼系列':'人鱼',
  '拼多多专属':'拼多多专属'
};
function seriesOf(x){
  const s = String(x.series || '').trim();
  if (SERIES_ALIAS[s]) return SERIES_ALIAS[s];
  const clean = s.replace(/(系列|-?日抛|-?半年抛)$/g, '').trim();
  if (SERIES_ALIAS[clean]) return SERIES_ALIAS[clean];
  return s || '其他';
}
const seriesRank = s => { const i = SERIES_ORDER.indexOf(s); return i < 0 ? 999 : i; };
const typeRank = t => { const i = TYPE_ORDER.indexOf(t); return i < 0 ? 99 : i; };
/* 状态：上新 → 在售 → 下架（茹姐 2026-11-06 定排序） */
const isNew = x => !!x.is_new;
const isOff = x => !!x.is_discontinued;
const statusOf = x => isNew(x) ? 'new' : (isOff(x) ? 'off' : 'on');
const statusRank = x => isNew(x) ? 0 : (isOff(x) ? 2 : 1);
let newEye = [];           // 待上传新图 File[]
let newLens = [];
let eyeUrls = [];          // 已有图 URL（编辑时）
let lensUrls = [];

const $ = id => document.getElementById(id);
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(()=>t.classList.remove('show'), 2000);
}

/* ==================== 数据 ==================== */
async function load(){
  const { data, error } = await sb.from('pattern_assets').select('*')
    .order('sort_order', { ascending: false })
    .order('created_at', { ascending: false });
  if (error) { toast('读取失败：' + error.message); return; }
  items = data || [];
  renderFilters(); renderGrid();
}
function coverOf(x){
  // 上眼图永远在最顶部；确实没有上眼图才退回镜片图
  return imgsOf(x, 'eye')[0] || imgsOf(x, 'lens')[0] || '';
}
const hasEye = x => imgsOf(x, 'eye').length > 0;
function imgsOf(x, kind){
  const arr = kind === 'eye' ? (Array.isArray(x.eye_imgs) ? x.eye_imgs : (x.eye_img ? [x.eye_img] : []))
                             : (Array.isArray(x.lens_imgs) ? x.lens_imgs : (x.lens_img ? [x.lens_img] : []));
  return arr.filter(Boolean);
}
function filtered(){
  const q = $('q').value.trim().toLowerCase();
  const st = $('statusFilter').value;
  return items.filter(x => {
    if (typeFilter !== '全部' && String(x.type || '其他') !== typeFilter) return false;
    if (seriesFilter !== '全部' && seriesOf(x) !== seriesFilter) return false;
    if (st && statusOf(x) !== st) return false;
    if (q && !((x.name||'') + ' ' + (x.series||'') + ' ' + (x.description||'')).toLowerCase().includes(q)) return false;
    return true;
  });
}

/* ==================== 渲染 ==================== */
function renderFilters(){
  // 计数按「其它维度全量」算，切换时数字稳定
  const types = ['全部'].concat(TYPE_ORDER);
  const series = ['全部'].concat(SERIES_ORDER);
  $('filterType').innerHTML = '<span class="flabel">抛型</span>' + types.map(t => {
    const n = t === '全部' ? items.length : items.filter(x => String(x.type || '其他') === t).length;
    return '<button class="chip' + (typeFilter === t ? ' active' : '') + '" data-k="t" data-v="' + esc(t) + '">' +
           esc(t) + ' <span class="cnt">' + n + '</span></button>';
  }).join('');
  $('filterSeries').innerHTML = '<span class="flabel">系列</span>' + series.map(s => {
    const n = s === '全部' ? items.length : items.filter(x => seriesOf(x) === s).length;
    return '<button class="chip' + (seriesFilter === s ? ' active' : '') + '" data-k="s" data-v="' + esc(s) + '">' +
           esc(s) + ' <span class="cnt">' + n + '</span></button>';
  }).join('');
  document.querySelectorAll('.filters .chip').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.k === 't') typeFilter = b.dataset.v;
    else seriesFilter = b.dataset.v;
    renderFilters(); renderGrid();
  }));
}
function paramsHtml(x){
  const defs = [['色系','color'],['直径','diameter'],['着色','color_diameter'],['基弧','base_curve']];
  const parts = defs.filter(d => x[d[1]] != null && String(x[d[1]]).trim() !== '')
    .map(d => '<span>' + d[0] + ' <b>' + esc(x[d[1]]) + '</b></span>');
  return parts.length ? '<div class="cparams">' + parts.join('') + '</div>' : '';
}
function cardHtml(x){
  const cover = coverOf(x);
  const st = statusOf(x);                    // new / on / off
  const eyeN = imgsOf(x,'eye').length, lensN = imgsOf(x,'lens').length;
  const tags = [x.brand, seriesOf(x), x.type].filter(Boolean)
    .map((v,i) => '<span class="' + ['tg-brand','tg-series','tg-type'][Math.min(i,2)] + '">' + esc(v) + '</span>').join('');
  const desc = String(x.description || '').trim();
  const stTag = st === 'new' ? ' <span class="tag-new">⬆ 上新</span>'
              : st === 'off' ? ' <span class="tag-off">已下架</span>' : '';
  // 管理员直接在卡片上标「上新 / 下架」；再点一次即取消
  const ops = isAdmin
    ? '<div class="ops">' +
        '<button data-act="new" class="flag-new' + (st === 'new' ? ' on' : '') +
          '" title="' + (st === 'new' ? '取消上新' : '标记上新，排到最前面') + '">⬆ 上新</button>' +
        '<button data-act="off" class="flag-off' + (st === 'off' ? ' on' : '') +
          '" title="' + (st === 'off' ? '恢复在售' : '标记下架，排到最后面') + '">⬇ 下架</button>' +
        '<button data-act="edit" title="修改花色">✏️ 修改</button>' +
        '<button data-act="del" title="删除花色">🗑️ 删除</button>' +
      '</div>' : '';
  return '<div class="card' + (st === 'new' ? ' new' : '') + (st === 'off' ? ' off' : '') +
      '" data-id="' + String(x.id) + '" data-st="' + st + '">' +
    '<div class="cover" data-act="zoom">' +
      (cover ? '<img loading="lazy" src="' + esc(cover) + '" alt="' + esc(x.name) + '">'
             : '<div class="ph"><div class="big">🌸</div>暂无图片</div>') +
      (hasEye(x) ? '<span class="eyemark">👁 上眼图</span>' : '') +
      ((eyeN + lensN) > 1 ? '<span class="nimg">' + (eyeN + lensN) + ' 图</span>' : '') +
    '</div>' +
    '<div class="cbody">' +
      '<div class="cname">' + esc(x.name) + stTag + '</div>' +
      (tags ? '<div class="ctags">' + tags + '</div>' : '') +
      paramsHtml(x) +
      '<div class="cdesc-wrap">' +
        (desc ? '<div class="cdesc">' + esc(desc) + '</div>' +
                '<button class="copy-btn" data-act="copy" title="复制这段花色话术">📋 复制</button>'
              : '<div class="cno-desc">暂无话术</div>') +
      '</div>' +
      ops +
    '</div>' +
  '</div>';
}
function renderGrid(){
  // 顶部 chip 切换看（不再整页大分区）：全局排序 上新 → 在售 → 下架，其次抛型/系列顺序
  const cmp = (a,b) => String(a).localeCompare(String(b), 'zh');
  const list = filtered().slice().sort((a,b) =>
    statusRank(a) - statusRank(b) ||
    typeRank(String(a.type || '其他')) - typeRank(String(b.type || '其他')) || cmp(a.type||'', b.type||'') ||
    seriesRank(seriesOf(a)) - seriesRank(seriesOf(b)) || cmp(seriesOf(a), seriesOf(b)) ||
    (Number(b.sort_order) || 0) - (Number(a.sort_order) || 0) || cmp(a.name||'', b.name||''));
  $('empty').style.display = list.length ? 'none' : '';
  $('grid').style.display = list.length ? '' : 'none';
  if (!list.length) { $('grid').innerHTML = ''; return; }
  const stFilter = $('statusFilter').value;
  let html = '';
  if (!stFilter) {
    const groups = [
      ['new', '⬆ 上新', list.filter(x => statusOf(x) === 'new')],
      ['on',  '在售',   list.filter(x => statusOf(x) === 'on')],
      ['off', '⬇ 已下架', list.filter(x => statusOf(x) === 'off')],
    ].filter(g => g[2].length);
    html = groups.map(g =>
      '<section class="sgroup sgroup-' + g[0] + '">' +
        (groups.length > 1 ? '<div class="sgroup-h">' + g[1] + ' <span class="n">' + g[2].length + ' 款</span></div>' : '') +
        '<div class="grid">' + g[2].map(cardHtml).join('') + '</div>' +
      '</section>').join('');
  } else {
    html = '<div class="grid">' + list.map(cardHtml).join('') + '</div>';
  }
  $('grid').innerHTML = html;
  document.querySelectorAll('#grid .card').forEach(c => c.addEventListener('click', onCard));
}
/* 卡片上直接标记：上新 / 下架（互斥，管理员） */
async function setFlag(x, patch, msg){
  if (!isAdmin) { toast('仅管理员可标记'); return; }
  const { error } = await sb.from('pattern_assets').update(patch).eq('id', x.id);
  if (error) { toast('标记失败：' + error.message); return; }
  Object.assign(x, patch);      // 本地同步，立刻重排，不用整页拉数
  renderFilters(); renderGrid();
  toast(msg);
}
function toggleNew(x){
  const v = !isNew(x);
  setFlag(x, v ? { is_new: true, is_discontinued: false } : { is_new: false },
          v ? '已标记上新 ⬆' : '已取消上新');
}
function toggleOff(x){
  const v = !isOff(x);
  setFlag(x, v ? { is_discontinued: true, is_new: false } : { is_discontinued: false },
          v ? '已标记下架 ⬇' : '已恢复在售');
}

/* ==================== 灯箱 ==================== */
let lightImgs = [], lightIdx = 0, lightName = '', lightEyeN = 0;
function openLight(x){
  const eye = imgsOf(x,'eye'), lens = imgsOf(x,'lens');
  lightImgs = eye.concat(lens);      // 上眼图永远排最顶部，镜片图在后
  lightEyeN = eye.length;
  lightName = x.name || '';
  if (!lightImgs.length) return;
  lightIdx = 0;
  renderLight();
  $('lmask').classList.add('show');
}
function renderLight(){
  const isEye = lightIdx < lightEyeN;
  const sub = isEye ? (lightIdx + 1) + '/' + lightEyeN
                    : (lightIdx - lightEyeN + 1) + '/' + (lightImgs.length - lightEyeN);
  $('lname').textContent = lightName + ' · ' + (isEye ? '上眼图' : '镜片图') + ' ' + sub +
                           '（共 ' + lightImgs.length + ' 张）';
  $('limg').src = lightImgs[lightIdx];
  $('lthumbs').innerHTML = lightImgs.length > 1
    ? lightImgs.map((u,i) => '<img src="' + esc(u) + '" class="' + (i===lightIdx?'on':'') + '" data-i="' + i + '">').join('')
    : '';
  document.querySelectorAll('#lthumbs img').forEach(t => t.addEventListener('click', () => { lightIdx = Number(t.dataset.i); renderLight(); }));
}

/* ==================== 表单 ==================== */
function openForm(x){
  editingId = x ? String(x.id) : null;
  $('fTitle').textContent = x ? '编辑花色' : '新增花色';
  $('fBrand').value = x ? (x.brand || '弥生') : '弥生';
  $('fType').value = x ? (x.type || '') : '';
  $('fName').value = x ? (x.name || '') : '';
  $('fSeries').value = x ? (x.series || '') : '';
  $('fDesc').value = x ? (x.description || '') : '';
  eyeUrls = x ? imgsOf(x,'eye') : [];
  lensUrls = x ? imgsOf(x,'lens') : [];
  newEye = []; newLens = [];
  renderThumbs();
  $('fmask').classList.add('show');
}
function renderThumbs(){
  const draw = (host, urls, files, kind) => {
    $(host).innerHTML =
      urls.map((u,i) => '<div class="t"><img src="' + esc(u) + '"><button class="del" data-k="' + kind + '" data-i="' + i + '">✕</button></div>').join('') +
      files.map((f,i) => '<div class="t"><img src="' + URL.createObjectURL(f) + '"><button class="del" data-k="' + kind + 'new" data-i="' + i + '">✕</button></div>').join('');
    document.querySelectorAll('#' + host + ' .del').forEach(b => b.addEventListener('click', () => {
      if (b.dataset.k === 'eye') eyeUrls.splice(Number(b.dataset.i), 1);
      else if (b.dataset.k === 'lens') lensUrls.splice(Number(b.dataset.i), 1);
      else if (b.dataset.k === 'eyenew') newEye.splice(Number(b.dataset.i), 1);
      else newLens.splice(Number(b.dataset.i), 1);
      renderThumbs();
    }));
  };
  draw('thEye', eyeUrls, newEye, 'eye');
  draw('thLens', lensUrls, newLens, 'lens');
}
/* 前端压图：长边 1600，JPEG q82（手机原图太大，直接传网页会卡） */
async function compress(file){
  try{
    const bmp = await createImageBitmap(file);
    const max = 1600, s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', 0.82));
  }catch(e){ return file; }
}
async function uploadFiles(files, kind){
  for (const f of files){
    if (!/^image\//.test(f.type)) { toast('只能传图片：' + f.name); continue; }
    toast('上传中…');
    const blob = await compress(f);
    const ext = '.jpg';
    const path = 'pattern/' + Date.now() + '_' + kind + '_' + Math.random().toString(36).slice(2,8) + ext;
    const { error } = await sb.storage.from('pattern-images').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
    if (error) { toast('上传失败：' + error.message); continue; }
    const url = sb.storage.from('pattern-images').getPublicUrl(path).data.publicUrl;
    if (kind === 'eye') eyeUrls.push(url); else lensUrls.push(url);
  }
  renderThumbs();
  toast('图片已就绪 ✅');
}
async function save(){
  const name = $('fName').value.trim();
  if (!name) { toast('请填花色名'); return; }
  const row = {
    brand: $('fBrand').value,
    name: name,
    series: $('fSeries').value.trim(),
    type: $('fType').value,
    description: $('fDesc').value.trim(),
    eye_imgs: eyeUrls,
    lens_imgs: lensUrls,
    updated_hint: undefined,
  };
  let error;
  if (editingId) {
    // ⚠️ 编辑时不要重置管理员手动标的「上新 / 下架」（row 里不写这两个字段即可）
    ({ error } = await sb.from('pattern_assets').update(row).eq('id', editingId));
  } else {
    row.is_discontinued = false;
    row.sort_order = Math.floor(Date.now() / 1000) % 1000000000; // 新增排前面
    ({ error } = await sb.from('pattern_assets').insert(row));
  }
  if (error) { toast('保存失败：' + error.message); return; }
  $('fmask').classList.remove('show');
  toast(editingId ? '已保存 ✅' : '已新增 ✅');
  load();
}
async function delItem(x){
  if (!confirm('确定删除「' + x.name + '」吗？删除后不可恢复。')) return;
  const { error } = await sb.from('pattern_assets').delete().eq('id', x.id);
  if (error) { toast('删除失败：' + error.message); return; }
  toast('已删除'); load();
}

/* ==================== 事件 ==================== */
async function copyDesc(x){
  const text = String(x.description || '').trim();
  if (!text) { toast('这个花色还没有话术'); return; }
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e2) {}
    document.body.removeChild(ta);
  }
  toast('话术已复制 ✅');
}
function onCard(e){
  const card = e.target.closest('.card');
  const x = items.find(v => String(v.id) === String(card.dataset.id));
  if (!x) return;
  const act = e.target.closest('[data-act]');
  const actName = act && act.dataset.act;
  if (actName === 'copy') { e.stopPropagation(); copyDesc(x); return; }
  if (actName === 'edit') { e.stopPropagation(); openForm(x); return; }
  if (actName === 'del') { e.stopPropagation(); delItem(x); return; }
  if (actName === 'new') { e.stopPropagation(); toggleNew(x); return; }
  if (actName === 'off') { e.stopPropagation(); toggleOff(x); return; }
  if (e.target.closest('.ops')) return;
  openLight(x);
}
$('btnAdd').addEventListener('click', () => openForm(null));
$('statusFilter').addEventListener('change', renderGrid);

/* ==================== 从飞书花色明细表同步（仅管理员） ==================== */
let syncing = false;
async function syncFromSheets(forceImages){
  if (syncing) return;
  if (!isAdmin) { toast('仅管理员可同步'); return; }
  const confirmMsg = forceImages
    ? '从飞书「日抛 / 半年抛花色明细表」强制更新图片：\n\n'
      + '· 源表里有图的花色会全部重新下载并覆盖工作台现有图（含上眼图/镜片图）\n'
      + '· 用于「在飞书表里换了图」之后；要搬图，速度较慢（每批 5 条）\n\n确定继续吗？'
    : '从飞书「日抛 / 半年抛花色明细表」同步到花色素材：\n\n'
      + '· 新增明细表里有、工作台没有的花色（含图片 / 卖点 / 参数）\n'
      + '· 已有花色只补空缺参数，不覆盖图片、卖点、下架标记\n\n确定继续吗？';
  if (!confirm(confirmMsg)) return;
  const btn = $('btnSync');
  const btnImg = $('btnImgSync');
  const setTxt = s => { btn.textContent = s; };
  syncing = true; btn.disabled = true; btnImg.disabled = true; btn.style.opacity = '.6';
  if (btnImg) btnImg.style.opacity = '.6';
  try {
    // 先刷新「表格评论里的下架」标记；这一步失败不阻断后面的花色同步
    setTxt('🔄 检查下架…');
    try {
      const { error: oe } = await sb.functions.invoke('pattern-sheets-sync', { body: { offsync: true } });
      if (oe) console.warn('[同步] 下架标记刷新失败（不阻断）', oe);
    } catch (e) { console.warn('[同步] 下架标记刷新失败（不阻断）', e); }
    setTxt('🔄 检查中…');
    const { data: dry, error: de } = await sb.functions.invoke('pattern-sheets-sync', { body: { dry_run: true, force_images: !!forceImages } });
    if (de) throw new Error(de.message || '检查失败');
    if (!dry || !dry.ok) throw new Error((dry && dry.error) || '检查失败');
    if (!dry.to_insert && !dry.to_update && !dry.to_imgfix) { toast('✅ 已是最新，明细表没有需要同步的内容'); await load(); return; }
    const total = dry.feishu_rows || 1;
    const limit = (dry.to_insert > 0 || dry.to_imgfix > 0) ? 5 : 20;   // 有新增/搬图，小批防止函数超时
    let offset = 0, ins = 0, upd = 0, imgs = 0, rounds = 0;
    while (true) {
      setTxt('🔄 同步中 ' + Math.min(offset + limit, total) + '/' + total);
      const { data, error } = await sb.functions.invoke('pattern-sheets-sync',
        { body: { dry_run: false, offset, limit, force_images: !!forceImages } });
      if (error) throw new Error(error.message || '同步中断');
      if (!data || !data.ok) throw new Error((data && data.error) || '同步中断');
      ins += data.inserted || 0; upd += data.updated || 0; imgs += data.images_uploaded || 0;
      if (data.errors && data.errors.length) console.warn('[同步] 部分条目异常', data.errors);
      offset = data.next_offset;
      if (!data.has_more || ++rounds > 40) break;
    }
    toast((forceImages ? '图片更新完成：' : '同步完成：') + '新增 ' + ins + '、更新 ' + upd + '、图片 ' + imgs + ' 张');
    await load();
  } catch (e) {
    toast('同步失败：' + (e.message || e));
    console.error(e);
  } finally {
    syncing = false; btn.disabled = false; if (btnImg) btnImg.disabled = false; btn.style.opacity = ''; if (btnImg) btnImg.style.opacity = ''; setTxt('🔄 同步明细表');
  }
}
$('btnSync').addEventListener('click', () => syncFromSheets());
$('btnImgSync').addEventListener('click', () => syncFromSheets(true));
$('q').addEventListener('input', renderGrid);
$('lclose').addEventListener('click', () => $('lmask').classList.remove('show'));
$('lmask').addEventListener('click', function(e){ if (e.target === this) this.classList.remove('show'); });
$('fmask').addEventListener('click', function(e){ if (e.target === this) this.classList.remove('show'); });
$('fCancel').addEventListener('click', () => $('fmask').classList.remove('show'));
$('fSave').addEventListener('click', save);
$('upEye').addEventListener('click', () => $('fileEye').click());
$('upLens').addEventListener('click', () => $('fileLens').click());
$('fileEye').addEventListener('change', e => { uploadFiles([...e.target.files], 'eye'); e.target.value = ''; });
$('fileLens').addEventListener('change', e => { uploadFiles([...e.target.files], 'lens'); e.target.value = ''; });

/* ==================== 初始化 ==================== */
(async function init(){
  try{
    const { data:{ session } } = await sb.auth.getSession();
    const user = session && session.user;
    if (!user){
      // 不登录也允许看（表允许 anon 读），但按只读渲染
      $('roleBadge').className = 'badge ro'; $('roleBadge').textContent = '📖 只读查看';
      await load(); return;
    }
    let role = user.app_metadata && user.app_metadata.role;
    try{
      const { data:p } = await sb.from('profiles').select('role').eq('id', user.id).single();
      if (p) role = p.role;
    }catch(e){}
    isAdmin = (role === 'admin');
    if (isAdmin){
      $('roleBadge').className = 'badge admin'; $('roleBadge').textContent = '👑 管理员 · 可上传';
      $('btnAdd').style.display = '';
      $('btnSync').style.display = '';
      $('btnImgSync').style.display = '';
    } else {
      $('roleBadge').className = 'badge ro'; $('roleBadge').textContent = '📖 只读查看';
    }
    await load();
  }catch(e){
    console.warn(e);
    toast('初始化失败，请刷新重试');
  }
})();
