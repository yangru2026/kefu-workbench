<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定轴三幅 均价更低</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #e8e4df;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 24px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
}
.card {
  width: 400px;
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
}
.banner {
  background: linear-gradient(135deg, #7a8b7f 0%, #8fa093 50%, #a3b5a7 100%);
  padding: 28px 24px;
  text-align: center;
}
.banner .tag {
  display: inline-block;
  background: rgba(255,255,255,0.2);
  color: #fff;
  padding: 3px 12px;
  border-radius: 16px;
  font-size: 11px;
  font-weight: 600;
  margin-bottom: 8px;
}
.banner h1 {
  color: #fff;
  font-size: 26px;
  font-weight: 800;
}
.banner h1 span { color: #f5e6c8; }
.banner .sub {
  color: rgba(255,255,255,0.8);
  font-size: 13px;
  margin-top: 6px;
}
.price-box {
  padding: 24px 20px;
  display: flex;
  justify-content: space-around;
  align-items: center;
}
.pb-item {
  text-align: center;
}
.pb-item .num {
  font-size: 26px;
  font-weight: 800;
  color: #c45c4a;
}
.pb-item .num.gray {
  color: #bbb;
  text-decoration: line-through;
  font-size: 22px;
}
.pb-item .label {
  font-size: 12px;
  color: #94a3b8;
  margin-top: 4px;
}
.pb-divider {
  width: 1px;
  height: 40px;
  background: #e2e8f0;
}
.footer {
  background: #f5f3f0;
  padding: 14px 18px;
  text-align: center;
}
.footer .main {
  color: #5a6b5e;
  font-size: 14px;
  font-weight: 700;
}
.footer .sub {
  color: #aaa;
  font-size: 12px;
  margin-top: 3px;
}
</style>
</head>
<body>
<div class="card">
  <div class="banner">
    <div class="tag">定轴专享</div>
    <h1>定轴三幅 <span>均价更低</span></h1>
    <div class="sub">满减80元 · 单副低至43.2元</div>
  </div>

  <div class="price-box">
    <div class="pb-item">
      <div class="num gray">¥59.9</div>
      <div class="label">单买/副</div>
    </div>
    <div class="pb-divider"></div>
    <div class="pb-item">
      <div class="num">¥129.7</div>
      <div class="label">3副到手价</div>
    </div>
    <div class="pb-divider"></div>
    <div class="pb-item">
      <div class="num">¥43.2</div>
      <div class="label">到手均价/副</div>
    </div>
  </div>

  <div class="footer">
    <div class="main">定轴款三幅到手 ¥129.7 · 均价仅 ¥43.2/副</div>
    <div class="sub">定轴款三幅专享优惠</div>
  </div>
</div>
</body>
</html>
