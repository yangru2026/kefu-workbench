<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>买三幅 立减80元</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #e8e4df;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 24px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
}
.card {
  width: 440px;
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
}
.banner {
  background: linear-gradient(135deg, #7a8b7f 0%, #8fa093 50%, #a3b5a7 100%);
  padding: 26px 24px;
  text-align: center;
}
.banner .tag {
  display: inline-block;
  background: rgba(255,255,255,0.2);
  color: #fff;
  padding: 3px 12px;
  border-radius: 16px;
  font-size: 11px;
  font-weight: 600;
  margin-bottom: 8px;
}
.banner h1 {
  color: #fff;
  font-size: 26px;
  font-weight: 800;
}
.banner h1 span { color: #f5e6c8; }
.banner .sub {
  color: rgba(255,255,255,0.85);
  font-size: 13px;
  margin-top: 6px;
}
.table-wrap { padding: 16px 18px 18px; }
table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 13px;
}
thead th {
  background: #f5f3f0;
  color: #999;
  font-weight: 600;
  padding: 8px 4px;
  font-size: 11px;
}
thead th:first-child { border-radius: 8px 0 0 0; }
thead th:last-child { border-radius: 0 8px 0 0; }
tbody td {
  padding: 12px 4px;
  text-align: center;
  border-bottom: 1px solid #f0eeeb;
  color: #555;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr.best td { font-weight: 700; background: #f9f7f4; }
tbody tr.best .actual { color: #c45c4a; font-size: 15px; }
tbody tr.best .avg { color: #7a8b7f; font-size: 14px; }
tbody tr.single td { color: #bbb; }
tbody tr.single .actual { color: #999; }
.combo { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 12px; }
.best-tag {
  background: #7a8b7f;
  color: #fff;
  font-size: 9px;
  padding: 2px 5px;
  border-radius: 4px;
  font-weight: 700;
}
.plus-tag {
  background: #ea580c;
  color: #fff;
  font-size: 9px;
  padding: 2px 5px;
  border-radius: 4px;
  font-weight: 600;
}
.actual { color: #c45c4a; font-weight: 700; font-size: 13px; }
.avg { color: #7a8b7f; font-weight: 700; font-size: 12px; }
.na { color: #ddd; font-size: 11px; }
.footer {
  background: #f5f3f0;
  padding: 14px 18px;
  text-align: center;
}
.footer .main { color: #5a6b5e; font-size: 13px; font-weight: 700; }
.footer .sub { color: #aaa; font-size: 11px; margin-top: 3px; }
</style>
</head>
<body>
<div class="card">
  <div class="banner">
    <div class="tag">满减活动</div>
    <h1>买三幅 <span>立减80元</span></h1>
    <div class="sub">普通款 & 定轴款 自由混搭</div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>组合</th><th>到手价</th><th>到手均价</th></tr>
      </thead>
      <tbody>
        <tr class="single">
          <td><div class="combo">普通×1<span class="plus-tag">单买</span></div></td>
          <td><span class="actual">59.9</span></td>
          <td><span class="na">—</span></td>
        </tr>
        <tr class="best">
          <td><div class="combo">普通×3<span class="best-tag">推荐</span></div></td>
          <td><span class="actual">99.7</span></td>
          <td><span class="avg">33</span></td>
        </tr>
        <tr>
          <td><div class="combo">普通×2+定轴<span class="plus-tag">+10元</span></div></td>
          <td><span class="actual">109.7</span></td>
          <td><span class="avg">36.6</span></td>
        </tr>
        <tr>
          <td><div class="combo">普通+定轴×2<span class="plus-tag">+20元</span></div></td>
          <td><span class="actual">119.7</span></td>
          <td><span class="avg">39.9</span></td>
        </tr>
        <tr>
          <td><div class="combo">定轴×3<span class="plus-tag">+30元</span></div></td>
          <td><span class="actual">129.7</span></td>
          <td><span class="avg">43.2</span></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="footer">
    <div class="main">普通款 & 定轴款 任意组合均享满减80元</div>
    <div class="sub">三副即减，不限系列</div>
  </div>
</div>
</body>
</html>
