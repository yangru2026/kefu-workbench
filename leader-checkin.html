<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>售前主管一日打卡台</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --line:#e8ebf0;
    --text:#2b2f36; --text2:#9aa1ab; --primary:#3b6fb6; --primary-soft:#eaf1fa;
    --green:#2e9e5b; --green-soft:#e7f5ec; --red:#e0556b; --red-soft:#fdeaee;
    --shadow:0 1px 3px rgba(20,30,50,.06); --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px}
  .title{font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px}
  .title .dot{width:10px;height:10px;border-radius:50%;background:var(--primary)}
  .datepick{display:flex;align-items:center;gap:8px}
  .datepick input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;color:var(--text);background:#fff}
  .datepick .wk{color:var(--text2);font-size:13px}

  .statbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;min-width:120px;flex:1}
  .stat .lbl{color:var(--text2);font-size:12px;margin-bottom:4px}
  .stat .val{font-size:18px;font-weight:700}
  .stat .val.small{font-size:15px;font-weight:600}

  .clock-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .clock-btn{flex:1;min-width:160px;border:none;border-radius:var(--radius);padding:16px;font-size:15px;font-weight:600;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
  .clock-btn .sub{font-size:12px;font-weight:400;opacity:.85}
  .clock-btn.in{background:var(--primary);color:#fff}
  .clock-btn.out{background:#5a6472;color:#fff}
  .clock-btn.done{background:var(--green-soft);color:var(--green)}
  .clock-btn:hover{filter:brightness(.97)}

  .goals{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px}
  .goals h3{margin:0 0 10px;font-size:14px}
  .goals .row{display:flex;flex-wrap:wrap;gap:12px}
  .goals label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text2);flex:1;min-width:140px}
  .goals input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;color:var(--text)}

  .group{margin-bottom:18px}
  .group h3{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px;color:var(--text)}
  .group h3::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--primary)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .node{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:8px;transition:.15s}
  .node .head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .node .name{font-weight:600;font-size:13.5px}
  .node .hint{font-size:11px;color:var(--text2);line-height:1.4;margin-top:-2px}
  .node .tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text2);cursor:pointer;flex-shrink:0;transition:.15s}
  .node.done{border-color:var(--green);background:var(--green-soft)}
  .node.done .tick{background:var(--green);border-color:var(--green);color:#fff}
  .node .time{font-size:12px;color:var(--green);font-weight:600}
  .node .note{border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12.5px;color:var(--text);width:100%;resize:none;font-family:inherit}
  .node .note:focus{outline:none;border-color:var(--primary)}

  .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;color:var(--text)}
  .btn:hover{border-color:var(--primary);color:var(--primary)}
  .btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  .btn.primary:hover{filter:brightness(.96);color:#fff}

  .modal{position:fixed;inset:0;background:rgba(20,30,50,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}
  .modal.active{display:flex}
  .modal .box{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:20px}
  .modal .box h3{margin:0 0 12px;font-size:16px}
  .modal textarea{width:100%;min-height:280px;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:13px;font-family:inherit;line-height:1.7;resize:vertical;color:var(--text)}
  .modal .mbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}

  .toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);background:#2b2f36;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:2000}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title"><span class="dot"></span>售前主管一日打卡台</div>
    <div class="datepick">
      <input type="date" id="dateSel" onchange="onDateChange()">
      <span class="wk" id="wkLabel"></span>
    </div>
  </header>

  <div class="statbar">
    <div class="stat"><div class="lbl">上班</div><div class="val small" id="stIn">—</div></div>
    <div class="stat"><div class="lbl">下班</div><div class="val small" id="stOut">—</div></div>
    <div class="stat"><div class="lbl">在岗时长</div><div class="val small" id="stDur">—</div></div>
    <div class="stat"><div class="lbl">今日流程</div><div class="val" id="stProg">0/20</div></div>
    <div class="stat"><div class="lbl">月度专项</div><div class="val" id="stMonthly">0/2</div></div>
  </div>

  <div class="clock-row">
    <button class="clock-btn in" id="btnIn" onclick="doClock('in')">🟢 上班打卡<span class="sub" id="subIn">点击记录上班时间</span></button>
    <button class="clock-btn out" id="btnOut" onclick="doClock('out')">🔴 下班打卡<span class="sub" id="subOut">点击记录下班时间</span></button>
  </div>

  <div class="goals">
    <h3>📌 今日目标</h3>
    <div class="row">
      <label>咨询量目标<input type="number" id="gConsult" placeholder="如 200" onchange="saveGoals()"></label>
      <label>转化率目标(%)<input type="number" id="gConvert" placeholder="如 15" onchange="saveGoals()"></label>
      <label>销售额目标(元)<input type="number" id="gSales" placeholder="如 8000" onchange="saveGoals()"></label>
    </div>
  </div>

  <div id="groups"></div>

  <div class="actions">
    <button class="btn primary" onclick="genReport()">📝 生成日报</button>
    <button class="btn" onclick="exportXlsx()">📤 导出Excel</button>
  </div>
</div>

<div class="modal" id="reportModal">
  <div class="box">
    <h3>📝 今日日报</h3>
    <textarea id="reportText" readonly></textarea>
    <div class="mbtns">
      <button class="btn" onclick="copyReport()">复制</button>
      <button class="btn primary" onclick="closeReport()">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const NODE_DEFS = [
  // 晨间准备
  {id:'handover', label:'看交接/夜班数据',     group:'晨间准备'},
  {id:'morning',   label:'晨会宣导',           group:'晨间准备'},
  {id:'goals',     label:'确认今日目标',       group:'晨间准备'},
  {id:'sched_am',  label:'排班核对与调整',     group:'晨间准备', hint:'对照排班表，提前调整请假/缺岗'},

  // 上午执行
  {id:'patrol',    label:'巡场抽检',           group:'上午执行'},
  {id:'qc_1on1',   label:'质检问题客服一对一沟通', group:'上午执行', hint:'结合质检工具讲解模式，点对点辅导'},
  {id:'tough',     label:'疑难客户处理',       group:'上午执行'},
  {id:'coach',     label:'组员带教',           group:'上午执行'},

  // 午间
  {id:'noon',      label:'上午数据复盘',       group:'午间'},
  {id:'emergency', label:'突发情况处理',       group:'午间', hint:'客诉/系统故障/临时任务应急' },

  // 下午管理
  {id:'qc_fix',    label:'解决质检中的问题',   group:'下午管理', hint:'质检工具→问题跟进闭环'},
  {id:'link_qc',   label:'连带登记质检',       group:'下午管理', hint:'工作台·连带登记'},
  {id:'penalty_add', label:'扣罚登记',         group:'下午管理', hint:'质检工具·扣罚'},
  {id:'complaint', label:'投诉/退换处理',      group:'下午管理'},
  {id:'keycust',   label:'大客户跟进',         group:'下午管理'},
  {id:'sched_pm',  label:'排班微调/补位协调',  group:'下午管理', hint:'突发缺岗临时调度'},

  // 傍晚收尾
  {id:'penalty_sum', label:'扣罚汇总',         group:'傍晚收尾', hint:'质检工具·扣罚汇总导出'},
  {id:'summary',   label:'当日数据汇总',       group:'傍晚收尾'},
  {id:'report',    label:'写日报',             group:'傍晚收尾'},
  {id:'plan',      label:'明日计划',           group:'傍晚收尾'},

  // 月度专项（月底才做，不计入每日进度）
  {id:'attend_month', label:'月底考勤汇总',    group:'月度专项', monthly:true, hint:'本打卡台导出/考勤表'},
  {id:'perf_month',   label:'月底绩效与扣罚归档', group:'月度专项', monthly:true, hint:'汇总当月扣罚/连带/质检'},
];
const GROUP_ORDER = ['晨间准备','上午执行','午间','下午管理','傍晚收尾','月度专项'];

const PREFIX = 'leader_checkin_';
let today = todayStr();
let state = null;

function todayStr(d){ const x = d || new Date(); const p = n => (n<10?'0':'')+n; return x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate()); }
function weekday(s){ const w = ['周日','周一','周二','周三','周四','周五','周六']; const d = s ? new Date(s+'T00:00:00') : new Date(); return w[d.getDay()]; }
function fmtTime(ts){ if(!ts) return ''; const d = new Date(ts); const p = n => (n<10?'0':'')+n; return p(d.getHours())+':'+p(d.getMinutes()); }
function fmtDur(ms){ if(!ms||ms<0) return '—'; const m = Math.floor(ms/60000); const h=Math.floor(m/60); const mm=m%60; return h+'h'+(mm<10?'0':'')+mm+'m'; }
function key(s){ return PREFIX + (s||today); }

function loadState(s){
  try{ const raw = localStorage.getItem(key(s)); if(raw) return JSON.parse(raw); }catch(e){}
  return {date:s, clockIn:null, clockOut:null, nodes:{}, goals:{}, report:''};
}
function saveState(){ try{ localStorage.setItem(key(), JSON.stringify(state)); }catch(e){} }

function onDateChange(){ today = document.getElementById('dateSel').value || todayStr(); state = loadState(today); renderAll(); }

function renderAll(){
  document.getElementById('dateSel').value = today;
  document.getElementById('wkLabel').textContent = weekday(today);
  // 考勤
  const ci = state.clockIn, co = state.clockOut;
  document.getElementById('stIn').textContent = ci ? fmtTime(ci) : '—';
  document.getElementById('stOut').textContent = co ? fmtTime(co) : '—';
  document.getElementById('stDur').textContent = (ci&&co) ? fmtDur(co-ci) : '—';
  const bIn = document.getElementById('btnIn'), bOut = document.getElementById('btnOut');
  if(ci){ bIn.className='clock-btn done'; bIn.querySelector('.sub').textContent='已打卡 '+fmtTime(ci)+'（点击撤销）'; }
  else { bIn.className='clock-btn in'; bIn.querySelector('.sub').textContent='点击记录上班时间'; }
  if(co){ bOut.className='clock-btn done'; bOut.querySelector('.sub').textContent='已打卡 '+fmtTime(co)+'（点击撤销）'; }
  else { bOut.className='clock-btn out'; bOut.querySelector('.sub').textContent='点击记录下班时间'; }
  // 目标
  document.getElementById('gConsult').value = state.goals.consult||'';
  document.getElementById('gConvert').value = state.goals.convert||'';
  document.getElementById('gSales').value = state.goals.sales||'';
  // 节点
  const dailyNodes = NODE_DEFS.filter(n=>!n.monthly);
  const monNodes   = NODE_DEFS.filter(n=>n.monthly);
  const doneDaily = dailyNodes.filter(n=>state.nodes[n.id]&&state.nodes[n.id].done).length;
  const doneMon   = monNodes.filter(n=>state.nodes[n.id]&&state.nodes[n.id].done).length;
  document.getElementById('stProg').textContent = doneDaily+'/'+dailyNodes.length;
  document.getElementById('stMonthly').textContent = doneMon+'/'+monNodes.length;
  const box = document.getElementById('groups'); box.innerHTML='';
  GROUP_ORDER.forEach(g=>{
    const nodes = NODE_DEFS.filter(n=>n.group===g);
    const sec = document.createElement('div'); sec.className='group';
    sec.innerHTML = '<h3>'+g+(g==='月度专项'?' <span style="font-size:11px;color:var(--text2);font-weight:400">（月底做，不计入每日进度）</span>':'')+'</h3>';
    const grid = document.createElement('div'); grid.className='grid';
    nodes.forEach(n=>{
      const nd = state.nodes[n.id]||{};
      const card = document.createElement('div');
      card.className = 'node'+(nd.done?' done':'');
      card.innerHTML =
        '<div class="head"><div class="name">'+n.label+'</div>'+
        '<div class="tick" onclick="toggleNode(\''+n.id+'\')">'+(nd.done?'✓':'')+'</div></div>'+
        (n.hint?'<div class="hint">'+escapeHtml(n.hint)+'</div>':'')+
        (nd.done?'<div class="time">✓ '+fmtTime(nd.time)+'</div>':'')+
        '<input class="note" placeholder="备注（可选）" value="'+escapeAttr(nd.note||'')+'" onchange="setNote(\''+n.id+'\',this.value)">';
      grid.appendChild(card);
    });
    sec.appendChild(grid); box.appendChild(sec);
  });
}

function escapeAttr(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function toggleNode(id){
  if(!state.nodes[id]) state.nodes[id]={done:false,time:null,note:''};
  const nd = state.nodes[id];
  if(nd.done){
    if(!confirm('撤销「'+(NODE_DEFS.find(n=>n.id===id).label)+'」的打卡？')) return;
    nd.done=false; nd.time=null;
  } else { nd.done=true; nd.time=Date.now(); }
  saveState(); renderAll(); toast(nd.done?'已打卡 ✓':'已撤销');
}

function setNote(id,v){ if(!state.nodes[id]) state.nodes[id]={done:false,time:null,note:''}; state.nodes[id].note=v; saveState(); }

function doClock(type){
  if(type==='in'){
    if(state.clockIn){ if(!confirm('撤销上班打卡？')) return; state.clockIn=null; }
    else state.clockIn = Date.now();
  } else {
    if(state.clockOut){ if(!confirm('撤销下班打卡？')) return; state.clockOut=null; }
    else { if(!state.clockIn){ toast('请先打上班卡'); return; } state.clockOut = Date.now(); }
  }
  saveState(); renderAll(); toast(type==='in'?(state.clockIn?'上班打卡 ✓':'已撤销上班'):(state.clockOut?'下班打卡 ✓':'已撤销下班'));
}

function saveGoals(){
  state.goals = {
    consult: document.getElementById('gConsult').value,
    convert: document.getElementById('gConvert').value,
    sales: document.getElementById('gSales').value
  };
  saveState(); toast('目标已保存');
}

function genReport(){
  const g = state.goals;
  let t = '【售前主管日报】'+today+' '+weekday(today)+'\n';
  t += '上班：'+(state.clockIn?fmtTime(state.clockIn):'未打卡')+'　下班：'+(state.clockOut?fmtTime(state.clockOut):'未打卡')+'　在岗：'+((state.clockIn&&state.clockOut)?fmtDur(state.clockOut-state.clockIn):'—')+'\n';
  t += '今日目标：咨询量 '+(g.consult||'-')+'　转化率 '+(g.convert||'-')+'%　销售额 ¥'+(g.sales||'-')+'\n';
  t += '────────────────\n【今日流程】\n';
  NODE_DEFS.filter(n=>!n.monthly).forEach(n=>{
    const nd = state.nodes[n.id]||{};
    t += (nd.done?'✓ ':'✗ ')+n.label+(nd.done?(' '+fmtTime(nd.time)):'（未完成）');
    if(nd.note) t += '　'+nd.note;
    t += '\n';
  });
  const done = NODE_DEFS.filter(n=>!n.monthly&&state.nodes[n.id]&&state.nodes[n.id].done).length;
  t += '────────────────\n今日完成节点 '+done+'/'+NODE_DEFS.filter(n=>!n.monthly).length;
  const mons = NODE_DEFS.filter(n=>n.monthly);
  if(mons.some(n=>state.nodes[n.id]&&state.nodes[n.id].done)){
    t += '\n\n【月度专项】\n';
    mons.forEach(n=>{
      const nd = state.nodes[n.id]||{};
      t += (nd.done?'✓ ':'✗ ')+n.label+(nd.done?(' '+fmtTime(nd.time)):'（未完成）');
      if(nd.note) t += '　'+nd.note;
      t += '\n';
    });
  }
  state.report = t; saveState();
  document.getElementById('reportText').value = t;
  document.getElementById('reportModal').classList.add('active');
}
function closeReport(){ document.getElementById('reportModal').classList.remove('active'); }
function copyReport(){ const ta=document.getElementById('reportText'); ta.select(); try{document.execCommand('copy'); toast('日报已复制');}catch(e){ toast('复制失败，请手动选择');} }

/* ===== 纯前端生成 xlsx（无外部依赖） ===== */
function escXml(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;'); }
function crc32(buf){
  const t=[]; for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}
  let crc=0xFFFFFFFF; for(let i=0;i<buf.length;i++) crc=(crc>>>8)^t[(crc^buf[i])&0xFF];
  return (crc^0xFFFFFFFF)>>>0;
}
function zipStore(files){
  const enc=new TextEncoder(); const chunks=[]; const central=[]; let offset=0;
  const LFH=0x04034b50, CDFH=0x02014b50, EOCD=0x06054b50;
  files.forEach(f=>{
    const name=enc.encode(f.name); const data=f.data;
    const crc=crc32(data);
    const lh=new Uint8Array(30+name.length); const dv=new DataView(lh.buffer);
    dv.setUint32(0,LFH,true); dv.setUint16(4,20,true); dv.setUint16(6,0,true); dv.setUint16(8,0,true);
    dv.setUint16(10,0,true); dv.setUint16(12,0,true); dv.setUint32(14,crc,true);
    dv.setUint32(18,data.length,true); dv.setUint32(22,data.length,true); dv.setUint16(26,name.length,true); dv.setUint16(28,0,true);
    lh.set(name,30);
    const ch=new Uint8Array(46+name.length); const cdv=new DataView(ch.buffer);
    cdv.setUint32(0,CDFH,true); cdv.setUint16(4,20,true); cdv.setUint16(6,20,true); cdv.setUint16(8,0,true);
    cdv.setUint16(10,0,true); cdv.setUint16(12,0,true); cdv.setUint32(16,crc,true);
    cdv.setUint32(20,data.length,true); cdv.setUint32(24,data.length,true); cdv.setUint16(28,name.length,true);
    cdv.setUint16(30,0,true); cdv.setUint16(32,0,true); cdv.setUint16(34,0,true); cdv.setUint16(36,0,true); cdv.setUint32(40,0,true);
    cdv.setUint32(42,offset,true); cdv.setUint16(46,0,true);
    ch.set(name,46);
    chunks.push(lh,data); central.push(ch); offset+=lh.length+data.length;
  });
  let cs=0; central.forEach(c=>cs+=c.length);
  const eo=new Uint8Array(22); const ed=new DataView(eo.buffer);
  ed.setUint32(0,EOCD,true); ed.setUint16(4,0,true); ed.setUint16(6,0,true);
  ed.setUint16(8,files.length,true); ed.setUint16(10,files.length,true);
  ed.setUint32(12,cs,true); ed.setUint32(16,offset,true); ed.setUint16(20,0,true);
  return new Blob([...chunks,...central,eo],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function buildXlsx(rows){
  const sheet = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+
    rows.map((row,r)=>'<row r="'+(r+1)+'">'+
      row.map((c,i)=>{ const col=String.fromCharCode(65+i);
        if(typeof c==='number' && !isNaN(c)) return '<c r="'+col+(r+1)+'" t="n"><v>'+c+'</v></c>';
        return '<c r="'+col+(r+1)+'" t="inlineStr"><is><t xml:space="preserve">'+escXml(c==null?'':c)+'</t></is></c>';
      }).join('')+'</row>').join('')+'</sheetData></worksheet>';
  const enc=new TextEncoder();
  const files=[
    {name:'[Content_Types].xml', data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>')},
    {name:'_rels/.rels', data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>')},
    {name:'xl/workbook.xml', data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheets><sheet name="打卡记录" sheetId="1" r:id="rId1"/></sheets></workbook>')},
    {name:'xl/_rels/workbook.xml.rels', data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>')},
    {name:'xl/worksheets/sheet1.xml', data:enc.encode(sheet)}
  ];
  return zipStore(files);
}
function exportXlsx(){
  const g=state.goals;
  const rows=[['日期',today+' '+weekday(today)]];
  rows.push(['上班',state.clockIn?fmtTime(state.clockIn):'未打卡']);
  rows.push(['下班',state.clockOut?fmtTime(state.clockOut):'未打卡']);
  rows.push(['在岗时长',(state.clockIn&&state.clockOut)?fmtDur(state.clockOut-state.clockIn):'—']);
  rows.push(['咨询量目标',g.consult||'']);
  rows.push(['转化率目标(%)',g.convert||'']);
  rows.push(['销售额目标(元)',g.sales||'']);
  rows.push([]);
  rows.push(['今日流程节点','状态','完成时间','备注']);
  NODE_DEFS.filter(n=>!n.monthly).forEach(n=>{ const nd=state.nodes[n.id]||{}; rows.push([n.label, nd.done?'已完成':'未完成', nd.done?fmtTime(nd.time):'', nd.note||'']); });
  const mons = NODE_DEFS.filter(n=>n.monthly);
  if(mons.some(n=>state.nodes[n.id]&&state.nodes[n.id].done)){
    rows.push([]);
    rows.push(['月度专项','状态','完成时间','备注']);
    mons.forEach(n=>{ const nd=state.nodes[n.id]||{}; rows.push([n.label, nd.done?'已完成':'未完成', nd.done?fmtTime(nd.time):'', nd.note||'']); });
  }
  const blob=buildXlsx(rows);
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='售前主管打卡_'+today+'.xlsx'; a.click(); URL.revokeObjectURL(url);
  toast('📤 Excel 已导出');
}

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }

/* init */
state = loadState(today);
renderAll();
</script>
