<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客服考试</title>
<style>
  :root{--primary:#10b981;--primary-dark:#059669;--primary-light:rgba(16,185,129,.1);
        --danger:#e05252;--warn:#c2660a;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--bg:#f7f9f8;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);line-height:1.65;}
  .topbar{background:#fff;border-bottom:1px solid var(--border);padding:14px 20px;display:flex;
          align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10;}
  .topbar h1{font-size:18px;font-weight:800;letter-spacing:.4px;}
  .topbar .meta{font-size:12.5px;color:var(--muted);}
  .spacer{flex:1;}
  .btn{padding:8px 20px;border:none;border-radius:20px;font-size:13.5px;font-weight:700;cursor:pointer;
       font-family:inherit;transition:all .15s;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary);}
  .btn-ghost:hover{background:var(--primary-light);}
  .papertitle{background:#fff;border-bottom:1px solid var(--border);padding:10px 20px;display:flex;
              align-items:baseline;gap:12px;flex-wrap:wrap;}
  .papertitle h2{font-size:15px;font-weight:800;color:var(--primary-dark);}
  .papertitle .meta{font-size:12.5px;color:var(--muted);}
  .wrap{max-width:860px;margin:0 auto;padding:18px 20px 80px;}
  .papers{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .ptab{padding:7px 15px;border-radius:20px;border:1.5px solid var(--border);background:#fff;
        font-family:inherit;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .15s;}
  .ptab:hover{border-color:var(--primary);color:var(--primary-dark);}
  .ptab.on{background:var(--primary);border-color:var(--primary);color:#fff;}
  .ptab.lock{opacity:.45;cursor:not-allowed;}
  .ptab.lock:hover{border-color:var(--border);color:var(--muted);}
  .intro{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:16px;
         box-shadow:0 2px 12px rgba(31,41,55,.05);}
  .intro h2{font-size:15px;font-weight:800;margin-bottom:8px;}
  .intro p{font-size:13.5px;color:var(--muted);}
  .intro .warn{color:var(--danger);font-weight:700;margin-top:8px;font-size:13.5px;}
  .name-row{margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
            background:#f8fafc;border:1.5px solid var(--border);border-radius:11px;padding:10px 14px;}
  .name-row label{font-size:13.5px;font-weight:700;white-space:nowrap;}
  .name-row input{flex:1;min-width:170px;padding:9px 12px;border:1.5px solid var(--border);
                  border-radius:9px;font-size:14px;font-family:inherit;outline:none;background:#fff;}
  .name-row input:focus{border-color:var(--primary);}
  .name-row .must{font-size:11.5px;font-weight:700;color:#fff;background:var(--primary);
                  border-radius:10px;padding:3px 9px;flex-shrink:0;}
  .submit-note{display:none;margin:-6px 0 16px;padding:11px 16px;border-radius:12px;font-size:13.5px;
               line-height:1.6;background:var(--primary-light);color:#065f46;border:1px solid rgba(16,185,129,.35);}
  .submit-note.show{display:block;}
  .submit-note.err{background:rgba(224,82,82,.08);color:#9b2c2c;border-color:rgba(224,82,82,.35);}
  .sec{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:16px;
       box-shadow:0 2px 12px rgba(31,41,55,.05);}
  .sec > h2{font-size:15px;font-weight:800;color:var(--primary-dark);margin-bottom:4px;
            border-left:4px solid var(--primary);padding-left:10px;}
  .sec > .hint{font-size:12.5px;color:var(--muted);margin:6px 0 14px 14px;}
  .q{padding:12px 0;border-bottom:1px dashed var(--border);}
  .q:last-child{border-bottom:none;}
  .q-head{display:flex;gap:8px;font-size:14.5px;font-weight:700;align-items:flex-start;}
  .q-no{color:var(--primary-dark);flex-shrink:0;}
  .q-pts{font-size:11.5px;color:var(--muted);font-weight:600;flex-shrink:0;margin-top:3px;}
  .opts{margin:8px 0 0 22px;display:flex;flex-direction:column;gap:6px;}
  .opt{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer;padding:5px 10px;
       border:1.5px solid var(--border);border-radius:9px;background:#fff;transition:all .12s;}
  .opt:hover{border-color:var(--primary);}
  .opt input{margin-top:4px;accent-color:var(--primary);flex-shrink:0;}
  .opt.sel{background:var(--primary-light);border-color:var(--primary);}
  .ta{width:100%;min-height:64px;margin:8px 0 0 22px;width:calc(100% - 22px);padding:9px 12px;
      border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:13.5px;outline:none;resize:vertical;}
  .ta:focus{border-color:var(--primary);}
  .match-row{display:flex;align-items:center;gap:10px;margin:8px 0 0 22px;flex-wrap:wrap;font-size:14px;}
  .match-row .left{font-weight:700;min-width:130px;}
  .match-row select{padding:7px 10px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;
                    font-size:13.5px;outline:none;background:#fff;flex:1;min-width:200px;}
  .judge-ok{border-color:var(--primary)!important;background:var(--primary-light)!important;}
  .judge-no{border-color:var(--danger)!important;background:rgba(224,82,82,.08)!important;}
  .res{margin-top:8px;margin-left:22px;font-size:13px;border-radius:9px;padding:8px 12px;display:none;}
  .res.show{display:block;}
  .res.ok{background:var(--primary-light);color:#065f46;}
  .res.bad{background:rgba(224,82,82,.08);color:#9b2c2c;}
  .res .tag{font-weight:800;margin-right:6px;}
  .res .exp{margin-top:4px;color:var(--text);}
  .score{background:#fff;border:2px solid var(--primary);border-radius:14px;padding:18px;margin-bottom:16px;
         text-align:center;display:none;box-shadow:0 4px 18px rgba(16,185,129,.15);}
  .score.show{display:block;}
  .score .big{font-size:40px;font-weight:800;color:var(--primary-dark);line-height:1.2;}
  .score .sub{font-size:13.5px;color:var(--muted);margin-top:4px;}
  .score .detail{margin-top:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .score .cell{background:var(--primary-light);border-radius:10px;padding:8px 14px;font-size:12.5px;}
  .score .cell b{display:block;font-size:18px;color:var(--primary-dark);}
  .selfscore{margin-left:22px;margin-top:6px;font-size:13px;color:var(--muted);}
  .selfscore select{padding:5px 8px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;}
  .footbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);
           padding:10px 20px;display:flex;gap:12px;align-items:center;justify-content:center;z-index:20;}
  .footbar .tip{font-size:12.5px;color:var(--muted);}
  @media print{
    .topbar,.footbar,.btn{display:none!important;}
    body{background:#fff;}
    .sec{box-shadow:none;break-inside:avoid;}
    .res{display:block!important;}
  }
  @media (max-width:600px){ .wrap{padding:12px 12px 90px;} .q-pts{display:none;} }
</style>
</head>
<body>
<div class="topbar">
  <h1>📝 客服考试</h1>
  <span class="spacer"></span>
  <div class="papers" id="paperTabs" style="margin-bottom:0;"></div>
  <button class="btn btn-ghost" onclick="window.print()">🖨 打印</button>
</div>
<div class="papertitle">
  <h2 id="tTitle"></h2>
  <span class="meta" id="tMeta"></span>
</div>
<div class="wrap">
  <div class="intro">
    <h2>📋 答题说明（先选上面的试卷）</h2>
    <div class="papers" id="paperTabs"></div>
    <p id="introText"></p>
    <div class="name-row">
      <label for="examinee">👤 考生姓名</label>
      <input id="examinee" type="text" maxlength="20" autocomplete="off" placeholder="先填姓名再答题（姓名决定你解锁到第几份试卷）">
      <span class="must">必填</span>
    </div>
    <div class="warn">⚠️ 先选试卷 → 填姓名 → 答题 → 交卷。交卷后自动判分并显示每题解析，成绩同步到「考核成绩」页（主管按姓名查）。</div>
  </div>
  <div class="score" id="scoreBox"></div>
  <div class="submit-note" id="submitNote"></div>
  <div id="paper"></div>
</div>
<div class="footbar">
  <span class="tip" id="footTip">做完点交卷，系统自动判分（简答题需自评）</span>
  <button class="btn btn-primary" id="btnSubmit">✅ 交卷判分</button>
  <button class="btn btn-ghost" id="btnReset">↺ 重做</button>
</div>
<script>
const PAPERS = [{"meta":{"key":"exam-一","title":"试卷一 · 美瞳基础知识","subtitle":"客服考试 · 试卷一 · 美瞳基础知识","intro":"说明：单选题，每题4分，满分100分。可在本表直接编辑题目/选项/答案/解析，修改后重新导入即可。","counts":24,"total":96,"dataNote":"题目同步自飞书《客服考试》试卷表，改表格后重新导入即可更新","timeLimit":"满分 96 分（合格率 80%）"},"questions":[{"type":"single","section":"单选题","stem":"美瞳（彩色隐形眼镜）属于第几类医疗器械？","options":["第一类","第二类","第三类","不属于医疗器械"],"answer":2,"explain":"美瞳属于第三类医疗器械，与人工心脏瓣膜同属严格监管范畴，销售需具备《医疗器械经营许可证》。","points":4,"no":1},{"type":"single","section":"单选题","stem":"客户问“是不是正品”，以下哪个是正确应对的核心要点？","options":["口头保证是正品即可","说明品牌方直营、有药监局注册证号、盒身流水码可验真，并给出售后保障","反问客户为什么不相信","直接结束对话"],"answer":1,"explain":"统一口径：我们是品牌方直营，货源统一；每盒有专属流水码可验真，药监局官网可查注册信息，支持拆封试戴1片。","points":4,"no":2},{"type":"single","section":"单选题","stem":"弥生品牌主卖的直径是？","options":["14.0mm","14.2mm","14.5mm","14.8mm"],"answer":2,"explain":"弥生品牌主卖大直径美瞳（14.5mm），让眼睛看起来更大更有神，是品牌核心优势。","points":4,"no":3},{"type":"single","section":"单选题","stem":"客户框架眼镜 350 度，隐形眼镜应选多少度？","options":["350度","325度","375度","300度"],"answer":0,"explain":"400度以下直接按自身度数选，不用减。","points":4,"no":4},{"type":"single","section":"单选题","stem":"客户框架眼镜 450 度，隐形眼镜应选多少度？","options":["450度","425度","400度","475度"],"answer":1,"explain":"400~500度减25度，450-25=425度。","points":4,"no":5},{"type":"single","section":"单选题","stem":"客户框架眼镜 600 度，隐形眼镜应选多少度？","options":["600度","575度","550度","525度"],"answer":2,"explain":"500~700度减50度，600-50=550度。","points":4,"no":6},{"type":"single","section":"单选题","stem":"框架眼镜 750 度，隐形眼镜应选多少度？","options":["750度","725度","700度","675度"],"answer":3,"explain":"700度以上减75度，750-75=675度。","points":4,"no":7},{"type":"single","section":"单选题","stem":"咱们美瞳最高做到多少度？","options":["600度","700度","800度","1000度"],"answer":2,"explain":"咱们美瞳最高只做到800度，超过800度没有生产。","points":4,"no":8},{"type":"single","section":"单选题","stem":"散光 100 度的客户（近视400度以内）该怎么选度数？","options":["直接忽略散光","散光度数÷2加到近视度数里，再按近视换算表减","散光全部加到近视里","单独买散光片"],"answer":1,"explain":"散光150度以内（低度散光）：散光度数÷2，加到近视度数里，再按近视换算表减；散光超过150度建议配散光定制片，咱们不支持换算和定制。","points":4,"no":9},{"type":"single","section":"单选题","stem":"半年抛镜片的含水量一般在多少？","options":["≦38%（低含水量）","40%-50%（高含水量）","55%以上","无要求"],"answer":0,"explain":"半年抛等长周期镜片采用低含水量（≦38%），硬度高、成型好、水分不易流失，适合新手、长时间佩戴和干眼人群。","points":4,"no":10},{"type":"single","section":"单选题","stem":"日抛镜片的含水量一般在多少？","options":["≦38%","40%-50%","55%以上","20%以下"],"answer":1,"explain":"日抛等短周期镜片含水量40%-50%，柔软性好、透氧性好，但水分不足时会倒吸泪液。","points":4,"no":11},{"type":"single","section":"单选题","stem":"关于含水量，下面哪种说法正确？","options":["含水量越高越好","高含水量适合干眼人群","含水量高反而可能倒吸眼球水分导致眼干","低含水量容易破损"],"answer":2,"explain":"含水量高≠适合干眼，长时间佩戴时镜片水分低于应有含水量会倒吸眼球水分，干眼人群和长戴人群更适合低含水量。","points":4,"no":12},{"type":"single","section":"单选题","stem":"新手第一次买美瞳，更建议选哪种？","options":["日抛","半年抛","年抛","都一样"],"answer":1,"explain":"新手建议先选半年抛：成型好、容易戴入眼；日抛镜片较软不易入眼，更容易变形破损。","points":4,"no":13},{"type":"single","section":"单选题","stem":"咱们品牌的基弧是多少？","options":["8.0mm","8.4mm","8.6mm","9.0mm"],"answer":2,"explain":"咱们采用适合亚洲人的 8.6mm 通用弹性基弧，适合大部分人；基弧上下0.2mm误差影响不大。","points":4,"no":14},{"type":"single","section":"单选题","stem":"基弧过小（镜片太紧）可能出现什么症状？","options":["滑片、移位","磨眼、干涩、头晕、眼球压迫感","完全没影响","更容易脱落"],"answer":1,"explain":"基弧过小→镜片太紧→磨眼、干涩、头晕、眼球压迫感、眼睛红、视线不清；基弧过大→太松→移位、滑片、容易脱落。","points":4,"no":15},{"type":"single","section":"单选题","stem":"咱们美瞳的材质是什么？","options":["硅水凝胶","非离子水凝胶","MPC材质","普通水凝胶"],"answer":1,"explain":"咱们用的是非离子水凝胶（弥生没有硅水凝胶），蛋白不易沉淀、佩戴干净舒适，配合三明治锁色工艺更安全。","points":4,"no":16},{"type":"single","section":"单选题","stem":"“三明治锁色工艺”是指？","options":["镜片分三层叠加","花色夹在镜片中间，色素不直接接触眼球","锁边加粗设计","超薄工艺"],"answer":1,"explain":"三明治工艺：花色（着色层）夹在镜片中间，色素不直接接触眼球，更安全。","points":4,"no":17},{"type":"single","section":"单选题","stem":"客户问“这款大不大”，实际上最关心的是？","options":["总直径DIA","着色直径","基弧","含水量"],"answer":1,"explain":"真正决定放大效果的是着色直径而不是总直径；想要明显放大效果的客户，优先推荐着色直径大的款式。","points":4,"no":18},{"type":"single","section":"单选题","stem":"目前弥生所有款式的锁边情况是？","options":["全部有锁边（粗/细）","有部分无锁边款","全部无锁边","随机"],"answer":0,"explain":"咱们目前所有款都是有锁边的（粗锁边/细锁边），暂时没有无锁边款；细锁边已经很自然。","points":4,"no":19},{"type":"single","section":"单选题","stem":"新镜片拆封后需要浸泡多久再佩戴？","options":["1小时","2小时","6小时以上","不用泡直接戴"],"answer":2,"explain":"新镜片用护理液浸泡 6 小时以上再佩戴。","points":4,"no":20},{"type":"single","section":"单选题","stem":"美瞳可以与他人共用吗？","options":["可以","严禁共用","熟人或家人可以","消毒后可以"],"answer":1,"explain":"严禁与他人共用美瞳！佩戴前洗手擦干，保持手部清洁。","points":4,"no":21},{"type":"single","section":"单选题","stem":"每天都佩戴美瞳，护理液应多久更换一次？","options":["每天更换","2-3天更换一次","一周一次","不用换"],"answer":0,"explain":"每天都戴→护理液每天换一次；长时间不戴→2-3天换一次。护理液主要成分是聚氨基丙二胍，起消毒杀菌作用。","points":4,"no":22},{"type":"single","section":"单选题","stem":"第一次佩戴美瞳，当天佩戴时长建议？","options":["不超过2小时","不超过4小时","不超过8小时","想戴多久戴多久"],"answer":1,"explain":"第一天戴不超过4小时，每天递增2小时。","points":4,"no":23},{"type":"single","section":"单选题","stem":"关于透氧率，下列哪种说法正确？","options":["透氧率低=质量不合格","国标对水凝胶透氧有强制数值门槛","拿到药监局注册证即合规，透氧只是参考参数之一","硅水凝胶一定比水凝胶好"],"answer":2,"explain":"国标对水凝胶透氧没有强制数值要求，只要拿到注册证就是合规的；透氧率低不等于质量不合格。","points":4,"no":24}]},{"meta":{"key":"exam-二","title":"试卷二 · 花色明细 · 抛型与分类 · 价格","subtitle":"客服考试 · 试卷二 · 花色明细 · 抛型与分类 · 价格","intro":"说明：单选题，每题4分，满分100分。可在本表直接编辑题目/选项/答案/解析，修改后重新导入即可。","counts":29,"total":140,"dataNote":"题目同步自飞书《客服考试》试卷表，改表格后重新导入即可更新","timeLimit":"满分 140 分（合格率 80%）"},"questions":[{"type":"single","section":"单选题","stem":"弥生美瞳按抛型分为哪两类？","options":["日抛 / 半年抛","日抛 / 月抛","半年抛 / 年抛","月抛 / 年抛"],"answer":0,"explain":"按抛型分类：日抛 / 半年抛。","points":4,"no":1},{"type":"single","section":"单选题","stem":"日抛系列包含哪些？","options":["随便花、女高、心动信号","少女漫、人鱼、初音未来","花厨小熊、心动调频、随便花","只有少女漫和人鱼"],"answer":1,"explain":"日抛系列：少女漫、人鱼、初音未来。日抛一盒6片装，左右眼同度数，不支持备注双眼不同度数。","points":4,"no":2},{"type":"single","section":"单选题","stem":"半年抛系列中，属于拼多多专属的是？","options":["随便花、花厨小熊","少女漫、人鱼","心动信号、心动调频","初音未来、女高"],"answer":2,"explain":"心动信号、心动调频为拼多多专属系列。","points":4,"no":3},{"type":"single","section":"单选题","stem":"半年抛系列包含以下哪组全部系列？","options":["随便花、少女漫、初音未来、女高、花厨小熊、人鱼、心动信号、心动调频","少女漫、人鱼、初音未来","随便花、花厨小熊、心动信号","女高、心动调频、少女漫"],"answer":0,"explain":"半年抛系列：随便花、少女漫、初音未来、女高、花厨小熊、人鱼、心动信号（拼多多专属）、心动调频（拼多多专属）。","points":4,"no":4},{"type":"single","section":"单选题","stem":"日抛一盒几片？", n":"半年抛49.9档：随便花、花厨小熊，单副49.9，三副99.9多系列混搭（定轴、初音除外）。","points":4,"no":15},{"type":"single","section":"单选题","stem":"半年抛 59.9 元档包含哪些系列？","options":["少女漫普通、人鱼普通","随便花、花厨小熊","女高","心动调频"],"answer":0,"explain":"半年抛59.9档：少女漫普通、人鱼普通，单副59.9，三副99.9多系列混搭（定轴、初音除外）。","points":4,"no":16},{"type":"single","section":"单选题","stem":"半年抛定轴款单副价格是？","options":["49.9","59.9","69.9","79.9"],"answer":1,"explain":"少女漫定轴、人鱼定轴：单副59.9。","points":4,"no":17},{"type":"single","section":"单选题","stem":"半年抛定轴+普通款混搭，买 2 副（普通×2）价格是？","options":["69.8","79.8","89.8","99.8"],"answer":0,"explain":"2副混搭：普通×2=69.8，普通+定轴=79.8，定轴×2=89.8。","points":4,"no":18},{"type":"single","section":"单选题","stem":"半年抛混搭买 3 副（普通×3，最划算）价格是？","options":["89.7","99.7","109.7","119.7"],"answer":1,"explain":"3副混搭：普通×3（最划算）=99.7，普通×2+定轴=109.7，普通+定轴×2=119.7，定轴×3=129.7。","points":4,"no":19},{"type":"single","section":"单选题","stem":"半年抛初音未来联名 1 副价格是？","options":["59","69","79","89"],"answer":1,"explain":"半年抛初音联名：1副69（赠小卡+护理液+伴侣盒）；2副99.8；3副139.8；5副232.5。","points":4,"no":20},{"type":"single","section":"单选题","stem":"半年抛初音未来联名 5 副价格是？","options":["199.5","219.5","232.5","249.5"],"answer":2,"explain":"初音联名5副232.5，赠全套赠品+立牌+亚克力手持镜。","points":4,"no":21},{"type":"single","section":"单选题","stem":"花色明细的记忆要求是？","options":["按价格高低记忆","按抛型、色系分类记忆（棕色系/黑色系/紫色系/粉色系）","按字母顺序记忆","按上市时间记忆"],"answer":1,"explain":"记忆要求：按抛型、色系分类记忆（棕色系/黑色系/紫色系/粉色系），结合客户实际情况（度数、库存、喜好、使用场景）推荐。","points":4,"no":22},{"type":"single","section":"单选题","stem":"下列哪一项不属于特殊类美瞳？","options":["小直径美瞳","超薄款美瞳","满着色美瞳","粗锁边美瞳"],"answer":3,"explain":"特殊类美瞳：小直径（14.2自然融瞳）、超薄款（0.06mm）、满着色（显色度高）、大/小基弧款、定轴美瞳（高光固定方向）。","points":4,"no":23},{"type":"single","section":"单选题","stem":"客户提到一个你不认识的花色，第一步应该怎么做？","options":["直接说不是我们家的","先查花色明细表/旺店通，判断是不是下架的旧花色","反问客户是不是记错了","推荐其他花色"],"answer":1,"explain":"三步判断：第一步先查是不是下架旧款（查明细表+旺店通产品编码）→第二步查是不是新品测款→第三步才说不是我们家的。","points":4,"no":24},{"type":"single","section":"单选题","stem":"定轴美瞳的核心特点是什么？","options":["高光固定在一个方向，不会随眼球转动而移位","花色特别多","镜片更薄","直径更大"],"answer":0,"explain":"定轴美瞳：高光固定在一个方向，不会随眼球转动移位，上眼稳定，适合对高光位置有要求的客户。","points":4,"no":25},{"type":"text","section":"简答题","stem":"我们弥生的美瞳是什么材质的？有什么卖点？","answer":"参考答案：咱们用的是非离子水凝胶（弥生没有硅水凝胶）。卖点：①蛋白不易沉淀，戴久了不易浑浊磨眼；②佩戴干净舒适，不易引起眼部过敏；③三明治锁色工艺，花色夹在镜片中间，色素不直接接触眼球，更安全；④弥生主打大直径14.5mm，戴上更大更有神；⑤8.6mm通用弹性基弧，适合亚洲人眼球。答出材质＋至少两个卖点即可给分。","points":10,"no":26},{"type":"text","section":"简答题","stem":"哪几款花色有850度和900度的度数？","answer":"参考答案：有！小棕环pro6片装、小黑环pro6片装这两款（pro系列6片装）有850度和900度。其他常规款式最高只做到800度。客户要850/900度时优先推荐这两款pro6片装。答题要点：能答出这两款花色名即给分。","points":10,"no":27},{"type":"text","section":"简答题","stem":"女高三幅在不同平台的机制分别是什么？","answer":"参考答案：拼多多59.9三幅；抖音39.9三幅。记住：女高三幅拼多多59.9、抖音39.9，别报错平台机制。","points":10,"no":28},{"type":"text","section":"简答题","stem":"日抛99.9四盒的机制是都有的吗，正常售价是多少？","answer":"参考答案：不是所有店铺都有。只有抖音眼镜旗舰店的达人链接才有99.9四盒（均价24.9/盒）；正常售价是119.9四盒（39.9档普通款，均价29.9/盒）。答题要点：答出“仅抖音达人链接专属”＋“正常119.9四盒”即给分。","points":10,"no":29}]},{"meta":{"key":"exam-三","title":"试卷三 · 注意事项 · 拼多多规范","subtitle":"客服考试 · 试卷三 · 注意事项 · 拼多多规范","intro":"说明：单选题+判断题，每题4分，满分100分。可在本表直接编辑题目/选项/答案/解析，修改后重新导入即可。","counts":25,"total":100,"dataNote":"题目同步自飞书《客服考试》试卷表，改表格后重新导入即可更新","timeLimit":"满分 100 分（合格率 80%）"},"questions":[{"type":"single","section":"单选题","stem":"售前接待的“黄金响应”时间是多少？","options":["3秒","6秒","10秒","30秒"],"answer":1,"explain":"快速回复，重视黄金6秒，快速响应才能留住客户。","points":4,"no":1},{"type":"single","section":"单选题","stem":"拼多多分流号规定：客户发消息后几分钟内必须回复？","options":["1分钟","3分钟","5分钟","10分钟"],"answer":1,"explain":"正常上班期间，客户发消息后3分钟内必须回复；每一轮会话不能超过3分钟。","points":4,"no":2},{"type":"single","section":"单选题","stem":"分流号早班几点准时上线？","options":["7:00","8:00","9:00","9:30"],"answer":1,"explain":"早班8点准时上线，8点上线后离线客户的消息必须3分钟内回复；可以先发快捷话术让客户等待，之后必须一一处理不能漏。","points":4,"no":3},{"type":"single","section":"单选题","stem":"分流号晚班几点才能挂起？","options":["21:00","22:00","23:00","23:30"],"answer":3,"explain":"晚班23:30才能挂起，8:00-23:30期间不能挂起、不能无人在线。","points":4,"no":4},{"type":"single","section":"单选题","stem":"登录分流号必须怎么做？","options":["群里报备打卡","不用报备","私下告诉主管","发朋友圈"],"answer":0,"explain":"登录分流号必须群里报备打卡，早晚班都要打卡，格式如：早班已上线，负责2、3、4店分流。","points":4,"no":5},{"type":"single","section":"单选题","stem":"下面哪种连续回复会被平台识别为敷衍？","options":["“好的宝宝”“对的宝宝”“收到宝宝”等相似话术连续回复","每次都认真回复不同内容","回复带表情","回复稍慢"],"answer":0,"explain":"不能连续回复相似话术（好的宝宝、对的宝宝、收到宝宝、备注了宝宝……），平台识别很严，要注意换着说。","points":4,"no":6},{"type":"single","section":"单选题","stem":"关于引导第三方/线下交易，正确的是？","options":["可以发个人收款码","可以引导加微信下单","不能提微信、QQ、电话，所有交易走平台","电话沟通更高效，可以给号码"],"answer":2,"explain":"不能引导第三方/线下交易：不能提微信、QQ、电话；不能发个人收款码，所有交易走平台。","points":4,"no":7},{"type":"single","section":"单选题","stem":"关于好评返现，正确的是？","options":["可以引导好评返现","可以说“好评返现5元”","不能引导好评返现，平台严打会扣分罚款","只对老客户说没关系"],"answer":2,"explain":"不能引导好评返现：说“好评返现5元”直接扣分罚款，平台重点监控。","points":4,"no":8},{"type":"single","section":"单选题","stem":"关于运费险，正确的是？","options":["可以私自承诺客户有运费险","可以承诺包邮运费","运费险按平台规则走，不能私自承诺","客户要求就必须答应"],"answer":2,"explain":"不能私自承诺运费险：运费险按平台规则走，不能私自承诺客户有运费险，也不能承诺包邮运费。","points":4,"no":9},{"type":"single","section":"单选题","stem":"拼多多售前高压线“回复内容类”第一条是什么？","options":["不能重复发一样的话术","客户消息3分钟内必须回","不能私自改价","不能泄露客户信息"],"answer":0,"explain":"高压线回复内容类5条：1不能重复发一样的话术（会被判机器人降权）2不能引导站外3不能骂人/态度恶劣4不能用敏感词/违禁词5不能承诺做不到的事。","points":4,"no":10},{"type":"single","section":"单选题","stem":"下列哪一组属于违禁词/敏感词？","options":["最、第一、绝对","好、优质","包邮、赠品","正品、保障"],"answer":0,"explain":"最、第一、绝对等极限词属于违禁词，不能说。","points":4,"no":11},{"type":"single","section":"单选题","stem":"关于“已读不回”，正确的是？","options":["看了不用回","客户投诉“不回复”直接成立，比回复慢更严重","只要最后回一句就行","系统不统计"],"answer":1,"explain":"已读不回=更严重：看到了故意不回，客户投诉“不回复”直接成立。","points":4,"no":12},{"type":"single","section":"单选题","stem":"关于私自改价，正确的是？","options":["可以私下承诺优惠","可以给客户退差价","所有价格操作走系统，不能私下承诺优惠/差价","跟领导说一声就能改"],"answer":2,"explain":"不能私自改价：所有价格操作走系统，不能私下承诺优惠/差价。","points":4,"no":13},{"type":"single","section":"单选题","stem":"关于引导退款重拍/换链接，正确的是？","options":["可以让客户退了重拍别的链接","平台算违规","客户要求就可以","换链接更划算，可以引导"],"answer":1,"explain":"不能引导退款重拍/换链接：让客户退了重拍别的链接，平台算违规。","points":4,"no":14},{"type":"single","section":"单选题","stem":"把难搞的客户转分流号甩锅，属于？","options":["正常操作","数据作弊","为客户好","合理分流"],"answer":1,"explain":"数据作弊类：不能把难搞客户转分流号甩锅（聊崩了/客户不下单就转分流号，算作弊）；不能泄露客户信息。","points":4,"no":15},{"type":"single","section":"单选题","stem":"新客服必背 Top5 高频违规点不包括以下哪项？","options":["3分钟内必回","不引导站外","不重复话术","可以私下承诺赠品"],"answer":3,"explain":"Top5：①3分钟内必回 ②不引导站外 ③不重复话术 ④8-23点必在线 ⑤不私自改价/承诺好评返现。触碰任何一条按公司制度处罚。","points":4,"no":16},{"type":"single","section":"单选题","stem":"每天佩戴美瞳，护理液怎么换？","options":["每天换一次","2-3天换一次","一周换一次","不用换"],"answer":0,"explain":"每天都戴→护理液每天换一次；长时间不戴→2-3天换一次。","points":4,"no":17},{"type":"single","section":"单选题","stem":"客户出现眼红、眼痛、持续不适，客服应建议？","options":["继续佩戴适应","滴眼药水继续戴","立即取下并就医","减少佩戴时间即可"],"answer":2,"explain":"出现眼红、眼痛、持续不适，立即取下并就医。","points":4,"no":18},{"type":"single","section":"单选题","stem":"催付的时间间隔建议是？","options":["1分钟催一次","3-5分钟催一次，依次延续至少3次","10分钟催一次","下班前催一次"],"answer":1,"explain":"催付时间间隔把握好，隔3-5分钟催一次，依次延续至少3次，下班之前跟进催付询单流失的。","points":4,"no":19},{"type":"single","section":"单选题","stem":"售前岗位的“一句话记住”是什么？","options":["售前是答疑的，答完就结束","售前是卖货的，不是答疑的——答完问题必须推荐花色、引导下单","售前只管聊参数","售前只负责催付"],"answer":1,"explain":"一句话记住：售前是卖货的，不是答疑的——答完问题必须推荐花色、引导下单，不能答完就结束。","points":4,"no":20},{"type":"judge","section":"判断题","stem":"美瞳销售需要具备《医疗器械经营许可证》，产品需有药监局注册证号。","options":["正确","错误"],"answer":0,"explain":"正确。美瞳是第三类医疗器械，销售需具备《医疗器械经营许可证》，产品需有注册证号，可通过药监局官网查询真伪。","points":4,"no":21},{"type":"judge","section":"判断题","stem":"可以引导客户好评返现来提升店铺评分。","options":["正确","错误"],"answer":1,"explain":"错误。不能引导好评返现，平台严打，查到会扣分罚款。","points":4,"no":22},{"type":"judge","section":"判断题","stem":"拼多多高压线规定：8:00-23:00 期间不能挂离开，离线时长超标会降权。","options":["正确","错误"],"answer":0,"explain":"正确。8:00-23:00必须在线，这个时间段不能挂离开，离线时长超标降权。","points":4,"no":23},{"type":"judge","section":"判断题","stem":"答应的赠品/活动可以不兑现，客户不会计较。","options":["正确","错误"],"answer":1,"explain":"错误。答应的赠品/活动必须兑现，说送就送，不送就是商家责任；不能承诺做不到的事，答应了必须兑现。","points":4,"no":24},{"type":"judge","section":"判断题","stem":"分流号规范中，早晚班登录都需要在群里报备打卡。","options":["正确","错误"],"answer":0,"explain":"正确。早晚班都要打卡，格式：早班已上线，负责2、3、4店分流；晚班已上线，负责5、6店分流。","points":4,"no":25}]},{"meta":{"key":"exam-四","title":"试卷四 · 发货履约 · 延迟发货 · 合并发货 · 预定缺货","subtitle":"客服考试 · 试卷四 · 发货履约 · 延迟发货 · 合并发货 · 预定缺货","intro":"说明：单选题+判断题，每题4分，满分100分。可在本表直接编辑题目/选项/答案/解析，修改后重新导入即可。","counts":25,"total":100,"dataNote":"题目同步自飞书《客服考试》试卷表，改表格后重新导入即可更新","timeLimit":"满分 100 分（合格率 80%）"},"questions":[{"type":"single","section":"单选题","stem":"客户要求延迟发货，备注应该怎么写？","options":["暂不发，11.5号发出","晚会发","明天发","尽快发"],"answer":0,"explain":"延迟发货必须备注具体时间，如“暂不发，11.5号发出”；禁止备注“晚会发”“明天发、后天发、周几发”这种模糊词。","points":4,"no":1},{"type":"single","section":"单选题","stem":"拼多多平台对发货时效的要求是？","options":["24小时内发货","48小时内","72小时内","无要求"],"answer":0,"explain":"平台要求24小时内发货，超时未发货会触发平台处罚；拼多多没有协商延迟发货的功能。","points":4,"no":2},{"type":"single","section":"单选题","stem":"两单合并发货时，备注要求是？","options":["两单都必须备注","只备注主单","只备注副单","都不用备注"],"answer":0,"explain":"客户分开拍了两单需要合并发货时，两单都必须备注（漏备注，会当做无备注批量审核）；主单备注完整信息，副单备注“合并发货”。","points":4,"no":3},{"type":"single","section":"单选题","stem":"合并发货时，主单和副单分别怎么备注？","options":["主单备注完整信息，副单备注“合并发货”","副单备注完整信息，主单备注“合并发货”","两单都备注完整信息","两单都只备注“合并发货”"],"answer":0,"explain":"主单备注完整信息（花色+度数+数量+活动等），副单备注“合并发货”。","points":4,"no":4},{"type":"single","section":"单选题","stem":"合并发货前必须检查什么？","options":["两单收货地址是否一致","客户有没有好评","花色是否缺货","快递是否一样"],"answer":0,"explain":"合并发货前必须检查两单地址是否一致，不一致无法合并，需要修改成一致。","points":4,"no":5},{"type":"single","section":"单选题","stem":"两单地址不一致时，正确做法是？","options":["直接合并","让客户提供正确的详细地址和真实号码，修改一致后再备注合并","用虚拟号码合并","随便填一个地址"],"answer":1,"explain":"地址不一致时，让客户提供正确的详细地址和真实号码（⚠️虚拟号码改不了），修改一致后再备注合并。","points":4,"no":6},{"type":"single","section":"单选题","stem":"合并发货时，如果其中一单要改花色或度数，备注必须？","options":["加上花色名字","只写“改一下”","只写订单号","不用写"],"answer":0,"explain":"备注时必须加上花色名字，防止改单的人不知道是哪个花色需要修改。","points":4,"no":7},{"type":"single","section":"单选题","stem":"缺货预定花色，标准处理流程第一步是？","options":["引导客户先拍下其他有货的花色选项作为“占位”","让客户等补货","直接退款","让客户换店买"],"answer":0,"explain":"客户想拍缺货的花色时：引导客户先拍下其他有货的花色选项作为“占位”，明确告知实际花色缺货及预计到货时间，到货后单独发出。","points":4,"no":8},{"type":"single","section":"单选题","stem":"预定缺货订单如何满足平台发货时效？","options":["先发一个赠品让订单显示发货，美瞳到货后单独发出 m":"客户整单缺货且后续会补货，应建议客户？","options":["换接近度数或其他花色，或按预定流程处理","只能退款","让客户等不回复","随便发一个"],"answer":0,"explain":"整单缺货（后续会补）：留言告知预计到货时间，建议客户换接近度数/其他花色，或走预定流程。","points":4,"no":19},{"type":"judge","section":"判断题","stem":"订单备注是仓库发货的唯一依据。","options":["正确","错误"],"answer":0,"explain":"正确。订单备注是仓库发货的唯一依据，所有承诺客户的内容必须写进备注。","points":4,"no":20},{"type":"judge","section":"判断题","stem":"合并发货时漏备注一单没关系，仓库会自己处理。","options":["正确","错误"],"answer":1,"explain":"错误。漏备注会当做无备注批量审核，两单都必须备注。","points":4,"no":21},{"type":"judge","section":"判断题","stem":"两单收货地址不一致时，可以直接合并发货。","options":["正确","错误"],"answer":1,"explain":"错误。地址不一致无法合并，需要让客户提供正确详细地址和真实号码，修改一致后再备注合并。","points":4,"no":22},{"type":"judge","section":"判断题","stem":"缺货的度数可以备注，先答应客户再说。","options":["正确","错误"],"answer":1,"explain":"错误。先查库存再答应：缺货的度数绝不备注，缺货花色不答应更换。","points":4,"no":23},{"type":"judge","section":"判断题","stem":"预定缺货的花色，先发赠品满足平台时效，美瞳到货后单独补发。","options":["正确","错误"],"answer":0,"explain":"正确。先发赠品让订单满足平台发货时效，美瞳到货后单独打包发出，客户不用操作其他。","points":4,"no":24},{"type":"judge","section":"判断题","stem":"备注可以用花色缩写，比如把“无人区玫瑰”写成简称。","options":["正确","错误"],"answer":1,"explain":"错误。必须写全称，不能写缩写（比如“无人区玫瑰”要写完整花名）。","points":4,"no":25}]},{"meta":{"key":"exam-五","title":"试卷五 · 销售意识 · 简答题","subtitle":"客服考试 · 试卷五 · 销售意识 · 简答题","intro":"说明：简答题10题，每题10分，交卷后对照参考答案由主管评分。可在本表直接编辑题目/选项/答案/解析，修改后重新导入即可。","counts":14,"total":140,"dataNote":"题目同步自飞书《客服考试》试卷表，改表格后重新导入即可更新","timeLimit":"满分 140 分（合格率 80%）"},"questions":[{"type":"text","section":"简答题","stem":"请用一句话概括售前的岗位定位，并说明“答完问题后”应该怎么做。","answer":"售前是卖货的，不是答疑的——答完问题必须推荐花色、引导下单，不能答完就结束。评分要点：答出“卖货/推荐花色/引导下单”核心，答出“不能答完就结束”。","points":10,"no":1},{"type":"text","section":"简答题","stem":"售前岗位的三大核心角色分别是什么？","answer":"①产品信息提供者：连接店铺与客户的“第一触点”，承担产品介绍、需求挖掘、疑虑解答；②购买决策引导者：影响客户购买决策，直接关联转化率、客单价与口碑；③销售目标达成者：促成顾客下单，支持销售团队，提高连带活动效果。评分要点：三大角色各2分以上，能说明职责。满分10分。","points":10,"no":2},{"type":"text","section":"简答题","stem":"客户买美瞳的决策优先级是什么？售前应如何安排沟通顺序？","answer":"客户优先级：好看 > 舒服 > 花色对不对 > 度数准不准。沟通顺序：先聊花色，再讲参数；客户没问就别主动报，问了就答清楚专业，答完再拉回花色上。评分要点：写出优先级排序、写出“先花色后参数”、写出“答完拉回花色”。","points":10,"no":3},{"type":"text","section":"简答题","stem":"客户问“这款直径多大”，请写出正确的应答示范（要求不只报数字）。","answer":"参考：直径14.2，着色直径13.4，日常款，上班上学戴合适。想要更自然的还是大眼效果？我给您找~评分要点：不只报数字（报数字扣分）；包含参数解释+场景建议+拉回花色。","points":10,"no":4},{"type":"text","section":"简答题","stem":"客户问“透氧率多少？够吗？”，应如何作答？","answer":"参考：符合材质检测标准，日常8-10小时没问题。每天戴超10小时建议极氧系列。主要还是看花色~评分要点：先接住问题→用人话讲清楚→拉回花色；不报单一数字，不否定产品。","points":10,"no":5},{"type":"text","section":"简答题","stem":"什么是“万能三步”？为什么客户问参数时不能只报数字？","answer":"万能三步：先接住问题（肯定问题）→用人话讲明白→再拉回花色。只报数字客户没感觉也不会下单，要把参数翻译成她能感受到的效果，给她选择，最后引到花色上。评分要点：写出三步、写出“翻译效果+拉回花色”。","points":10,"no":6},{"type":"text","section":"简答题","stem":"新人上手先背的“三句话”是什么？","answer":"①被问花色：“您是想日常戴、出街戴，还是拍照戴？我帮您挑几款花色您看看~”②被问大小：“这款直径14.2，着色直径13.4，日常款，不大不小刚刚好，上镜也好看~”③被问参数：“参数都符合材质标准，日常戴8-10小时没问题，您主要还是看花色喜不喜欢~”评分要点：三句各3分，能体现“接住问题+拉回花色”即可。满分10分。","points":10,"no":7},{"type":"text","section":"简答题","stem":"客户最常问的 5 个问题及应对方向是什么？","answer":"1好不好看→先甩花色图，问喜欢自然还是显色；2大不大→问着色直径，按场景推花色；3舒不舒服→说材质（非离子=舒服）；4度数怎么选→问旧眼镜度数，引导换算；5是不是正品→官方旗舰店+资质证照+防伪码，三重保障。评分要点：写出5个问题且方向基本正确，每个2分。满分10分。","points":10,"no":8},{"type":"text","section":"简答题","stem":"客户说“我再看看”，售前应该怎么做？","answer":"这是流失前最后一击，客户一旦走了90%不会回来。立刻标星，过2分钟主动跟进一次；挽留话术：“宝，您是担心哪方面呢？花色还是舒适度？我可以再给您看看实拍图”“这个花色库存真的不多了，我先帮您标星备注一下，您想好了随时找我”；可发不同风格上眼图对比。评分要点：答出“标星+2分钟内跟进”、答出挽留话术思路。","points":10,"no":9},{"type":"text","section":"简答题","stem":"催付的时间节奏怎么把握？话术有什么要求？","answer":"催付时间间隔：隔3-5分钟催一次，依次延续至少3次，下班之前跟进催付询单流失的。催单话术要多样化，避免机械催单，告知活动并体现利益点（优惠、发货时间、赠品），教客户怎么下单方便和划算。评分要点：节奏（3-5分钟/至少3次/下班前跟进）、话术多样化与利益点，各5分。","points":10,"no":10},{"type":"text","section":"简答题","stem":"我们弥生的美瞳是什么材质的？有什么卖点？","answer":"参考答案：咱们用的是非离子水凝胶（弥生没有硅水凝胶）。卖点：①蛋白不易沉淀，戴久了不易浑浊磨眼；②佩戴干净舒适，不易引起眼部过敏；③三明治锁色工艺，花色夹在镜片中间，色素不直接接触眼球，更安全；④弥生主打大直径14.5mm，戴上更大更有神；⑤8.6mm通用弹性基弧，适合亚洲人眼球。答出材质＋至少两个卖点即可给分。","points":10,"no":11},{"type":"text","section":"简答题","stem":"哪几款花色有850度和900度的度数？","answer":"参考答案：有！小棕环pro6片装、小黑环pro6片装这两款（pro系列6片装）有850度和900度。其他常规款式最高只做到800度。客户要850/900度时优先推荐这两款pro6片装。答题要点：能答出这两款花色名即给分。","points":10,"no":12},{"type":"text","section":"简答题","stem":"女高三幅在不同平台的机制分别是什么？","answer":"参考答案：拼多多59.9三幅；抖音39.9三幅。记住：女高三幅拼多多59.9、抖音39.9，别报错平台机制。","points":10,"no":13},{"type":"text","section":"简答题","stem":"日抛99.9四盒的机制是都有的吗，正常售价是多少？","answer":"参考答案：不是所有店铺都有。只有抖音眼镜旗舰店的达人链接才有99.9四盒（均价24.9/盒）；正常售价是119.9四盒（39.9档普通款，均价29.9/盒）。答题要点：答出“仅抖音达人链接专属”＋“正常119.9四盒”即给分。","points":10,"no":14}]}];

async function refreshUnlock() {
  const name = ($('examinee').value || '').trim();

  if (name) {

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LETTER = i => String.fromCharCode(65 + i);
// 该题的正确答案文字（提交时随明细存库，成绩页直接显示，不再靠题号回查题库）
function ansTextOf(q){
  try {
    if (q.type === 'single' || q.type === 'judge')
      return (q.type === 'judge' ? '' : LETTER(q.answer) + '. ') + (q.options[q.answer] || '');
    if (q.type === 'multi')
      return q.answer.slice().sort((a, b) => a - b).map(i => LETTER(i) + '. ' + q.options[i]).join('\u3000');
    if (q.type === 'match')
      return (q.pairs || []).map(p => p.left + '\u2192' + LETTER(q.rightOptions.indexOf(p.right))).join('\u3000');
    if (q.type === 'text') return q.answer || '';
  } catch (e) { return ''; }
  return '';
}

    return '<button class="ptab' + (i === curPaper ? ' on' : '') + (locked ? ' lock' : '')
      + '" onclick="switchPaper(' + i + ')"'
      + (locked ? ' title="先完成「' + esc(PAPERS[i - 1].meta.title) + '」并交卷后解锁"' : '')

     '写出你的做法，' + pts + ' 分，按参考解析自评') + '</div>';
  qs.forEach(q => {
    html += '<div class="q" id="q' + q.no + '"><div class="q-head"><span class="q-no">' + q.no + '.</span>' +

    if (q.type === 'single' || q.type === 'judge') {
      html += '<div class="opts">' + q.options.map((o, i) =>
        '<label class="opt" data-no="' + q.no + '" data-i="' + i + '"><input type="radio" name="q' + q.no + '" value="' + i + '">' +
        '<span>' + (q.type === 'judge' ? '' : LETTER(i) + '. ') + esc(o) + '</span></label>').join('') + '</div>';
    } else if (q.type === 'multi') {
      html += '<div class="opts">' + q.options.map((o, i) =>
        '<label class="opt" data-no="' + q.no + '" data-i="' + i + '"><input type="checkbox" name="q' + q.no + '" value="' + i + '">' +
        '<span>' + LETTER(i) + '. ' + esc(o) + '</span></label>').join('') + '</div>';
    } else if (q.type === 'match') {
      html += '<div style="font-size:13px;color:var(--muted);margin:6px 0 2px 22px;">右侧选项：' +
        q.rightOptions.map((o, i) => LETTER(i) + '. ' + esc(o)).join('　') + '</div>';
      html += q.pairs.map((p, i) => '<div class="match-row"><span class="left">' + esc(p.left) + '</span><span>→</span>' +
        '<select data-no="' + q.no + '" data-i="' + i + '"><option value="">请选择字母</option>' +
        q.rightOptions.map((o, j) => '<option value="' + LETTER(j) + '">' + LETTER(j) + '. ' + esc(o) + '</option>').join('') +
        '</select></div>').join('');
    } else if (q.type === 'text') {
      html += '<textarea class="ta" data-no="' + q.no + '" rows="' + (q.points >= 8 ? 5 : 3) + '" placeholder="在这里作答…"></textarea>' +
        '<div style="font-size:12.5px;color:var(--muted);margin:4px 0 0 22px;">交卷后显示参考答案，需自评打分（' + q.points + ' 分）</div>';
    }
    html += '<div class="res" id="res' + q.no + '"></div></div>';
  });
  html += '</div>';
});
$('paper').innerHTML = html;
  bindOpts();
}

/* 选中态视觉（切卷重绘后要重新绑定） */
function bindOpts() {
  document.querySelectorAll('.opt input').forEach(inp => {
    inp.addEventListener('change', () => {
      document.querySelectorAll('.opt input[name="' + inp.name + '"]').forEach(x =>
        x.closest('.opt').classList.toggle('sel', x.checked));
    });
  });
}

/* 判分 */
function grade() {
  window.__qRes = [];
  QUIZ.questions.forEach(q => {
    const el = $('res' + q.no);
    let got = 0, full = q.points, detail = '', myAns = '';
    if (q.type === 'single' || q.type === 'judge') {
      const sel = document.querySelector('input[name="q' + q.no + '"]:checked');
      const chosen = sel ? +sel.value : -1;
      got = (chosen === q.answer) ? full : 0;
      myAns = chosen >= 0 ? (q.type === 'judge' ? q.options[chosen] : LETTER(chosen) + '. ' + q.options[chosen]) : '未作答';
      if (chosen >= 0) document.querySelectorAll('.opt[data-no="' + q.no + '"]')[chosen].classList.add(chosen === q.answer ? 'judge-ok' : 'judge-no');
      if (chosen !== q.answer) document.querySelectorAll('.opt[data-no="' + q.no + '"]')[q.answer].classList.add('judge-ok');
      detail = '正确答案：' + (q.type === 'judge' ? q.options[q.answer] : LETTER(q.answer) + '. ' + esc(q.options[q.answer]));
    } else if (q.type === 'multi') {
      const sels = [...document.querySelectorAll('input[name="q' + q.no + '"]:checked')].map(x => +x.value).sort();
      const ans = q.answer.slice().sort();
      const right = sels.length === ans.length && sels.every((v, i) => v === ans[i]);
      got = right ? full : 0;
      myAns = sels.length ? sels.map(i => LETTER(i) + '. ' + q.options[i]).join('　') : '未作答';
      ans.forEach(i => document.querySelectorAll('.opt[data-no="' + q.no + '"]')[i].classList.add('judge-ok'));
      sels.filter(i => ans.indexOf(i) < 0).forEach(i => document.querySelectorAll('.opt[data-no="' + q.no + '"]')[i].classList.add('judge-no'));
      detail = '正确答案：' + ans.map(i => LETTER(i) + '. ' + esc(q.options[i])).join('　');
    } else if (q.type === 'match') {
      const sels = [...document.querySelectorAll('select[data-no="' + q.no + '"]')].map(s => s.value);
      const rightCount = q.pairs.filter((p, i) => {
        const li = q.rightOptions.indexOf(p.right);
        return sels[i] === LETTER(li);
      }).length;
      got = Math.round(full * rightCount / q.pairs.length);
      myAns = q.pairs.map((p, i) => p.left + '→' + (sels[i] || '未选')).join('　');
      detail = '正确答案：' + q.pairs.map(p => esc(p.left) + '→' + LETTER(q.rightOptions.indexOf(p.right))).join('　') +
        '（右侧：' + q.rightOptions.map((o, i) => LETTER(i) + '.' + esc(o)).join('　') + '）';
    } else if (q.type === 'text') {
      const ta = document.querySelector('textarea[data-no="' + q.no + '"]');
      myAns = (ta && ta.value.trim()) ? ta.value.trim().slice(0, 500) : '未作答';
      // 重新交卷时要保住考生已选的自评分，否则自评会被重置为 0
      const prevSel = document.querySelector('select.self[data-no="' + q.no + '"]');
      const prevVal = prevSel ? prevSel.value : '0';
      el.innerHTML = '<span class="tag">📖 参考答案</span><div class="exp">' + esc(q.answer).replace(/\n/g, '<br>') + '</div>' +
        '<div class="selfscore">自评得分：<select data-no="' + q.no + '" class="self">' +
        Array.from({ length: full + 1 }, (_, i) => '<option value="' + i + '">' + i + '</option>').join('') +
        '</select> / ' + full + ' 分</div>';
      el.className = 'res show';
      window.__qRes.push({ no: q.no, section: q.section, ans: myAns, got: +prevVal, full: full, kind: 'self' });
      const newSel = el.querySelector('.self');
      newSel.value = prevVal;
      newSel.addEventListener('change', updateScore);
      return;   // 文本题分数由自评决定
    }
    window.__qRes.push({ no: q.no, section: q.section, ans: myAns, got: got, full: full, kind: 'auto' });
    el.className = 'res show ' + (got === full ? 'ok' : 'bad');
    el.innerHTML = '<span class="tag">' + (got === full ? '✔ 正确 +' + got : '✘ 错误 +' + got + '/' + full) + '</span>' +
      '<div class="exp">' + detail + '<br>' + esc(q.explain || '') + '</div>';
  });
  updateScore();
}

/* 汇总：客观题按判分结果，主观题按自评下拉实时重算 */
function updateScore() {
  const rows = window.__qRes || [];
  rows.forEach(r => {
    if (r.kind === 'self') {
      const s = document.querySelector('select.self[data-no="' + r.no + '"]');
      r.got = s ? +s.value : 0;
    }
  });
  const got = rows.reduce((n, r) => n + r.got, 0);
  const auto = rows.filter(r => r.kind === 'auto');
  const autoGot = auto.reduce((n, r) => n + r.got, 0);
  const autoFull = auto.reduce((n, r) => n + r.full, 0);
  const selfRows = rows.filter(r => r.kind === 'self');
  const selfGot = selfRows.reduce((n, r) => n + r.got, 0);
  const selfFull = selfRows.reduce((n, r) => n + r.full, 0);
  const total = QUIZ.meta.total;
  const per = {};
  rows.forEach(r => { per[r.section] = per[r.section] || { got: 0, full: 0 }; per[r.section].got += r.got; per[r.section].full += r.full; });
  const pass = got >= Math.ceil(total * 0.8);
  const box = $('scoreBox');
  box.innerHTML = '<div class="big">' + got + ' / ' + total + '</div>' +
    '<div class="sub">' + (pass ? '✅ 合格（80 分以上）' : '⚠️ 未达 80 分，建议复习易错点后重做') +
    '　·　客观题 ' + autoGot + ' / ' + autoFull + '　·　主观题自评 ' + selfGot + ' / ' + selfFull + '</div>' +
    '<div class="detail">' + Object.entries(per).map(([k, v]) =>
      '<div class="cell"><b>' + v.got + '/' + v.full + '</b>' + esc(k) + '</div>').join('') + '</div>';
  box.classList.add('show');
  $('footTip').textContent = '得分 ' + got + ' / ' + total;
}

/* ==================== 收卷：交卷后把成绩上报给主管 ==================== */
function setNote(html, isErr) {
  const n = $('submitNote');
  n.innerHTML = html;
  n.className = 'submit-note show' + (isErr ? ' err' : '');
  if (isErr) n.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function reportResult(name) {
  const btn = $('btnSubmit');
  const rows = window.__qRes || [];
  const autoRows = rows.filter(r => r.kind === 'auto');
  const selfRows = rows.filter(r => r.kind === 'self');
  const sum = a => a.reduce((n, r) => n + r.got, 0);
  const payload = {
    quiz_key: QUIZ_KEY(),
    quiz_title: QUIZ.meta.title,
    examinee: name,
    score: sum(rows),
    total: QUIZ.meta.total,
    auto_score: sum(autoRows),
    auto_total: autoRows.reduce((n, r) => n + r.full, 0),
    self_score: sum(selfRows),
    self_total: selfRows.reduce((n, r) => n + r.full, 0),
    duration_sec: Math.round((Date.now() - START_TS) / 1000),
    detail: rows.map(r => { const q = QUIZ.questions.find(q => q.no === r.no) || {}; return {
      no: r.no, sec: r.section,
      stem: q.stem || '',
      explain: q.explain || '',
      correct: ansTextOf(q),
      ans: r.ans || '', got: r.got, full: r.full, kind: r.kind }; }),
    user_agent: (navigator.userAgent || '').slice(0, 200)
  };
  btn.disabled = true; btn.textContent = '📤 正在提交…';
  try {
    const res = await fetch(SUPA_URL + '/rest/v1/quiz_results', {
      method: 'POST',
      headers: {
        'apikey': SUPA_KEY,
        'Authorization': 'Bearer ' + SUPA_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + (await res.text()).slice(0, 160));
    submitted = true;
    // 交卷成功 → 记录这份卷已考，解锁下一份
    doneKeys.add(QUIZ_KEY());
    const hadLock = unlockMax;
    calcUnlock();
    renderTabs();
    const unlockedNext = unlockMax > hadLock;
    const hasSelf = (payload.self_total || 0) > 0;
    const selfDone = (payload.self_score || 0) > 0;
    const needSelf = hasSelf && !selfDone;
    btn.disabled = false;
    btn.textContent = needSelf ? '📤 提交自评后的成绩' : '🔄 重新交卷';
    setNote('✅ <b>已提交</b>：' + name + ' 的成绩 <b>' + payload.score + ' / ' + payload.total +
      '</b> 已交给主管。' +
      (needSelf
        ? '<br><span style="color:#9b2c2c;font-weight:700;">⚠️ 主观题（纠错 / 简答）还没自评，现在这部分按 0 分算。</span>' +
          '<br><span style="opacity:.8;font-size:12.5px;">请往下翻到主观题，在「自评得分」下拉里给自己打分，再点下面的按钮提交一次，成绩才是完整的。</span>'
        : '<br><span style="opacity:.75;font-size:12.5px;">可以关掉这个页面了；改了答案再交一次也可以，主管按最新一次为准。</span>') +
      (unlockedNext && curPaper < PAPERS.length - 1
        ? '<br><span style="color:var(--primary-dark);font-weight:700;">🎉 已解锁下一份：「' + esc(PAPERS[curPaper + 1].meta.title) + '」，点上面的试卷标签就能开始做。</span>'
        : ''));
  } catch (e) {
    console.error('收卷上报失败', e);
    btn.disabled = false; btn.textContent = '✅ 交卷判分';
    setNote('⚠️ <b>成绩提交失败</b>：' + esc(e.message) +
      '<br>请把本页分数截图发给主管；网络正常后点「✅ 交卷判分」可重试。', true);
  }
}

$('btnSubmit').addEventListener('click', async () => {
  const name = ($('examinee').value || '').trim();
  if (!name) {
    alert('请先在最上方填写「考生姓名」——交卷后主管要按姓名查你的成绩。');
    $('examinee').focus();
    return;
  }
  try { localStorage.setItem('kefu_quiz_examinee', name); } catch (e) {}
  const un = QUIZ.questions.filter(q => {
    if (q.type === 'single' || q.type === 'judge') return !document.querySelector('input[name="q' + q.no + '"]:checked');
    if (q.type === 'multi') return document.querySelectorAll('input[name="q' + q.no + '"]:checked').length === 0;
    if (q.type === 'match') return [...document.querySelectorAll('select[data-no="' + q.no + '"]')].some(s => !s.value);
    return false;
  });
  if (un.length) {
    if (!confirm('还有 ' + un.length + ' 题没作答（第 ' + un.map(q => q.no).join('、') + ' 题），确定交卷？')) return;
  }
  grade();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  await reportResult(name);
});
$('btnReset').addEventListener('click', () => location.reload());
renderTabs(); renderMeta(); buildPaper();
/* 姓名填入后查她考过哪几份卷，恢复解锁进度 */
$('examinee').addEventListener('change', refreshUnlock);
try {
  const savedName = localStorage.getItem('kefu_quiz_examinee');
  if (savedName) { $('examinee').value = savedName; refreshUnlock(); }
} catch (e) {}
</script>
