<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客服考试</title>
<style>
  :root{--primary:#10b981;--primary-dark:#059669;--primary-light:rgba(16,185,129,.1);
        --danger:#e05252;--warn:#c2660a;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--bg:#f7f9f8;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);line-height:1.65;}
  .topbar{background:#fff;border-bottom:1px solid var(--border);padding:14px 20px;display:flex;
          align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10;}
  .topbar h1{font-size:18px;font-weight:800;letter-spacing:.4px;}
  .topbar .meta{font-size:12.5px;color:var(--muted);}
  .spacer{flex:1;}
  .btn{padding:8px 20px;border:none;border-radius:20px;font-size:13.5px;font-weight:700;cursor:pointer;
       font-family:inherit;transition:all .15s;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary);}
  .btn-ghost:hover{background:var(--primary-light);}
  .papertitle{background:#fff;border-bottom:1px solid var(--border);padding:10px 20px;display:flex;
              align-items:baseline;gap:12px;flex-wrap:wrap;}
  .papertitle h2{font-size:15px;font-weight:800;color:var(--primary-dark);}
  .papertitle .meta{font-size:12.5px;color:var(--muted);}
  .wrap{max-width:860px;margin:0 auto;padding:18px 20px 80px;}
  .papers{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .ptab{padding:7px 15px;border-radius:20px;border:1.5px solid var(--border);background:#fff;
        font-family:inherit;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .15s;}
  .ptab:hover{border-color:var(--primary);color:var(--primary-dark);}
  .ptab.on{background:var(--primary);border-color:var(--primary);color:#fff;}
  .ptab.lock{opacity:.45;cursor:not-allowed;}
  .ptab.lock:hover{border-color:var(--border);color:var(--muted);}
  .intro{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:16px;
         box-shadow:0 2px 12px rgba(31,41,55,.05);}
  .intro h2{font-size:15px;font-weight:800;margin-bottom:8px;}
  .intro p{font-size:13.5px;color:var(--muted);}
  .intro .warn{color:var(--danger);font-weight:700;margin-top:8px;font-size:13.5px;}
  .name-row{margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
            background:#f8fafc;border:1.5px solid var(--border);border-radius:11px;padding:10px 14px;}
  .name-row label{font-size:13.5px;font-weight:700;white-space:nowrap;}
  .name-row input{flex:1;min-width:170px;padding:9px 12px;border:1.5px solid var(--border);
                  border-radius:9px;font-size:14px;font-family:inherit;outline:none;background:#fff;}
  .name-row input:focus{border-color:var(--primary);}
  .name-row .must{font-size:11.5px;font-weight:700;color:#fff;background:var(--primary);
                  border-radius:10px;padding:3px 9px;flex-shrink:0;}
  .submit-note{display:none;margin:-6px 0 16px;padding:11px 16px;border-radius:12px;font-size:13.5px;
               line-height:1.6;background:var(--primary-light);color:#065f46;border:1px solid rgba(16,185,129,.35);}
  .submit-note.show{display:block;}
  .submit-note.err{background:rgba(224,82,82,.08);color:#9b2c2c;border-color:rgba(224,82,82,.35);}
  .sec{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:16px;
       box-shadow:0 2px 12px rgba(31,41,55,.05);}
  .sec > h2{font-size:15px;font-weight:800;color:var(--primary-dark);margin-bottom:4px;
            border-left:4px solid var(--primary);padding-left:10px;}
  .sec > .hint{font-size:12.5px;color:var(--muted);margin:6px 0 14px 14px;}
  .q{padding:12px 0;border-bottom:1px dashed var(--border);}
  .q:last-child{border-bottom:none;}
  .q-head{display:flex;gap:8px;font-size:14.5px;font-weight:700;align-items:flex-start;}
  .q-no{color:var(--primary-dark);flex-shrink:0;}
  .q-pts{font-size:11.5px;color:var(--muted);font-weight:600;flex-shrink:0;margin-top:3px;}
  .opts{margin:8px 0 0 22px;display:flex;flex-direction:column;gap:6px;}
  .opt{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer;padding:5px 10px;
       border:1.5px solid var(--border);border-radius:9px;background:#fff;transition:all .12s;}
  .opt:hover{border-color:var(--primary);}
  .opt input{margin-top:4px;accent-color:var(--primary);flex-shrink:0;}
  .opt.sel{background:var(--primary-light);border-color:var(--primary);}
  .opt span{white-space:pre-line;line-height:1.72;word-break:break-word;}
  .ta{width:100%;min-height:64px;margin:8px 0 0 22px;width:calc(100% - 22px);padding:9px 12px;
      border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:13.5px;outline:none;resize:vertical;}
  .ta:focus{border-color:var(--primary);}
  .match-row{display:flex;align-items:center;gap:10px;margin:8px 0 0 22px;flex-wrap:wrap;font-size:14px;}
  .match-row .left{font-weight:700;min-width:130px;}
  .match-row select{padding:7px 10px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;
                    font-size:13.5px;outline:none;background:#fff;flex:1;min-width:200px;}
  .judge-ok{border-color:var(--primary)!important;background:var(--primary-light)!important;}
  .judge-no{border-color:var(--danger)!important;background:rgba(224,82,82,.08)!important;}
  .res{margin-top:8px;margin-left:22px;font-size:13px;border-radius:9px;padding:8px 12px;display:none;}
  .res.show{display:block;}
  .res.ok{background:var(--primary-light);color:#065f46;}
  .res.bad{background:rgba(224,82,82,.08);color:#9b2c2c;}
  .res .tag{font-weight:800;margin-right:6px;}
  .res .exp{margin-top:4px;color:var(--text);}
  .score{background:#fff;border:2px solid var(--primary);border-radius:14px;padding:18px;margin-bottom:16px;
         text-align:center;display:none;box-shadow:0 4px 18px rgba(16,185,129,.15);}
  .score.show{display:block;}
  .score .big{font-size:40px;font-weight:800;color:var(--primary-dark);line-height:1.2;}
  .score .sub{font-size:13.5px;color:var(--muted);margin-top:4px;}
  .score .detail{margin-top:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .score .cell{background:var(--primary-light);border-radius:10px;padding:8px 14px;font-size:12.5px;}
  .score .cell b{display:block;font-size:18px;color:var(--primary-dark);}
  .selfscore{margin-left:22px;margin-top:6px;font-size:13px;color:var(--muted);}
  .selfscore select{padding:5px 8px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;}
  .footbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);
           padding:10px 20px;display:flex;gap:12px;align-items:center;justify-content:center;z-index:20;}
  .footbar .tip{font-size:12.5px;color:var(--muted);}
  @media print{
    .topbar,.footbar,.btn{display:none!important;}
    body{background:#fff;}
    .sec{box-shadow:none;break-inside:avoid;}
    .res{display:block!important;}
  }
  @media (max-width:600px){ .wrap{padding:12px 12px 90px;} .q-pts{display:none;} }
</style>
</head>
<body>
<div class="topbar">
  <h1>📝 客服考试</h1>
  <span class="spacer"></span>
  <div class="papers" id="paperTabs" style="margin-bottom:0;"></div>
  <button class="btn btn-ghost" onclick="window.print()">🖨 打印</button>
</div>
<div class="papertitle">
  <h2 id="tTitle"></h2>
  <span class="meta" id="tMeta"></span>
</div>
<div class="wrap">
  <div class="intro">
    <h2>📋 答题说明（先选上面的试卷）</h2>
    <div class="papers" id="paperTabs"></div>
    <p id="introText"></p>
    <div class="name-row">
      <label for="examinee">👤 考生姓名</label>
      <input id="examinee" type="text" maxlength="20" autocomplete="off" placeholder="先填姓名再答题（姓名决定你解锁到第几份试卷）">
      <span class="must">必填</span>
    </div>
    <div class="warn">⚠️ 先选试卷 → 填姓名 → 答题 → 交卷。交卷后自动判分并显示每题解析，成绩同步到「考核成绩」页（主管按姓名查）。</div>
  </div>
  <div class="score" id="scoreBox"></div>
  <div class="submit-note" id="submitNote"></div>
  <div id="paper"></div>
</div>
<div class="footbar">
  <span class="tip" id="footTip">做完点交卷，系统自动判分（简答题需自评）</span>
  <button class="btn btn-primary" id="btnSubmit">✅ 交卷判分</button>
  <button class="btn btn-ghost" id="btnReset">↺ 重做</button>
</div>
<script>
const PAPERS = [{"meta":{"key":"exam-一","title":"试卷一 · 美瞳基础知识","subtitle":"客服考试 · 试卷一 · 美瞳基础知识","intro":"说明：单选题，每题4分，满分100分。可在本表直接编辑题目/选项/答案/解析，修改后重新导入即可。","counts":25,"total":100,"dataNote":"题目同步自飞书《客服考试》试卷表，改表格后重新导入即可更新","timeLimit":"满分 100 分（合格率 80%）"},"questions":[{"type":"single","section":"单选题","stem":"美瞳（彩色隐形眼镜）属于第几类医疗器械？","options":["第一类","第二类","第三类","不属于医疗器械"],"answer":2,"explain":"美瞳属于第三类医疗器械，与人工心脏瓣膜同属严格监管范畴，销售需具备《医疗器械经营许可证》。","points":4,"no":1},{"type":"single","section":"单选题","stem":"客户问“是不是正品”，以下哪个是正确应对的核心要点？","options":["口头保证是正品即可","说明品牌方直营、有药监局注册证号、盒身流水码可验真，并给出售后保障","反问客户为什么不相信","直接结束对话"],"answer":1,"explain":"统一口径：我们是品牌方直营，货源统一；每盒有专属流水码可验真，药监局官网可查注册信息，支持拆封试戴1片。","points":4,"no":2},{"type":"single","section":"单选题","stem":"弥生品牌主卖的直径是？","options":["14.0mm","14.2mm","14.5mm","14.8mm"],"answer":2,"explain":"弥生品牌主卖大直径美瞳（14.5mm），让眼睛看起来更大更有神，是品牌核心优势。","points":4,"no":3},{"type":"single","section":"单选题","stem":"客户框架眼镜 350 度，隐形眼镜应选多少度？","options":["350度","325度","375度","300度"],"answer":0,"explain":"400度以下直接按自身度数选，不用减。","points":4,"no":4},{"type":"single","section":"单选题","stem":"客户框架眼镜 450 度，隐形眼镜应选多少度？","options":["450度","425度","400度","475度"],"answer":1,"explain":"400~500度减25度，450-25=425度。","points":4,"no":5},{"type":"single","section":"单选题","stem":"客户框架眼镜 600 度，隐形眼镜应选多少度？","options":["600度","575度","550度","525度"],"answer":2,"explain":"500~700度减50度，600-50=550度。","points":4,"no":6},{"type":"single","section":"单选题","stem":"框架眼镜 750 度，隐形眼镜应选多少度？","options":["750度","725度","700度","675度"],"answer":3,"explain":"700度以上减75度，750-75=675度。","points":4,"no":7},{"type":"single","section":"单选题","stem":"咱们美瞳最高做到多少度？","options":["600度","700度","800度","1000度"],"answer":2,"explain":"咱们美瞳最高只做到800度，超过800度没有生产。","points":4,"no":8},{"type":"single","section":"单选题","stem":"散光 100 度的客户（近视400度以内）该怎么选度数？","options":["直接忽略散光","散光度数÷2加到近视度数里，再按近视换算表减","散光全部加到近视里","单独买散光片"],"answer":1,"explain":"散光150度以内（低度散光）：散光度数÷2，加到近视度数里，再按近视换算表减；散光超过150度建议配散光定制片，咱们不支持换算和定制。","points":4,"no":9},{"type":"single","section":"单选题","stem":"半年抛镜片的含水量一般在多少？","options":["≦38%（低含水量）","40%-50%（高含水量）","55%以上","无要求"],"answer":0,"explain":"半年抛等长周期镜片采用低含水量（≦38%），硬度高、成型好、水分不易流失，适合新手、长时间佩戴和干眼人群。","points":4,"no":10},{"type":"single","section":"单选题","stem":"日抛镜片的含水量一般在多少？","options":["≦38%","40%-50%","55%以上","20%以下"],"answer":1,"explain":"日抛等短周期镜片含水量40%-50%，柔软性好、透氧性好，但水分不足时会倒吸泪液。","points":4,"no":11},{"type":"single","section":"单选题","stem":"关于含水量，下面哪种说法正确？","options":["含水量越高越好","高含水量适合干眼人群","含水量高反而可能倒吸眼球水分导致眼干","低含水量容易破损"],"answer":2,"explain":"含水量高≠适合干眼，长时间佩戴时镜片水分低于应有含水量会倒吸眼球水分，干眼人群和长戴人群更适合低含水量。","points":4,"no":12},{"type":"single","section":"单选题","stem":"新手第一次买美瞳，更建议选哪种？","options":["日抛","半年抛","年抛","都一样"],"answer":1,"explain":"新手建议先选半年抛：成型好、容易戴入眼；日抛镜片较软不易入眼，更容易变形破损。","points":4,"no":13},{"type":"single","section":"单选题","stem":"咱们品牌的基弧是多少？","options":["8.0mm","8.4mm","8.6mm","9.0mm"],"answer":2,"explain":"咱们采用适合亚洲人的 8.6mm 通用弹性基弧，适合大部分人；基弧上下0.2mm误差影响不大。","points":4,"no":14},{"type":"single","section":"单选题","stem":"基弧过小（镜片太紧）可能出现什么症状？","options":["滑片、移位","磨眼、干涩、头晕、眼球压迫感","完全没影响","更容易脱落"],"answer":1,"explain":"基弧过小→镜片太紧→磨眼、干涩、头晕、眼球压迫感、眼睛红、视线不清；基弧过大→太松→移位、滑片、容易脱落。","points":4,"no":15},{"type":"single","section":"单选题","stem":"咱们美瞳的材质是什么？","options":["硅水凝胶","非离子水凝胶","MPC材质","普通水凝胶"],"answer":1,"explain":"咱们用的是非离子水凝胶（弥生没有硅水凝胶），蛋白不易沉淀、佩戴干净舒适，配合三明治锁色工艺更安全。","points":4,"no":16},{"type":"single","section":"单选题","stem":"“三明治锁色工艺”是指？","options":["镜片分三层叠加","花色夹在镜片中间，色素不直接接触眼球","锁边加粗设计","超薄工艺"],"answer":1,"explain":"三明治工艺：花色（着色层）夹在镜片中间，色素不直接接触眼球，更安全。","points":4,"no":17},{"type":"single","section":"单选题","stem":"客户问“这款大不大”，实际上最关心的是？","options":["总直径DIA","着色直径","基弧","含水量"],"answer":1,"explain":"真正决定放大效果的是着色直径而不是总直径；想要明显放大效果的客户，优先推荐着色直径大的款式。","points":4,"no":18},{"type":"single","section":"单选题","stem":"目前弥生所有款式的锁边情况是？","options":["全部有锁边（粗/细）","有部分无锁边款","全部无锁边","随机"],"answer":0,"explain":"咱们目前所有款都是有锁边的（粗锁边/细锁边），暂时没有无锁边款；细锁边已经很自然。","points":4,"no":19},{"type":"single","section":"单选题","stem":"新镜片拆封后需要浸泡多久再佩戴？","options":["1小时","2小时","6小时以上","不用泡直接戴"],"answer":2,"explain":"新镜片用护理液浸泡 6 小时以上再佩戴。","points":4,"no":20},{"type":"single","section":"单选题","stem":"美瞳可以与他人共用吗？","options":["可以","严禁共用","熟人或家人可以","消毒后可以"],"answer":1,"explain":"严禁与他人共用美瞳！佩戴前洗手擦干，保持手部清洁。","points":4,"no":21},{"type":"single","section":"单选题","stem":"每天都佩戴美瞳，护理液应多久更换一次？","options":["每天更换","2-3天更换一次","一周一次","不用换"],"answer":0,"explain":"每天都戴→护理液每天换一次；长时间不戴→2-3天换一次。护理液主要成分是聚氨基丙二胍，起消毒杀菌作用。","points":4,"no":22},{"type":"single","section":"单选题","stem":"第一次佩戴美瞳，当天佩戴时长建议？","options":["不超过2小时","不超过4小时","不超过8小时","想戴多久戴多久"],"answer":1,"explain":"第一天戴不超过4小时，每天递增2小时。","points":4,"no":23},{"type":"single","section":"单选题","stem":"关于透氧率，下列哪种说法正确？","options":["透氧率低=质量不合格","国标对水凝胶透氧有强制数值门槛","拿到药监局注册证即合规，透氧只是参考参数之一","硅水凝胶一定比水凝胶好"],"answer":2,"explain":"国标对水凝胶透氧没有强制数值要求，只要拿到注册证就是合规的；透氧率低不等于质量不合格。","points":4,"no":24},{"type":"single","section":"单选题","stem":"散光最高可以换算到多少度？超过多少度不建议换算？","options":["100度（超过100度不建议换算）","150度（超过150度不建议换算）","200度（超过200度不建议换算）","250度（超过250度不建议换算）"],"answer":1,"explain":"散光150度以内（低度散光）可以换算：散光度数÷2加到近视度数里，再按近视换算表减；超过150度不建议换算，建议配散光定制片，咱们不支持换算和定制。","points":4,"no":25}]},{"meta":{"key":"exam-二","title":"试卷二 · 花色明细 · 抛型与分类 · 价格","subtitle":"客服考试 · 试卷二 · 花色明细 · 抛型与分类 · 价格","intro":"说明：共 20 题，每题 5 分，满分 100 分。第 9、10 题为选择题（自动判分），其余为简答题（交卷后由主管人工评分）。","counts":20,"total":100,"dataNote":"题目同步自飞书《客服考试》试卷表，改表格后重新导入即可更新","timeLimit":"满分 100 分（合格率 80%）"},"questions":[{"type":"text","section":"简答题","stem":"弥生美瞳按抛型分为哪两类？","answer":"日抛 / 半年抛 两类。","points":5,"no":1},{"type":"text","section":"简答题","stem":"弥生美瞳按哪两类区分价格？","answer":"按「抛型」（半年抛 / 日抛）和「是否定轴」（普通款 / 定轴款）两类区分价格：半年抛普通 49.9、半年抛定轴 59.9；日抛普通 39.9、日抛定轴 49.9（均为单副/单盒到手价）。","points":5,"no":2},{"type":"text","section":"简答题","stem":"半年抛一盒几片？","answer":"半年抛一盒 1 片；下单买 1 副发 2 盒（共 2 片），支持备注左右眼不同度数。","points":5,"no":3},{"type":"text","section":"简答题","stem":"日抛一盒几片？","answer":"日抛一盒 6 片装；左右眼同度数，不支持备注左右眼不同度数。","points":5,"no":4},{"type":"text","section":"简答题","stem":"半年抛定轴款单副价格是？","answer":"半年抛定轴 59.9 元/副（到手价）；2 副 89.8 元、3 副 129.7 元（均价 43.23 元/副）。","points":5,"no":5},{"type":"text","section":"简答题","stem":"半年抛普通款单副价格是？","answer":"普通半年抛 49.9 元/副（到手价）；2 副 69.8 元、3 副 99.7 元（均价 33.23 元/副，3 副最划算）。按系列还有 29.9 元/副（女高、心动信号 / 心动调频）和 59.9 元/副（少女漫普通、人鱼普通）档，答出分档即给分。","points":5,"no":6},{"type":"text","section":"简答题","stem":"日抛普通单盒价格是？","answer":"普通日抛 39.9 元/盒（到手价）；2 盒 69.8 元、4 盒 119.6 元（均价 29.9 元/盒）、6 盒 149.4 元、10 盒 249 元（均价 24.9 元/盒）。","points":5,"no":7},{"type":"text","section":"简答题","stem":"日抛定轴单盒价格是？","answer":"定轴日抛 49.9 元/盒（到手价）；2 盒 89.8 元、4 盒 139.6 元（均价 34.9 元/盒）、6 盒 199.4 元、10 盒 329 元（均价 32.9 元/盒）。","points":5,"no":8},{"type":"single","section":"单选题","stem":"客户下单的10盒普通囤货日抛，以下哪些花色可以备注？","options":["冷雾茶黑6片装\n笨蛋美女6片装\n小黑环pro6片装\n绿野仙棕6片装\n心动降临6片装\n甜妹狙击6片装\n恋爱情报6片装\n小棕环pro6片装\n黄油小熊6片装\n无人区玫瑰6片装","冷雾茶黑6片装\n笨蛋美女6片装\n小黑环pro6片装\n绿野仙棕6片装\n心动降临6片装\n甜妹狙击6片装\n恋爱情报6片装\n小棕环pro6片装\n黄油小熊6片装\nD爱的无限曲6片装","冷雾茶黑\n笨蛋美女\n小黑环pro\n绿野仙棕\n心动降临\n甜妹狙击\n恋爱情报\nD在逃公主pro\n黄油小熊\n无人区玫瑰","冷雾茶黑6片装\n笨蛋美女6片装\n小黑环pro6片装\nD虚拟泪光6片装\n心动降临6片装\n甜妹狙击6片装\n恋爱情报6片装\n小棕环pro6片装\n黄油小熊6片装\n甜妹狙击6片装"],"answer":0,"explain":"正确答案 A。普通囤货日抛＝非定轴 6 片装。B 混入「D爱的无限曲6片装」（D 开头＝定轴款，不能按普通囤货备注）；C 只写花名没写 6 片装，是半年抛款；D 混入「D虚拟泪光6片装」（定轴款），且「甜妹狙击」重复了一次。","points":5,"no":9},{"type":"single","section":"单选题","stem":"客户下单的女高系列39.9三幅订单，以下哪些花色可以备注？","options":["她的梨涡\n伦敦碎片\n窗外樱花\n妮妮千金\n校花指南\n汪汪队\n甜断记忆\n甜宠学妹\n冰岛日记\n加州校园","她的梨涡\n伦敦碎片\n窗外樱花\n妮妮千金\n校花指南\n汪汪队\n甜断记忆\n甜宠学妹\n冰岛日记\n黄油小熊","甜美式\n森林来信\n小狗心事\n造梦乐园\n黑莓缪斯\n我喜欢你\n你的名字\n夜与法兰西\n元气女高\n冷雾茶黑","国民初恋\n栗栗在逃\n蓝朋友\n告白汽水\n转校千金\n千禧莓莓\n心动信号\n甜蜜暗号\n等你下课\nD在逃公主pro"],"answer":0,"explain":"正确答案 A。女高 39.9 三副只能备注女高系列可选花色。B 混入黄油小熊（花厨小熊半年抛，别的系列）；C 混入冷雾茶黑（随便花半年抛）；D 混入 D在逃公主pro（定轴半年抛），都不在 39.9 三副可选范围。","points":5,"no":10},{"type":"text","section":"简答题","stem":"我们弥生的美瞳是什么材质的？有什么卖点？","answer":"材质：非离子水凝胶（弥生没有硅水凝胶）。卖点：①不易沉淀蛋白，戴久了不浑浊、不磨眼；②干净舒适，不易引起眼部过敏；③三明治锁色工艺，色素夹在镜片中间不接触眼球，更安全；④主打大直径 14.5mm，戴上更大更有神；⑤8.6mm 通用弹性基弧，适合亚洲人眼球。答出材质＋至少两个卖点即可给分。","points":5,"no":11},{"type":"text","section":"简答题","stem":"哪几款花色有850度和900度的度数？","answer":"小棕环pro 6片装、小黑环pro 6片装这两款有 850 度和 900 度；其他常规花色最高只做到 800 度。客户要 850/900 度优先推荐这两款。答出这两款花色名即可给分。","points":5,"no":12},{"type":"text","section":"简答题","stem":"女高三幅在不同平台的机制分别是什么？","answer":"抖音：39.9 元三副；拼多多：59.9 元三副；其他平台（天猫/京东等）：没有三副机制，按 29.9 元/副。别把平台机制报错。","points":5,"no":13},{"type":"text","section":"简答题","stem":"日抛普通和定轴，四盒的价格分别是多少？","answer":"普通日抛 4 盒 119.6 元（均价 29.9 元/盒）；定轴日抛 4 盒 139.6 元（均价 34.9 元/盒）。补充：抖音眼镜旗舰店达人链接普通款 4 盒 99.6 元（均价 24.9 元/盒）。","points":5,"no":14},{"type":"text","section":"简答题","stem":"女高39.9三幅是哪个平台的价格？其他平台有吗？","answer":"39.9 三副是抖音（抖音眼镜旗舰店）的价格。其他平台没有 39.9 三副：拼多多是 59.9 元三副，天猫/京东等其他平台按 29.9 元/副。","points":5,"no":15},{"type":"text","section":"简答题","stem":"普通日抛99.9四盒是哪个平台的价格？其他平台有吗？","answer":"只有抖音眼镜旗舰店的达人链接才有 99.9 元四盒（均价 24.9 元/盒，价格页到手价显示 99.6）。其他平台/普通链接没有这个价，正常售价是 119.6 元四盒（39.9 档普通款，均价 29.9 元/盒）。","points":5,"no":16},{"type":"text","section":"简答题","stem":"客户下单的10盒囤货日抛，需要帮忙备注的花色里面有","answer":"普通日抛（非定轴）6 片装的花色都可以备注：冷雾茶黑、笨蛋美女、小黑环pro、绿野仙棕、心动降临、甜妹狙击、恋爱情报、小棕环pro、黄油小熊、无人区玫瑰（即第 9 题 A 组）。D 开头的定轴款（如 D在逃公主pro、D虚拟泪光、D爱的无限曲）不能按普通囤货备注；只写花名不写「6片装」的是半年抛款。","points":5,"no":17},{"type":"text","section":"简答题","stem":"客户下单的订单金额是29.9，发三个花色让你帮忙备注，可以备注吗？","answer":"不能直接备注。29.9 元对应半年抛单副（1 副＝2 盒、一个花色，按系列是女高 / 心动信号 / 心动调频），一副只能备注一个花色；客户发三个花色说明下的是三副装活动（抖音女高 39.9 三副、拼多多女高 59.9 三副、随便花/花厨小熊 99.9 三副等）。要先核对订单实际活动和价格档，按对应三副装备注，金额对不上要补差价或改单。答出「一副一个花色，三个花色要核对活动/价格档」即给分。","points":5,"no":18},{"type":"text","section":"简答题","stem":"那几款花色没有生产525  575的度数？","answer":"按公司实际生产度数表核对，点名具体缺 525、575 度的花色（常规度数档含 0~800，525、575 属常规档，个别花色/新品/小直径款未覆盖）。答题要求写出具体花色名，主管按最新度数表判分。","points":5,"no":19},{"type":"text","section":"简答题","stem":"定轴美瞳的原理是什么？","answer":"定轴（定位）原理：镜片做了定位/加重设计，让花纹高光固定在同一个方向，戴上后不随眼球转动移位，眼神方向稳定；适合对高光位置有要求的客户（很多客户戴普通款会觉得高光歪、斜眼）。","points":5,"no":20}]},{"meta":{"key":"exam-三","title":"试卷三 · 注意事项 · 拼多多规范","subtitle":"客服考试 · 试卷三 · 注意事项 · 拼多多规范","intro":"说明：单选题+判断题，每题4分，满分100分。可在本表直接编辑题目/选项/答案/解析，修改后重新导入即可。","counts":25,"total":100,"dataNote":"题目同步自飞书《客服考试》试卷表，改表格后重新导入即可更新","timeLimit":"满分 100 分（合格率 80%）"},"questions":[{"type":"single","section":"单选题","stem":"售前接待的“黄金响应”时间是多少？","options":["3秒","6秒","10秒","30秒"],"answer":1,"explain":"快速回复，重视黄金6秒，快速响应才能留住客户。","points":4,"no":1},{"type":"single","section":"单选题","stem":"拼多多分流号规定：客户发消息后几分钟内必须回复？","options":["1分钟","3分钟","5分钟","10分钟"],"answer":1,"explain":"正常上班期间，客户发消息后3分钟内必须回复；每一轮会话不能超过3分钟。","points":4,"no":2},{"type":"single","section":"单选题","stem":"分流号早班几点准时上线？","options":["7:00","8:00","9:00","9:30"],"answer":1,"explain":"早班8点准时上线，8点上线后离线客户的消息必须3分钟内回复；可以先发快捷话术让客户等待，之后必须一一处理不能漏。","points":4,"no":3},{"type":"single","section":"单选题","stem":"分流号晚班几点才能挂起？","options":["21:00","22:00","23:00","23:30"],"answer":3,"explain":"晚班23:30才能挂起，8:00-23:30期间不能挂起、不能无人在线。","points":4,"no":4},{"type":"single","section":"单选题","stem":"登录分流号必须怎么做？","options":["群里报备打卡","不用报备","私下告诉主管","发朋友圈"],"answer":0,"explain":"登录分流号必须群里报备打卡，早晚班都要打卡，格式如：早班已上线，负责2、3、4店分流。","points":4,"no":5},{"type":"single","section":"单选题","stem":"下面哪种连续回复会被平台识别为敷衍？","options":["“好的宝宝”“对的宝宝”“收到宝宝”等相似话术连续回复","每次都认真回复不同内容","回复带表情","回复稍慢"],"answer":0,"explain":"不能连续回复相似话术（好的宝宝、对的宝宝、收到宝宝、备注了宝宝……），平台识别很严，要注意换着说。","points":4,"no":6},{"type":"single","section":"单选题","stem":"关于引导第三方/线下交易，正确的是？","options":["可以发个人收款码","可以引导加微信下单","不能提微信、QQ、电话，所有交易走平台","电话沟通更高效，可以给号码"],"answer":2,"explain":"不能引导第三方/线下交易：不能提微信、QQ、电话；不能发个人收款码，所有交易走平台。","points":4,"no":7},{"type":"single","section":"单选题","stem":"关于好评返现，正确的是？","options":["可以引导好评返现","可以说“好评返现5元”","不能引导好评返现，平台严打会扣分罚款","只对老客户说没关系"],"answer":2,"explain":"不能引导好评返现：说“好评返现5元”直接扣分罚款，平台重点监控。","points":4,"no":8},{"type":"single","section":"单选题","stem":"关于运费险，正确的是？","options":["可以私自承诺客户有运费险","可以承诺包邮运费","运费险按平台规则走，不能私自承诺","客户要求就必须答应"],"answer":2,"explain":"不能私自承诺运费险：运费险按平台规则走，不能私自承诺客户有运费险，也不能承诺包邮运费。","points":4,"no":9},{"type":"single","section":"单选题","stem":"拼多多售前高压线“回复内容类”第一条是什么？","options":["不能重复发一样的话术","客户消息3分钟内必须回","不能私自改价","不能泄露客户信息"],"answer":0,"explain":"高压线回复内容类5条：1不能重复发一样的话术（会被判机器人降权）2不能引导站外3不能骂人/态度恶劣4不能用敏感词/违禁词5不能承诺做不到的事。","points":4,"no":10},{"type":"single","section":"单选题","stem":"下列哪一组属于违禁词/敏感词？","options":["最、第一、绝对","好、优质","包邮、赠品","正品、保障"],"answer":0,"explain":"最、第一、绝对等极限词属于违禁词，不能说。","points":4,"no":11},{"type":"single","section":"单选题","stem":"关于“已读不回”，正确的是？","options":["看了不用回","客户投诉“不回复”直接成立，比回复慢更严重","只要最后回一句就行","系统不统计"],"answer":1,"explain":"已读不回=更严重：看到了故意不回，客户投诉“不回复”直接成立。","points":4,"no":12},{"type":"single","section":"单选题","stem":"关于私自改价，正确的是？","options":["可以私下承诺优惠","可以给客户退差价","所有价格操作走系统，不能私下承诺优惠/差价","跟领导说一声就能改"],"answer":2,"explain":"不能私自改价：所有价格操作走系统，不能私下承诺优惠/差价。","points":4,"no":13},{"type":"single","section":"单选题","stem":"关于引导退款重拍/换链接，正确的是？","options":["可以让客户退了重拍别的链接","平台算违规","客户要求就可以","换链接更划算，可以引导"],"answer":1,"explain":"不能引导退款重拍/换链接：让客户退了重拍别的链接，平台算违规。","points":4,"no":14},{"type":"single","section":"单选题","stem":"把难搞的客户转分流号甩锅，属于？","options":["正常操作","数据作弊","为客户好","合理分流"],"answer":1,"explain":"数据作弊类：不能把难搞客户转分流号甩锅（聊崩了/客户不下单就转分流号，算作弊）；不能泄露客户信息。","points":4,"no":15},{"type":"single","section":"单选题","stem":"新客服必背 Top5 高频违规点不包括以下哪项？","options":["3分钟内必回","不引导站外","不重复话术","可以私下承诺赠品"],"answer":3,"explain":"Top5：①3分钟内必回 ②不引导站外 ③不重复话术 ④8-23点必在线 ⑤不私自改价/承诺好评返现。触碰任何一条按公司制度处罚。","points":4,"no":16},{"type":"single","section":"单选题","stem":"每天佩戴美瞳，护理液怎么换？","options":["每天换一次","2-3天换一次","一周换一次","不用换"],"answer":0,"explain":"每天都戴→护理液每天换一次；长时间不戴→2-3天换一次。","points":4,"no":17},{"type":"single","section":"单选题","stem":"客户出现眼红、眼痛、持续不适，客服应建议？","options":["继续佩戴适应","滴眼药水继续戴","立即取下并就医","减少佩戴时间即可"],"answer":2,"explain":"出现眼红、眼痛、持续不适，立即取下并就医。","points":4,"no":18},{"type":"single","section":"单选题","stem":"催付的时间间隔建议是？","options":["1分钟催一次","3-5分钟催一次，依次延续至少3次","10分钟催一次","下班前催一次"],"answer":1,"explain":"催付时间间隔把握好，隔3-5分钟催一次，依次延续至少3次，下班之前跟进催付询单流失的。","points":4,"no":19},{"type":"single","section":"单选题","stem":"售前岗位的“一句话记住”是什么？","options":["售前是答疑的，答完就结束","售前是卖货的，不是答疑的——答完问题必须推荐花色、引导下单","售前只管聊参数","售前只负责催付"],"answer":1,"explain":"一句话记住：售前是卖货的，不是答疑的——答完问题必须推荐花色、引导下单，不能答完就结束。","points":4,"no":20},{"type":"judge","section":"判断题","stem":"美瞳销售需要具备《医疗器械经营许可证》，产品需有药监局注册证号。","options":["正确","错误"],"answer":0,"explain":"正确。美瞳是第三类医疗器械，销售需具备《医疗器械经营许可证》，产品需有注册证号，可通过药监局官网查询真伪。","points":4,"no":21},{"type":"judge","section":"判断题","stem":"可以引导客户好评返现来提升店铺评分。","options":["正确","错误"],"answer":1,"explain":"错误。不能引导好评返现，平台严打，查到会扣分罚款。","points":4,"no":22},{"type":"judge","section":"判断题","stem":"拼多多高压线规定：8:00-23:00 期间不能挂离开，离线时长超标会降权。","options":["正确","错误"],"answer":0,"explain":"正确。8:00-23:00必须在线，这个时间段不能挂离开，离线时长超标降权。","points":4,"no":23},{"type":"judge","section":"判断题","stem":"答应的赠品/活动可以不兑现，客户不会计较。","options":["正确","错误"],"answer":1,"explain":"错误。答应的赠品/活动必须兑现，说送就送，不送就是商家责任；不能承诺做不到的事，答应了必须兑现。","points":4,"no":24},{"type":"judge","section":"判断题","stem":"分流号规范中，早晚班登录都需要在群里报备打卡。","options":["正确","错误"],"answer":0,"explain":"正确。早晚班都要打卡，格式：早班已上线，负责2、3、4店分流；晚班已上线，负责5、6店分流。","points":4,"no":25}]},{"meta":{"key":"exam-四","title":"试卷四 · 发货履约 · 延迟发货 · 合并发货 · 预定缺货","subtitle":"客服考试 · 试卷四 · 发货履约 · 延迟发货 · 合并发货 · 预定缺货","intro":"说明：单选题+判断题，每题4分，满分100分。可在本表直接编辑题目/选项/答案/解析，修改后重新导入即可。","counts":25,"total":100,"dataNote":"题目同步自飞书《客服考试》试卷表，改表格后重新导入即可更新","timeLimit":"满分 100 分（合格率 80%）"},"questions":[{"type":"single","section":"单选题","stem":"客户要求延迟发货，备注应该怎么写？","options":["暂不发，11.5号发出","晚会发","明天发","尽快发"],"answer":0,"explain":"延迟发货必须备注具体时间，如“暂不发，11.5号发出”；禁止备注“晚会发”“明天发、后天发、周几发”这种模糊词。","points":4,"no":1},{"type":"single","section":"单选题","stem":"拼多多平台对发货时效的要求是？","options":["24小时内发货","48小时内","72小时内","无要求"],"answer":0,"explain":"平台要求24小时内发货，超时未发货会触发平台处罚；拼多多没有协商延迟发货的功能。","points":4,"no":2},{"type":"single","section":"单选题","stem":"两单合并发货时，备注要求是？","options":["两单都必须备注","只备注主单","只备注副单","都不用备注"],"answer":0,"explain":"客户分开拍了两单需要合并发货时，两单都必须备注（漏备注，会当做无备注批量审核）；主单备注完整信息，副单备注“合并发货”。","points":4,"no":3},{"type":"single","section":"单选题","stem":"合并发货时，主单和副单分别怎么备注？","options":["主单备注完整信息，副单备注“合并发货”","副单备注完整信息，主单备注“合并发货”","两单都备注完整信息","两单都只备注“合并发货”"],"answer":0,"explain":"主单备注完整信息（花色+度数+数量+活动等），副单备注“合并发货”。","points":4,"no":4},{"type":"single","section":"单选题","stem":"合并发货前必须检查什么？","options":["两单收货地址是否一致","客户有没有好评","花色是否缺货","快递是否一样"],"answer":0,"explain":"合并发货前必须检查两单地址是否一致，不一致无法合并，需要修改成一致。","points":4,"no":5},{"type":"single","section":"单选题","stem":"两单地址不一致时，正确做法是？","options":["直接合并","让客户提供正确的详细地址和真实号码，修改一致后再备注合并","用虚拟号码合并","随便填一个地址"],"answer":1,"explain":"地址不一致时，让客户提供正确的详细地址和真实号码（⚠️虚拟号码改不了），修改一致后再备注合并。","points":4,"no":6},{"type":"single","section":"单选题","stem":"合并发货时，如果其中一单要改花色或度数，备注必须？","options":["加上花色名字","只写“改一下”","只写订单号","不用写"],"answer":0,"explain":"备注时必须加上花色名字，防止改单的人不知道是哪个花色需要修改。","points":4,"no":7},{"type":"single","section":"单选题","stem":"缺货预定花色，标准处理流程第一步是？","options":["引导客户先拍下其他有货的花色选项作为“占位”","让客户等补货","直接退款","让客户换店买"],"answer":0,"explain":"客户想拍缺货的花色时：引导客户先拍下其他有货的花色选项作为“占位”，明确告知实际花色缺货及预计到货时间，到货后单独发出。","points":4,"no":8},{"type":"single","section":"单选题","stem":"预定缺货订单如何满足平台发货时效？","options":["先发一个赠品让订单显示发货，美瞳到货后单独发出","不发货","等货齐再发","提前点发货"],"answer":0,"explain":"订单显示发货时先发赠品，让订单满足平台发货时效；美瞳到货后单独打包发出，客户不用操作其他。","points":4,"no":9},{"type":"single","section":"单选题","stem":"缺货预定订单的备注格式是？","options":["预定+花色+度数，先发赠品","只写“缺货”","写“回头发”","不备注"],"answer":0,"explain":"订单备注：[预定+花色+度数，先发赠品]。","points":4,"no":10},{"type":"single","section":"单选题","stem":"预定缺货订单，售前阶段务必做的一个关键动作是？","options":["下单完成后顺口告诉客户会先发出赠品","不告诉客户","等客户收到再解释","让客户自己查物流"],"answer":0,"explain":"客户下单完成之后顺口告诉客户会先发出赠品，不能等客户收到货才发现先发的是赠品（此步骤不能漏，售前阶段务必告知客户）。","points":4,"no":11},{"type":"single","section":"单选题","stem":"订单备注四条铁律的第一条是？","options":["先查库存再答应","先核对再备注","备注后截图确认","格式按规范"],"answer":0,"explain":"四条铁律：①先查库存再答应：缺货的度数绝不备注，缺货花色不答应更换；②先核对再备注；③备注后截图确认；④格式按规范。","points":4,"no":12},{"type":"single","section":"单选题","stem":"备注完成后，客服必须怎么做？","options":["截图发给客户，复述“花色+度数+数量+活动”，客户确认无误才算完成","直接关闭对话","自己看一眼就行","等仓库确认"],"answer":0,"explain":"备注后截图确认：备注完成截图发给客户，复述“花色+度数+数量+活动”，客户确认无误才算完成。","points":4,"no":13},{"type":"single","section":"单选题","stem":"关于“拍一答应备注三”，正确的是？","options":["禁止，拍一只能备注一、拍三才备注三","可以，客户要求就备注","拍一可以备注三","看库存情况"],"answer":0,"explain":"格式按规范：合并发货两单都备注；拍一只能备注一、拍三才备注三，禁止“拍一答应备注三”。","points":4,"no":14},{"type":"single","section":"单选题","stem":"订单备注中的花色名，应该怎么写？","options":["必须写全称，不能写缩写","可以写缩写","写简称就行","写编号就行"],"answer":0,"explain":"必须写全称，不能写缩写（比如“无人区玫瑰”要写完整花名）。","points":4,"no":15},{"type":"single","section":"单选题","stem":"客户咨询的缺货花色已停产不补，留言口径是？","options":["先发有货的，并留言告知客户联系更换度数或花色","只说没有了让客户干等","不回复","直接退款"],"answer":0,"explain":"已停产不补：先发有货的；不补货的必须留言告知客户联系更换度数/花色，确认后再安排。","points":4,"no":16},{"type":"single","section":"单选题","stem":"补差价活动订单的备注开头格式是？","options":["两单一起实发+花色名+度数","合并发货","预定+花色","加送XXX"],"answer":0,"explain":"补差价活动备注格式：开头“两单一起实发+花色名+度数”，赠品“加送XXX”，活动“补差价参与XX活动”，结尾[店铺名:客服名 月/日 时:分]。","points":4,"no":17},{"type":"single","section":"单选题","stem":"答应的赠品，备注要求是？","options":["必须写进备注","口头答应就行","不用备注","看客户要不要"],"answer":0,"explain":"所有承诺客户的内容（赠品、活动、延迟发货）必须写进备注；一单不发赠品的也要单独备注。","points":4,"no":18},{"type":"single","section":"单选题","stem":"客户整单缺货且后续会补货，应建议客户？","options":["换接近度数或其他花色，或按预定流程处理","只能退款","让客户等不回复","随便发一个"],"answer":0,"explain":"整单缺货（后续会补）：留言告知预计到货时间，建议客户换接近度数/其他花色，或走预定流程。","points":4,"no":19},{"type":"judge","section":"判断题","stem":"订单备注是仓库发货的唯一依据。","options":["正确","错误"],"answer":0,"explain":"正确。订单备注是仓库发货的唯一依据，所有承诺客户的内容必须写进备注。","points":4,"no":20},{"type":"judge","section":"判断题","stem":"合并发货时漏备注一单没关系，仓库会自己处理。","options":["正确","错误"],"answer":1,"explain":"错误。漏备注会当做无备注批量审核，两单都必须备注。","points":4,"no":21},{"type":"judge","section":"判断题","stem":"两单收货地址不一致时，可以直接合并发货。","options":["正确","错误"],"answer":1,"explain":"错误。地址不一致无法合并，需要让客户提供正确详细地址和真实号码，修改一致后再备注合并。","points":4,"no":22},{"type":"judge","section":"判断题","stem":"缺货的度数可以备注，先答应客户再说。","options":["正确","错误"],"answer":1,"explain":"错误。先查库存再答应：缺货的度数绝不备注，缺货花色不答应更换。","points":4,"no":23},{"type":"judge","section":"判断题","stem":"预定缺货的花色，先发赠品满足平台时效，美瞳到货后单独补发。","options":["正确","错误"],"answer":0,"explain":"正确。先发赠品让订单满足平台发货时效，美瞳到货后单独打包发出，客户不用操作其他。","points":4,"no":24},{"type":"judge","section":"判断题","stem":"备注可以用花色缩写，比如把“无人区玫瑰”写成简称。","options":["正确","错误"],"answer":1,"explain":"错误。必须写全称，不能写缩写（比如“无人区玫瑰”要写完整花名）。","points":4,"no":25}]},{"meta":{"key":"exam-五","title":"试卷五 · 销售意识 · 简答题","subtitle":"客服考试 · 试卷五 · 销售意识 · 简答题","intro":"说明：简答题10题，每题10分，交卷后对照参考答案由主管评分。可在本表直接编辑题目/选项/答案/解析，修改后重新导入即可。","counts":10,"total":100,"dataNote":"题目同步自飞书《客服考试》试卷表，改表格后重新导入即可更新","timeLimit":"满分 100 分（合格率 80%）"},"questions":[{"type":"text","section":"简答题","stem":"客户进线询单，从开口到成交，售前需要做哪些动作引导客户购买？请至少写出三步。","answer":"评分要点：①秒回＋先问需求（平时戴得多吗/喜欢自然还是显色/度数多少），不先发链接；②按需求精准推荐2-3款具体花色，配实拍上眼图，讲清颜色特点、直径、上眼效果、适用场景；③给优惠算到手价、给售后保障（试戴1片不合适可换可退）；④主动促单（要不要我帮您下单，帮您备注优先发货），发链接后继续跟进不放手。答出“问需求→推荐具体款→促单/给保障”主线，至少三步。","points":10,"no":1},{"type":"text","section":"简答题","stem":"客户咨询的花色缺货，客服第一步先确认什么？确认后按不同情况分别怎么做？","answer":"评分要点：第一步先确认具体花色＋度数＋数量（确认SKU，可能别的度数还有货）。分情况：①有货→告知可拍、引导下单；②确实缺货但会补→如实告知预计到货时间，引导先拍有货花色占位预定，备注[预定+花色+度数，先发赠品]，到货后单独发出，并顺口告知会先发赠品；③停产不补→留言告知，推荐同风格替代款或上下25度接近度数，客户确认后安排，不让客户干等。","points":10,"no":2},{"type":"text","section":"简答题","stem":"给客户推荐花色时，有哪些核心要点？请至少写出三点。","answer":"评分要点：①先挖需求（风格：日常/出街/拍照，眼睛大小，是否戴过，预算），再推荐不硬推；②推荐2-3款给选择，每款讲透颜色特点＋着色直径＋上眼效果＋适用场景；③发实拍上眼图（不发白底图），问喜好收反馈；④结合库存推现货，缺货不硬推、给替代款。至少写出三点。","points":10,"no":3},{"type":"text","section":"简答题","stem":"客户拍下未付款或犹豫时，催单话术可以从哪些方面入手？请至少写出四个方面，并各配一句示例。","answer":"评分要点：①售后保障兜底：“收到支持拆封试戴1片，不合适可换一次或退全款，放心拍~”②赠品/利益：“现在下单加送2片眼罩，我帮您备注~”③情感共情：“遇到喜欢的东西就买下来，钱是换一种方式陪在您身边~”④紧迫感/稀缺：“这款是热卖爆款库存不多啦，今天我帮您保留，抓紧下单先发货~”⑤发货时效：“现在拍下午5点前发出~”答出四个方面＋示例。","points":10,"no":4},{"type":"text","section":"简答题","stem":"客户问“多久能到/几天能到”，售前应该怎么做？请写出标准做法。","answer":"评分要点：①先问收货城市/省份，给精准预估，禁止只丢通用时效（浙江发出，江浙沪皖1-2天、其他地区3天左右、偏远5天左右）；②告知下单截止时间（下午5点前当天发出），顺势确认意向：“您是在看这款吗？下单帮您备注优先发货~”③着急的给加急方案：补运费发顺丰（按地区普快/特快价格）。","points":10,"no":5},{"type":"text","section":"简答题","stem":"客户看中的花色是半年抛，但她想要日抛，而这个花色没有日抛款，应该怎么回复？","answer":"评分要点：①先接住需求（想要日抛的方便卫生，先肯定）；②如实说明该花色目前只有半年抛、没有日抛款，不硬骗；③按需求推荐日抛系列里的同款/相似款（颜色一样、直径略有区别但佩戴效果接近），发图推荐；④或讲半年抛优势：开封可用6个月性价比高、买1发2盒。核心：如实说明＋按需求给替代，拉回下单。","points":10,"no":6},{"type":"text","section":"简答题","stem":"客户咨询的链接里没有护理液和伴侣盒（特价/裸片链接），怎么做才能避免客户流失？","answer":"评分要点：①先解释：这是特价链接所以没配赠品，不是发错；②给替代方案：补个小差价（护理液/伴侣盒补3元）随单多发，比单独买划算（护理液日常零售10元/瓶）；③或引导拍含赠品的链接（半年抛拍1件到手2片+护理液+美瞳盒+便利贴），帮她凑齐一套好上手。核心：解释清楚＋给配套方案，不让客户觉得麻烦流失。","points":10,"no":7},{"type":"text","section":"简答题","stem":"客户咨询完没有下单（说“我再看看”或没回话），售前应该怎么做？怎么收尾？","answer":"评分要点：①说“再看看”→立刻标星，过2分钟主动跟进一次，问担心点（花色还是舒适度），给实拍图对比；②没回话→马上标星，后2-3分钟跟第一次、10分钟跟第二次、下班前跟第三次，超3次没回复标记“观望中”先放一放；③收尾话术：“您先慢慢看，今天下单我帮您备注优先发货+加赠小礼品，想好了随时找我~”留钩子和台阶。","points":10,"no":8},{"type":"text","section":"简答题","stem":"客户下单三副，要求送三瓶护理液，应该怎么处理？","answer":"评分要点：①按赠品规则：护理液一单只送1瓶、不叠加（买三副送三个伴侣盒＋一瓶护理液），先告知规则不硬承诺；②客户确实要多瓶→按规则补差价（补3元/瓶随单多发，日常零售10元/瓶），并备注清楚；③超规要求→如实说明规则，可争取小赠品或优惠补偿，避免口头承诺引发售后纠纷。","points":10,"no":9},{"type":"text","section":"简答题","stem":"客户看中的花色是14.5大直径，但担心自己眼睛小戴不进去，应该怎么回复？","answer":"评分要点：①先安抚：大直径不是“戴不进去”，是戴上后放大效果更明显、显有神；②给参数支撑：咱们基弧8.6mm通用弹性基弧，贴合亚洲人眼型，正常佩戴没问题；眼小可选14.2中小直径款过渡，效果一样自然；③给售后保障：“收到支持拆封试戴1片，不合适可换一次或退全款，放心尝试~”","points":10,"no":10}]}];

      (Array.isArray(arr) ? arr : []).forEach(r => doneKeys.add(r.quiz_key));

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LETTER = i => String.fromCharCode(65 + i);
// 该题的正确答案文字（提交时随明细存库，成绩页直接显示，不再靠题号回查题库）
function ansTextOf(q){
  try {
    if (q.type === 'single' || q.type === 'judge')
      return (q.type === 'judge' ? '' : LETTER(q.answer) + '. ') + (q.options[q.answer] || '');
    if (q.type === 'multi')
      return q.answer.slice().sort((a, b) => a - b).map(i => LETTER(i) + '. ' + q.options[i]).join('\u3000');
    if (q.type === 'match')
      return (q.pairs || []).map(p => p.left + '\u2192' + LETTER(q.rightOptions.indexOf(p.right))).join('\u3000');
    if (q.type === 'text') return q.answer || '';
  } catch (e) { return ''; }
  return '';
}

}

    return;
  }
  if (window.__qRes && window.__qRes.length && !confirm('切换试卷会清空当前作答，确定吗？')) return;
  curPaper = i;
  submitted = false;
  window.__qRes = [];
  $('scoreBox').classList.remove('show');
  $('submitNote').className = 'submit-note';
  $('btnSubmit').disabled = false;
  $('btnSubmit').textContent = '✅ 交卷判分';
  renderTabs(); renderMeta(); buildPaper();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* 按 section 分组渲染 */
function buildPaper(){
if (curPaper > unlockMax) {
  $('paper').innerHTML = '<div class="sec" style="text-align:center;padding:60px 20px;">'
    + '<div style="font-size:44px;margin-bottom:10px;">🔒</div>'
    + '<h2 style="border:none;padding-left:0;">「' + esc(QUIZ.meta.title) + '」暂未解锁</h2>'
    + '<p style="color:var(--muted);margin-top:8px;">先把「' + esc(PAPERS[curPaper - 1].meta.title) + '」做完并交卷，交卷成功后这份试卷自动解锁。</p></div>';
  return;
}
let html = '';
/* 按题目原有顺序渲染；只有 section 变了才另起标题。
   这样「简答 1-8 → 选择 9-10 → 简答 11-20」的卷子题号不会被打乱。 */
const secSeen = {};
function secHint(sec) {
  const first = QUIZ.questions.find(q => q.section === sec) || { points: 0 };
  const pts = first.points;
  if (sec.indexOf('单选') >= 0) return '每题只有一个正确答案，' + pts + ' 分/题';
  if (sec.indexOf('多选') >= 0) return '每题有 2 个及以上正确答案，' + pts + ' 分/题，漏选少选不得分';
  if (sec.indexOf('判断') >= 0) return '判断正误，' + pts + ' 分/题';
  if (sec.indexOf('配对') >= 0) return '把左侧花色与右侧正确的价格档配对，' + pts + ' 分';
  if (sec.indexOf('简答') >= 0) return MANUAL_GRADE()
    ? '主观题，' + pts + ' 分/题：交卷后由主管人工评分，交卷即可'
    : '主观题，' + pts + ' 分/题：交卷后先对照参考答案自评，主管复核';
  return '写出你的做法，' + pts + ' 分，按参考解析自评';
}
let openSec = false, curSec = null;
QUIZ.questions.forEach(q => {
  if (q.section !== curSec) {
    if (openSec) html += '</div>';
    curSec = q.section;
    secSeen[curSec] = (secSeen[curSec] || 0) + 1;
    const nm = secSeen[curSec] > 1 ? curSec + '（续）' : curSec;
    html += '<div class="sec"><h2>' + esc(nm) + '</h2><div class="hint">' + secHint(curSec) + '</div>';
    openSec = true;
  }
    html += '<div class="q" id="q' + q.no + '"><div class="q-head"><span class="q-no">' + q.no + '.</span>' +
      '<span>' + esc(q.stem) + '</span><span class="q-pts">(' + q.points + '分)</span></div>';
    if (q.type === 'single' || q.type === 'judge') {
      html += '<div class="opts">' + q.options.map((o, i) =>
        '<label class="opt" data-no="' + q.no + '" data-i="' + i + '"><input type="radio" name="q' + q.no + '" value="' + i + '">' +
        '<span>' + (q.type === 'judge' ? '' : LETTER(i) + '. ') + esc(o) + '</span></label>').join('') + '</div>';
    } else if (q.type === 'multi') {
      html += '<div class="opts">' + q.options.map((o, i) =>
        '<label class="opt" data-no="' + q.no + '" data-i="' + i + '"><input type="checkbox" name="q' + q.no + '" value="' + i + '">' +
        '<span>' + LETTER(i) + '. ' + esc(o) + '</span></label>').join('') + '</div>';
    } else if (q.type === 'match') {
      html += '<div style="font-size:13px;color:var(--muted);margin:6px 0 2px 22px;">右侧选项：' +
        q.rightOptions.map((o, i) => LETTER(i) + '. ' + esc(o)).join('　') + '</div>';
      html += q.pairs.map((p, i) => '<div class="match-row"><span class="left">' + esc(p.left) + '</span><span>→</span>' +
        '<select data-no="' + q.no + '" data-i="' + i + '"><option value="">请选择字母</option>' +
        q.rightOptions.map((o, j) => '<option value="' + LETTER(j) + '">' + LETTER(j) + '. ' + esc(o) + '</option>').join('') +
        '</select></div>').join('');
    } else if (q.type === 'text') {
      html += '<textarea class="ta" data-no="' + q.no + '" rows="' + (q.points >= 8 ? 5 : 3) + '" placeholder="在这里作答…"></textarea>' +
        '<div style="font-size:12.5px;color:var(--muted);margin:4px 0 0 22px;">' +
        (MANUAL_GRADE()
          ? '简答题由主管人工评分（本题 ' + q.points + ' 分），交卷即可，无需自评。'
          : '交卷后显示参考答案，需自评打分（' + q.points + ' 分）') + '</div>';
    }
    html += '<div class="res" id="res' + q.no + '"></div></div>';
});
if (openSec) html += '</div>';
$('paper').innerHTML = html;
  bindOpts();
}

/* 选中态视觉（切卷重绘后要重新绑定） */
function bindOpts() {
  document.querySelectorAll('.opt input').forEach(inp => {
    inp.addEventListener('change', () => {
      document.querySelectorAll('.opt input[name="' + inp.name + '"]').forEach(x =>
        x.closest('.opt').classList.toggle('sel', x.checked));
    });
  });
}

/* 判分 */
function grade() {
  window.__qRes = [];
  QUIZ.questions.forEach(q => {
    const el = $('res' + q.no);
    let got = 0, full = q.points, detail = '', myAns = '';
    if (q.type === 'single' || q.type === 'judge') {
      const sel = document.querySelector('input[name="q' + q.no + '"]:checked');
      const chosen = sel ? +sel.value : -1;
      got = (chosen === q.answer) ? full : 0;
      myAns = chosen >= 0 ? (q.type === 'judge' ? q.options[chosen] : LETTER(chosen) + '. ' + q.options[chosen]) : '未作答';
      if (chosen >= 0) document.querySelectorAll('.opt[data-no="' + q.no + '"]')[chosen].classList.add(chosen === q.answer ? 'judge-ok' : 'judge-no');
      if (chosen !== q.answer) document.querySelectorAll('.opt[data-no="' + q.no + '"]')[q.answer].classList.add('judge-ok');
      detail = '正确答案：' + (q.type === 'judge' ? q.options[q.answer] : LETTER(q.answer) + '. ' + esc(q.options[q.answer]));
    } else if (q.type === 'multi') {
      const sels = [...document.querySelectorAll('input[name="q' + q.no + '"]:checked')].map(x => +x.value).sort();
      const ans = q.answer.slice().sort();
      const right = sels.length === ans.length && sels.every((v, i) => v === ans[i]);
      got = right ? full : 0;
      myAns = sels.length ? sels.map(i => LETTER(i) + '. ' + q.options[i]).join('　') : '未作答';
      ans.forEach(i => document.querySelectorAll('.opt[data-no="' + q.no + '"]')[i].classList.add('judge-ok'));
      sels.filter(i => ans.indexOf(i) < 0).forEach(i => document.querySelectorAll('.opt[data-no="' + q.no + '"]')[i].classList.add('judge-no'));
      detail = '正确答案：' + ans.map(i => LETTER(i) + '. ' + esc(q.options[i])).join('　');
    } else if (q.type === 'match') {
      const sels = [...document.querySelectorAll('select[data-no="' + q.no + '"]')].map(s => s.value);
      const rightCount = q.pairs.filter((p, i) => {
        const li = q.rightOptions.indexOf(p.right);
        return sels[i] === LETTER(li);
      }).length;
      got = Math.round(full * rightCount / q.pairs.length);
      myAns = q.pairs.map((p, i) => p.left + '→' + (sels[i] || '未选')).join('　');
      detail = '正确答案：' + q.pairs.map(p => esc(p.left) + '→' + LETTER(q.rightOptions.indexOf(p.right))).join('　') +
        '（右侧：' + q.rightOptions.map((o, i) => LETTER(i) + '.' + esc(o)).join('　') + '）';
    } else if (q.type === 'text') {
      const ta = document.querySelector('textarea[data-no="' + q.no + '"]');
      myAns = (ta && ta.value.trim()) ? ta.value.trim().slice(0, 500) : '未作答';
      if (MANUAL_GRADE()) {
        el.innerHTML = '<span class="tag">⏳ 待主管人工评分</span>' +
          '<div class="exp">评分要点：' + esc(q.answer).replace(/\n/g, '<br>') + '</div>';
        el.className = 'res show';
        window.__qRes.push({ no: q.no, section: q.section, ans: myAns, got: 0, full: full, kind: 'review' });
        return;
      }
      // 重新交卷时要保住考生已选的自评分，否则自评会被重置为 0
      const prevSel = document.querySelector('select.self[data-no="' + q.no + '"]');
      const prevVal = prevSel ? prevSel.value : '0';
      el.innerHTML = '<span class="tag">📖 参考答案</span><div class="exp">' + esc(q.answer).replace(/\n/g, '<br>') + '</div>' +
        '<div class="selfscore">自评得分：<select data-no="' + q.no + '" class="self">' +
        Array.from({ length: full + 1 }, (_, i) => '<option value="' + i + '">' + i + '</option>').join('') +
        '</select> / ' + full + ' 分</div>';
      el.className = 'res show';
      window.__qRes.push({ no: q.no, section: q.section, ans: myAns, got: +prevVal, full: full, kind: 'self' });
      const newSel = el.querySelector('.self');
      newSel.value = prevVal;
      newSel.addEventListener('change', updateScore);
      return;   // 文本题分数由自评决定
    }
    window.__qRes.push({ no: q.no, section: q.section, ans: myAns, got: got, full: full, kind: 'auto' });
    el.className = 'res show ' + (got === full ? 'ok' : 'bad');
    el.innerHTML = '<span class="tag">' + (got === full ? '✔ 正确 +' + got : '✘ 错误 +' + got + '/' + full) + '</span>' +
      '<div class="exp">' + detail + '<br>' + esc(q.explain || '') + '</div>';
  });
  updateScore();
}

/* 汇总：客观题按判分结果，主观题按自评下拉实时重算 */
function updateScore() {
  const rows = window.__qRes || [];
  rows.forEach(r => {
    if (r.kind === 'self') {
      const s = document.querySelector('select.self[data-no="' + r.no + '"]');
      r.got = s ? +s.value : 0;
    }
  });
  const got = rows.reduce((n, r) => n + r.got, 0);
  const auto = rows.filter(r => r.kind === 'auto');
  const autoGot = auto.reduce((n, r) => n + r.got, 0);
  const autoFull = auto.reduce((n, r) => n + r.full, 0);
  const selfRows = rows.filter(r => r.kind === 'self');
  const selfGot = selfRows.reduce((n, r) => n + r.got, 0);
  const selfFull = selfRows.reduce((n, r) => n + r.full, 0);
  const reviewRows = rows.filter(r => r.kind === 'review');
  const reviewFull = reviewRows.reduce((n, r) => n + r.full, 0);
  const total = QUIZ.meta.total;
  const per = {};
  rows.forEach(r => { if (r.kind === 'review') return; per[r.section] = per[r.section] || { got: 0, full: 0 }; per[r.section].got += r.got; per[r.section].full += r.full; });
  const hasReview = reviewRows.length > 0;
  const pass = got >= Math.ceil(total * 0.8);
  const box = $('scoreBox');
  box.innerHTML = '<div class="big">' + got + (hasReview ? ' <span style="font-size:15px;color:var(--muted);">+ 待评</span>' : ' / ' + total) + '</div>' +
    '<div class="sub">' + (hasReview
      ? '⏳ 简答题 ' + reviewRows.length + ' 题（' + reviewFull + ' 分）由主管人工评分，下方为已判得分'
      : (pass ? '✅ 合格（80 分以上）' : '⚠️ 未达 80 分，建议复习易错点后重做')) +
    '　·　客观题 ' + autoGot + ' / ' + autoFull + (selfFull ? '　·　主观题自评 ' + selfGot + ' / ' + selfFull : '') + '</div>' +
    '<div class="detail">' + Object.entries(per).map(([k, v]) =>
      '<div class="cell"><b>' + v.got + '/' + v.full + '</b>' + esc(k) + '</div>').join('') + '</div>';
  box.classList.add('show');
  $('footTip').textContent = '得分 ' + got + (hasReview ? ' + 待评' : ' / ' + total);
}

/* ==================== 收卷：交卷后把成绩上报给主管 ==================== */
function setNote(html, isErr) {
  const n = $('submitNote');
  n.innerHTML = html;
  n.className = 'submit-note show' + (isErr ? ' err' : '');
  if (isErr) n.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function reportResult(name) {
  const btn = $('btnSubmit');
  const rows = window.__qRes || [];
  const autoRows = rows.filter(r => r.kind === 'auto');
  const selfRows = rows.filter(r => r.kind === 'self');
  const reviewRows = rows.filter(r => r.kind === 'review');
  const reviewFull = reviewRows.reduce((n, r) => n + r.full, 0);
  const sum = a => a.reduce((n, r) => n + r.got, 0);
  const payload = {
    quiz_key: QUIZ_KEY(),
    quiz_title: QUIZ.meta.title,
    examinee: name,
    score: sum(rows),
    total: QUIZ.meta.total,
    auto_score: sum(autoRows),
    auto_total: autoRows.reduce((n, r) => n + r.full, 0),
    self_score: sum(selfRows) + sum(reviewRows),
    self_total: selfRows.reduce((n, r) => n + r.full, 0) + reviewFull,
    duration_sec: Math.round((Date.now() - START_TS) / 1000),
    detail: rows.map(r => { const q = QUIZ.questions.find(q => q.no === r.no) || {}; return {
      no: r.no, sec: r.section,
      stem: q.stem || '',
      explain: q.explain || '',
      correct: ansTextOf(q),
      ans: r.ans || '', got: r.got, full: r.full, kind: r.kind }; }),
    user_agent: (navigator.userAgent || '').slice(0, 200)
  };
  btn.disabled = true; btn.textContent = '📤 正在提交…';
  try {
    const res = await fetch(SUPA_URL + '/rest/v1/quiz_results', {
      method: 'POST',
      headers: {
        'apikey': SUPA_KEY,
        'Authorization': 'Bearer ' + SUPA_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + (await res.text()).slice(0, 160));
    submitted = true;
    // 交卷成功 → 记录这份卷已考，解锁下一份
    doneKeys.add(QUIZ_KEY());
    const hadLock = unlockMax;
    calcUnlock();
    renderTabs();
    const unlockedNext = unlockMax > hadLock;
    const hasReview = reviewRows.length > 0;
    const hasSelf = (payload.self_total || 0) > 0 && !hasReview;
    const selfDone = (payload.self_score || 0) > 0;
    const needSelf = hasSelf && !selfDone;
    btn.disabled = false;
    btn.textContent = needSelf ? '📤 提交自评后的成绩' : '🔄 重新交卷';
    setNote('✅ <b>已提交</b>：' + name +
      (hasReview
        ? ' 的答卷已交给主管。简答题 ' + reviewRows.length + ' 题（' + reviewFull + ' 分）由主管人工评分，<b>无需自评</b>；出分前已判部分 <b>' + payload.score + '</b> 分。'
        : ' 的成绩 <b>' + payload.score + ' / ' + payload.total + '</b> 已交给主管。') +
      (needSelf
        ? '<br><span style="color:#9b2c2c;font-weight:700;">⚠️ 主观题（纠错 / 简答）还没自评，现在这部分按 0 分算。</span>' +
          '<br><span style="opacity:.8;font-size:12.5px;">请往下翻到主观题，在「自评得分」下拉里给自己打分，再点下面的按钮提交一次，成绩才是完整的。</span>'
        : '<br><span style="opacity:.75;font-size:12.5px;">可以关掉这个页面了；改了答案再交一次也可以，主管按最新一次为准。</span>') +
      (unlockedNext && curPaper < PAPERS.length - 1
        ? '<br><span style="color:var(--primary-dark);font-weight:700;">🎉 已解锁下一份：「' + esc(PAPERS[curPaper + 1].meta.title) + '」，点上面的试卷标签就能开始做。</span>'
        : ''));
  } catch (e) {
    console.error('收卷上报失败', e);
    btn.disabled = false; btn.textContent = '✅ 交卷判分';
    setNote('⚠️ <b>成绩提交失败</b>：' + esc(e.message) +
      '<br>请把本页分数截图发给主管；网络正常后点「✅ 交卷判分」可重试。', true);
  }
}

$('btnSubmit').addEventListener('click', async () => {
  const name = ($('examinee').value || '').trim();
  if (!name) {
    alert('请先在最上方填写「考生姓名」——交卷后主管要按姓名查你的成绩。');
    $('examinee').focus();
    return;
  }
  try { localStorage.setItem('kefu_quiz_examinee', name); } catch (e) {}
  const un = QUIZ.questions.filter(q => {
    if (q.type === 'single' || q.type === 'judge') return !document.querySelector('input[name="q' + q.no + '"]:checked');
    if (q.type === 'multi') return document.querySelectorAll('input[name="q' + q.no + '"]:checked').length === 0;
    if (q.type === 'match') return [...document.querySelectorAll('select[data-no="' + q.no + '"]')].some(s => !s.value);
    return false;
  });
  if (un.length) {
    if (!confirm('还有 ' + un.length + ' 题没作答（第 ' + un.map(q => q.no).join('、') + ' 题），确定交卷？')) return;
  }
  grade();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  await reportResult(name);
});
$('btnReset').addEventListener('click', () => location.reload());
renderTabs(); renderMeta(); buildPaper();

/* 管理员不锁卷：主工作台与本页同域，登录态存在 localStorage，读 role=admin 即解锁全部试卷 */
(async function detectExamAdmin() {
  try {
    const raw = localStorage.getItem('sb-icfgireprowcqwdodfqx-auth-token');
    if (!raw) return;
    const ses = JSON.parse(raw);
    const at = ses && ses.access_token;
    const uid = ses && ses.user && ses.user.id;
    if (!at || !uid) return;
    const res = await fetch(SUPA_URL + '/rest/v1/profiles?select=role&id=eq.' + uid, {
      headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + at }
    });
    const arr = await res.json();
    if (Array.isArray(arr) && arr[0] && arr[0].role === 'admin') {
      isExamAdmin = true;
      calcUnlock();
      renderTabs();
      console.log('管理员身份：全部试卷已解锁');
    }
  } catch (e) { console.warn('管理员检测跳过', e); }
})();
/* 姓名填入后查她考过哪几份卷，恢复解锁进度 */
$('examinee').addEventListener('change', refreshUnlock);
try {
  const savedName = localStorage.getItem('kefu_quiz_examinee');
  if (savedName) { $('examinee').value = savedName; refreshUnlock(); }
} catch (e) {}
