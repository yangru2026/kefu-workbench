function basename(path) {
  if (!path) return null;
  const parts = path.split('/');
  return parts[parts.length - 1];
}

function findSimilar(filename, fileSet) {
  const nameNoExt = filename.replace(/\.(jpg|jpeg|png|webp)$/i, '');
  if (fileSet.has(filename)) return filename;
  for (const f of fileSet) {
    const fNoExt = f.replace(/\.(jpg|jpeg|png|webp)$/i, '');
    if (fNoExt === nameNoExt) return f;
    if (nameNoExt.includes(fNoExt) || fNoExt.includes(nameNoExt)) return f;
  }
  return null;
}

    eyeMismatch.forEach(r => {
      const fix = eyeFixable[r.id];
      mmHtml += '<tr class="mismatch"><td>' + (r.name||'') + '</td><td>' + (r.brand||'') + '</td><td>eye_img</td><td class="bad">' + (r.eye_img||'') + '</td><td>' + r._eyeBasename + '</td><td class="' + (fix?'good':'bad') + '">' + (fix ? fix.fix : '无法匹配') + '</td></tr>';
    });
    lensMismatch.forEach(r => {
      const fix = lensFixable[r.id];
      mmHtml += '<tr class="mismatch"><td>' + (r.name||'') + '</td><td>' + (r.brand||'') + '</td><td>lens_img</td><td class="bad">' + (r.lens_img||'') + '</td><td>' + r._lensBasename + '</td><td class="' + (fix?'good':'bad') + '">' + (fix ? fix.fix : '无法匹配') + '</td></tr>';
    });
    if (eyeMismatch.length === 0 && lensMismatch.length === 0) {
      mmHtml += '<tr><td colspan="6" style="text-align:center;color:#27ae60;padding:20px;">所有路径都匹配!</td></tr>';
    }
    mmHtml += '</table>';
    document.getElementById('mismatch-table').innerHTML = mmHtml;

    // 生成修复 SQL
    let sql = '-- 花色素材路径修复 SQL\n';
    sql += '-- 生成时间: ' + new Date().toLocaleString('zh-CN') + '\n\n';

    if (chinesePrefix > 0) {
      sql += '-- 1. 修复中文路径前缀 -> 英文\n';
      sql += 'UPDATE pattern_assets\nSET\n';
      sql += '  eye_img = CASE\n';
      sql += '    WHEN eye_img LIKE \'图片/图案/%\' THEN REPLACE(eye_img, \'图片/图案/\', \'images/patterns/\')\n';
      sql += '    WHEN eye_img LIKE \'图片/模式/%\' THEN REPLACE(eye_img, \'图片/模式/\', \'images/patterns/\')\n';
      sql += '    WHEN eye_img LIKE \'图片/%\' THEN REPLACE(eye_img, \'图片/\', \'images/\')\n';
      sql += '    ELSE eye_img\n  END,\n';
      sql += '  lens_img = CASE\n';
      sql += '    WHEN lens_img LIKE \'图片/图案/%\' THEN REPLACE(lens_img, \'图片/图案/\', \'images/patterns/\')\n';
      sql += '    WHEN lens_img LIKE \'图片/模式/%\' THEN REPLACE(lens_img, \'图片/模式/\', \'images/patterns/\')\n';
      sql += '    WHEN lens_img LIKE \'图片/%\' THEN REPLACE(lens_img, \'图片/\', \'images/\')\n';
      sql += '    ELSE lens_img\n  END;\n\n';
    }

    const eyeKeys = Object.keys(eyeFixable);
    const lensKeys = Object.keys(lensFixable);
    if (eyeKeys.length > 0 || lensKeys.length > 0) {
      sql += '-- 2. 修复文件名不匹配的记录\n';
      eyeKeys.forEach(id => {
        sql += 'UPDATE pattern_assets SET eye_img = \'' + eyeFixable[id].fix + '\' WHERE id = ' + id + ';\n';
      });
      lensKeys.forEach(id => {
        sql += 'UPDATE pattern_assets SET lens_img = \'' + lensFixable[id].fix + '\' WHERE id = ' + id + ';\n';
      });
      sql += '\n';
    }

    sql += '-- 3. 重新生成缩略图 URL\n';
    sql += 'UPDATE pattern_assets\nSET\n';
    sql += '  thumb_eye_url = CASE\n';
    sql += '    WHEN eye_img IS NOT NULL AND eye_img != \'\'\n';
    sql += '    THEN REGEXP_REPLACE(\n';
    sql += '      REGEXP_REPLACE(eye_img, \'^images/patterns/\', \'images/patterns/thumb/\'),\n';
    sql += '      \'\\.(jpg|jpeg|png|JPG|JPEG|PNG)$\', \'.webp\'\n';
    sql += '    )\n    ELSE NULL\n  END,\n';
    sql += '  thumb_lens_url = CASE\n';
    sql += '    WHEN lens_img IS NOT NULL AND lens_img != \'\'\n';
    sql += '    THEN REGEXP_REPLACE(\n';
    sql += '      REGEXP_REPLACE(lens_img, \'^images/patterns/\', \'images/patterns/thumb/\'),\n';
    sql += '      \'\\.(jpg|jpeg|png|JPG|JPEG|PNG)$\', \'.webp\'\n';
    sql += '    )\n    ELSE NULL\n  END;\n\n';
    sql += '-- 4. 验证\n';
    sql += 'SELECT name, brand, eye_img, thumb_eye_url FROM pattern_assets LIMIT 10;\n';

    document.getElementById('sql-output').textContent = sql;
    window._fixSQL = sql;

  } catch(e) {
    document.getElementById('status').innerHTML = '<div style="color:#e74c3c;padding:20px;">错误: ' + e.message + '</div>';
  }
}

function copySQL() {
  navigator.clipboard.writeText(window._fixSQL || '').then(() => {
    alert('SQL 已复制! 粘贴到 Supabase SQL Editor 执行即可');
  });
}

main();
</script>
