<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>质检统计</title>
<style>
  :root{ --primary:#10b981; --primary-dark:#059669; --primary-light:rgba(16,185,129,.10);
         --text:#1e293b; --muted:#64748b; --border:#e2e8f0; --bg:#f7f9f8; --card:#fff;
         --t1:#0d9488; --t2:#ea580c; --t3:#dc2626; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;font-size:13.5px;}
  .topbar{display:flex;align-items:center;gap:10px;padding:12px 18px;background:#fff;border-bottom:1px solid var(--border);
          flex-wrap:wrap;position:sticky;top:0;z-index:10;}
  .topbar h1{font-size:17px;font-weight:800;letter-spacing:.4px;}
  .badge{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;background:var(--primary-light);color:var(--primary-dark);}
  .badge.own{background:#eff6ff;color:#2563eb;}
  .sp{flex:1;}
  .range{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);}
  .range select,.range input{border:1.5px solid var(--border);border-radius:8px;padding:6px 9px;font-size:12.5px;
        font-family:inherit;background:#fff;color:var(--text);outline:none;}
  .range select:focus,.range input:focus{border-color:var(--primary);}
  .btn{border:none;border-radius:9px;padding:8px 15px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn.g{background:var(--primary);color:#fff;}
  .btn.o{background:#fff;border:1.5px solid var(--border);color:#334155;}
  .btn:hover{filter:brightness(.95);}

  .wrap{width:100%;max-width:1180px;margin:0 auto;padding:16px 18px 50px;flex:1;}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px;}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;}
  .kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
  .kpi .val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px;}
  .kpi .val small{font-size:12px;font-weight:600;color:var(--muted);margin-left:3px;}
  .kpi.a .val{color:var(--primary-dark);}
  .kpi.b .val{color:#ea580c;}
  .kpi.c .val{color:#2563eb;}
  .kpi.d .val{color:#7c3aed;}

  /* 待定扣罚提示条 */
  .notice{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff7ed;border:1px solid #fed7aa;
          color:#9a3412;border-radius:12px;padding:11px 14px;margin-bottom:14px;font-size:13px;font-weight:600;}
  .notice .sp2{flex:1;}
  .notice button{border:none;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:700;
          background:#ea580c;color:#fff;cursor:pointer;font-family:inherit;}

  /* Tabs */
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .tab{padding:8px 16px;border-radius:999px;border:1.5px solid var(--border);background:#fff;cursor:pointer;
       font-size:13px;font-weight:600;color:var(--muted);font-family:inherit;}
  .tab.on{background:var(--primary);border-color:var(--primary);color:#fff;}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;}
  .panel h3{font-size:14.5px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .panel h3 .hint{font-size:11.5px;font-weight:500;color:var(--muted);}

  /* 排名条 */
  .rank-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9;}
  .rank-row:last-child{border-bottom:none;}
  .rk{width:22px;height:22px;border-radius:7px;background:#f1f5f9;color:var(--muted);font-size:11.5px;font-weight:800;
      display:flex;align-items:center;justify-content:center;flex:0 0 22px;}
  .rk.top1{background:#fef3c7;color:#b45309;} .rk.top2{background:#e5e7eb;color:#4b5563;} .rk.top3{background:#fde8e0;color:#c2410c;}
  .nm{width:96px;font-weight:700;flex:0 0 96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-wrap{flex:1;height:9px;background:#f1f5f9;border-radius:6px;overflow:hidden;}
  .bar{height:100%;border-radius:6px;background:linear-gradient(90deg,#34d399,#10b981);}
  .num{width:88px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;flex:0 0 88px;}
  .num small{font-weight:600;color:var(--muted);font-size:11px;margin-left:2px;}
  .money{width:76px;text-align:right;color:#ea580c;font-weight:800;flex:0 0 76px;font-variant-numeric:tabular-nums;}

  /* 趋势柱 */
  .trend{display:flex;align-items:flex-end;gap:6px;height:190px;padding:8px 2px 0;overflow-x:auto;}
  .tcol{flex:1;min-width:16px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;}
  .tbar{width:100%;max-width:34px;border-radius:5px 5px 0 0;background:linear-gradient(180deg,#6ee7b7,#10b981);min-height:2px;}
  .tlab{font-size:10px;color:var(--muted);white-space:nowrap;transform:rotate(-38deg);transform-origin:center;height:22px;}
  .tval{font-size:10px;color:var(--muted);font-weight:700;}

  /* 类型分布 */
  .type-row{display:flex;align-items:center;gap:10px;padding:7px 0;}
  .type-row .tn{width:110px;flex:0 0 110px;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .type-row .bar-wrap{flex:1;}
  .type-row .bar{background:linear-gradient(90deg,#fbbf24,#f59e0b);}
  .type-row .pct{width:56px;text-align:right;font-weight:800;color:#b45309;flex:0 0 56px;}

  /* 明细表 */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
  .filters input,.filters select{border:1.5px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12.5px;
       font-family:inherit;background:#fff;color:var(--text);outline:none;}
  .filters input:focus,.filters select:focus{border-color:var(--primary);}
  .tb-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;}
  table.tb{width:100%;border-collapse:collapse;font-size:12.8px;min-width:860px;}
  table.tb thead th{background:#f8fafc;color:var(--muted);font-weight:700;font-size:11.5px;padding:9px 10px;
       text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
  table.tb td{padding:9px 10px;border-bottom:1px solid #f1f5f9;vertical-align:top;}
  table.tb tr:last-child td{border-bottom:none;}
  table.tb tbody tr:hover td{background:#fafcff;}
  table.tb td.det{max-width:320px;line-height:1.55;color:#475569;}
  .sev{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;white-space:nowrap;}
  .sev.s1{background:#ecfdf5;color:#0d9488;} .sev.s2{background:#fff7ed;color:#ea580c;} .sev.s3{background:#fef2f2;color:#dc2626;}
  .amt{font-weight:800;color:#ea580c;font-variant-numeric:tabular-nums;}
  /* 证据：只挂外链，图片不进工作台存储 */
  a.ev{display:inline-block;font-size:11px;font-weight:800;color:#0369a1;background:#f0f9ff;
       border:1px solid #bae6fd;border-radius:6px;padding:2px 6px;text-decoration:none;white-space:nowrap;}
  a.ev:hover{background:#e0f2fe;border-color:#7dd3fc;}
  .mine-tip{font-size:12px;color:#0369a1;background:#f0f9ff;border:1px solid #bae6fd;
            border-radius:8px;padding:8px 11px;margin-bottom:10px;}
  /* 正确做法：质检的教学重点，客服视角要醒目 */
  .gd{margin-top:7px;background:#ecfdf5;border:1px solid #a7f3d0;border-left:3px solid #10b981;
      border-radius:8px;padding:7px 10px;font-size:12.5px;line-height:1.65;color:#065f46;}
  .gd span{display:inline-block;font-size:10.5px;font-weight:800;color:#047857;background:#d1fae5;
           border-radius:5px;padding:1px 7px;margin-right:7px;vertical-align:1px;}
  .gd.adm{display:block;background:#f0fdf4;border-color:#bbf7d0;}
  /* 2026-11-03 方案A：问题点红块前置（和正确做法绿块成对） */
  .iss{margin-bottom:7px;background:#fef2f2;border:1px solid #fecaca;border-left:3px solid #dc2626;
       border-radius:8px;padding:7px 10px;font-size:12.5px;line-height:1.65;color:#7f1d1d;}
  .iss span{display:inline-block;font-size:10.5px;font-weight:800;color:#b91c1c;background:#fee2e2;
            border-radius:5px;padding:1px 7px;margin-right:7px;vertical-align:1px;}
  /* 2026-11-03 方案B：看图留痕小标签（组长/本人都可见） */
  .trail{display:inline-block;font-size:10.5px;font-weight:700;color:#0369a1;background:#f0f9ff;
         border:1px solid #bae6fd;border-radius:6px;padding:1px 7px;margin-left:7px;white-space:nowrap;}
  .trail.warn{color:#b45309;background:#fffbeb;border-color:#fde68a;}
  /* 客服确认 */
  .cfm.done{font-size:11px;font-weight:700;color:#059669;background:#ecfdf5;border:1px solid #a7f3d0;
            border-radius:6px;padding:2px 8px;white-space:nowrap;}
  .cfm-btn{font-size:11.5px;font-weight:800;color:#fff;background:#10b981;border:none;border-radius:6px;
           padding:5px 11px;cursor:pointer;white-space:nowrap;}
  .cfm-btn:hover{background:#059669;}
  .cfm-btn.o{background:#fff;color:#0369a1;border:1px solid #bae6fd;}
  .cfm-btn.o:hover{background:#f0f9ff;}
  .cfm-btn.off{background:#e2e8f0;color:#94a3b8;cursor:not-allowed;}
  .cfm-btn.ghost{background:#fff;color:#64748b;border:1px solid #e2e8f0;}
  .cfm-btn.ghost:hover{background:#f8fafc;}
  .cfm-btn.all{background:#fff;color:#b45309;border:1px solid #fcd34d;margin-left:10px;padding:4px 12px;}
  .cfm-btn.all:hover{background:#fffbeb;}
  /* 待确认提醒（客服视角顶部） */
  .mine-warn{font-size:12.5px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;
             border-radius:8px;padding:9px 12px;margin-bottom:10px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;}
  .empty{color:var(--muted);text-align:center;padding:34px 12px;font-size:13px;}
  .empty b{color:var(--text);}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1e293b;color:#fff;
         padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;}
  .toast.show{opacity:1;}
  /* 数据异常横幅（2026-10-31：不再用模态弹窗挡住整页，改成可无视的提示条） */
  .errbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fef2f2;border:1px solid #fecaca;
          color:#b91c1c;border-radius:12px;padding:11px 14px;margin-bottom:14px;font-size:12.5px;font-weight:600;}
  .errbar .x{margin-left:auto;border:none;background:none;color:#b91c1c;font-size:16px;cursor:pointer;
          font-family:inherit;padding:2px 8px;border-radius:6px;line-height:1;}
  .errbar .x:hover{background:#fee2e2;}
</style>
</head>
<body>
<div class="topbar">
  <h1>🧪 质检统计</h1>
  <span class="badge" id="roleBadge">加载中…</span>
  <button class="btn o" id="btnRegister" style="display:none;">📝 去飞书登记</button>
  <button class="btn o" id="btnSync" style="display:none;" title="把飞书登记表拉进工作台（幂等，重复点没关系）">⟳ 同步飞书</button>
  <div class="sp"></div>
  <div class="range">
    <select id="rangeSel">
      <option value="thisMonth">本月</option>
      <option value="lastMonth">上月</option>
      <option value="last3">近 3 个月</option>
      <option value="all">全部</option>
      <option value="custom">自定义</option>
    </select>
    <input type="date" id="dFrom" style="display:none;">
    <span id="dSep" style="display:none;">~</span>
    <input type="date" id="dTo" style="display:none;">
    <button class="btn o" id="btnRefresh">🔄 刷新</button>
  </div>
</div>

<div class="wrap">
  <div class="errbar" id="errBar" style="display:none;"></div>
  <div class="kpis" id="kpis"></div>
  <div class="notice" id="pendingBox" style="display:none;"></div>

  <div class="tabs" id="tabs" style="display:none;">
    <button class="tab on" data-tab="rank">按人排名</button>
    <button class="tab" data-tab="trend">时间趋势</button>
    <button class="tab" data-tab="type">问题类型</button>
    <button class="tab" data-tab="detail">明细导出</button>
  </div>

  <div class="panel" id="panel-rank" style="display:none;"></div>
  <div class="panel" id="panel-trend" style="display:none;"></div>
  <div class="panel" id="panel-type" style="display:none;"></div>
  <div class="panel" id="panel-detail" style="display:none;"></div>

  <!-- 客服本人视角：我的质检 -->
  <div class="panel" id="panel-mine" style="display:none;"></div>
</div>

<div class="toast" id="toast"></div>

<!-- 加载占位：HTML/数据没到之前不再是白屏 -->
<div id="boot" style="position:fixed;inset:0;background:#fff;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;">
  <div style="width:34px;height:34px;border:3px solid #d1fae5;border-top-color:#10b981;border-radius:50%;animation:qcbootspin .8s linear infinite;"></div>
  <div style="font-size:13px;font-weight:700;color:#334155;">质检统计加载中…</div>
  <div style="font-size:11.5px;color:#94a3b8;">第一次打开要几秒，之后有缓存就是秒开</div>
</div>
<style>@keyframes qcbootspin{to{transform:rotate(360deg)}}</style>

<script src="vendor/supabase.min.js?v=2"></script>
<script>
const SUPABASE_URL = 'https://icfgireprowcqwdodfqx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_LF-obMSRD7DFsY0AcjYZuQ_53P6UlQ8';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
let me = { id:null, name:'', role:'staff' };
let accessToken = '';       // 打开截图时带给后端函数做身份校验（浏览器直接导航带不了 header）
let isMgr = false;          // admin / leader
let rows = [];              // 当前时间范围内的记录
let tab = 'rank';
let fStaff = '', fType = '', fSev = '', fKw = '';
const expanded = {};    // 客服视角：哪条已展开查看
const readOK = {};      // 展开后多久才允许点确认（防止不点开就确认）
const viewed = {};      // 2026-11-03 方案A：哪条的截图已点开过（有截图的记录必须点开图才解锁确认）

const SEV_CLASS = { '一般提醒':'s1', '严重问题':'s2', '严重需整改':'s3' };
// 质检登记表（飞书）：飞书禁止被 iframe 嵌入，只能新窗口打开
const REGISTER_URL = 'https://yow5cuygtx.feishu.cn/base/GIlpb2g4JaAdC4sjcgPcnBtSnbh?table=tblMHaYX5PoPFigD&view=vew0QlfW6Q';
const fmtMoney = n => (Math.round((Number(n)||0)*100)/100).toFixed(2).replace(/\.00$/,'');
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

/* ---------- 时间范围 ---------- */
function ymd(d){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function rangeOf(key){
  const now = new Date();
  if (key === 'thisMonth') return [ ymd(new Date(now.getFullYear(), now.getMonth(), 1)), ymd(new Date(now.getFullYear(), now.getMonth()+1, 0)) ];
  if (key === 'lastMonth') return [ ymd(new Date(now.getFullYear(), now.getMonth()-1, 1)), ymd(new Date(now.getFullYear(), now.getMonth(), 0)) ];
  if (key === 'last3')      return [ ymd(new Date(now.getFullYear(), now.getMonth()-2, 1)), ymd(new Date(now.getFullYear(), now.getMonth()+1, 0)) ];
  if (key === 'all')        return ['', ''];
  return [ $('dFrom').value || '', $('dTo').value || '' ];
}

/* ---------- 初始化 ---------- */
function qcHideBoot(){ const b = document.getElementById('boot'); if (b) b.remove(); }
function qcTimeout(p, ms, tag){
  return Promise.race([ p, new Promise((_, rej) => setTimeout(() => rej(new Error(tag + ' 超时')), ms)) ]);
}
(async function init(){
  try{
    const { data:{ session } } = await qcTimeout(sb.auth.getSession(), 8000, '登录检查');
    const user = session && session.user;
    if (!user){ $('roleBadge').textContent = '🔒 未登录'; qcHideBoot(); return; }
    me.id = user.id;
    accessToken = session.access_token || '';
    try{
      const { data:p } = await sb.from('profiles').select('role,name').eq('id', user.id).single();
      if (p){ me.role = p.role || 'staff'; me.name = p.name || ''; }
    }catch(e){ console.warn('profiles', e); }
    isMgr = (me.role === 'admin' || me.role === 'leader');
    $('roleBadge').className = 'badge' + (isMgr ? '' : ' own');
    $('roleBadge').textContent = me.role === 'admin' ? '👑 管理员 · 全员统计'
      : me.role === 'leader' ? '🛡️ 组长 · 全员统计' : '🙋 ' + (me.name || '我') + ' · 我的质检';
    if (isMgr){ $('tabs').style.display = ''; $('btnRegister').style.display = ''; $('btnSync').style.display = ''; }
    await load();
  }catch(e){
    console.warn(e); toast('初始化失败，请刷新重试');
  }finally{
    qcHideBoot();   // 无论成功失败都撤掉加载占位，绝不白屏
  }
})();

/* 2026-11-03 修复「取图 401 / 同步失败：没有同步权限」：
   accessToken 原来只在页面打开时取一次，工作台挂机超过 1 小时 JWT 就过期了，
   之后点「图 查看」「⟳ 同步飞书」全部 401。
   现在每次用时现取一次（getSession 会用 refresh_token 自动续期），挂多久都不会再过期 */
async function freshToken(){
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if (session && session.access_token) accessToken = session.access_token;
  }catch(e){ console.warn('freshToken', e); }
  return accessToken;
}

async function load(){
  let q = sb.from('qc_records')
    // 用 * 而不是写死列名：飞书表以后加列（截图链接、扣罚确认人等）页面不会因缺列报错
    .select('*')
    .order('qc_date', { ascending: false });
  const [from, to] = rangeOf($('rangeSel').value);
  if (from) q = q.gte('qc_date', from);
  if (to) q = q.lte('qc_date', to);
  if (!isMgr) q = q.eq('staff_name', me.name);
  const { data, error } = await q;
  if (error){
    console.warn('qc_records 读取失败', error.message);
    // 2026-10-31：不再弹模态框（之前关不掉还挡页面），改为页面顶部可关闭的提示条
    const m = error.message || '';
    let tip = '质检数据读取失败：' + m;
    if (/column .* does not exist/.test(m)) tip = '质检表还是旧结构（缺新列）。请在 Supabase SQL Editor 执行「质检重做」SQL 一步重建，之后刷新本页。';
    else if (/relation .* does not exist/.test(m) || /schema cache/i.test(m)) tip = '质检表还没建好。请在 Supabase SQL Editor 执行「质检重做」SQL 建表，之后刷新本页。';
    showErr(tip);
    rows = []; renderAll(); return;
  }
  rows = data || [];
  hideErr();
  renderAll();
}

let _errTimer = null;
function showErr(msg){
  const bar = $('errBar');
  bar.innerHTML = '<span>⚠️ ' + esc(msg) + '</span><button class="x" title="关闭" onclick="hideErr()">✕</button>';
  bar.style.display = '';
}
function hideErr(){ const b = $('errBar'); if (b){ b.style.display = 'none'; b.innerHTML = ''; } }
window.hideErr = hideErr;

/* ---------- 渲染 ---------- */
function renderAll(){
  renderKpis();
  if (isMgr){
    renderPending();
    renderRank(); renderTrend(); renderType(); renderDetail();
    ['rank','trend','type','detail'].forEach(t => {
      $('panel-' + t).style.display = (t === tab ? '' : 'none');
    });
    $('panel-mine').style.display = 'none';
  } else {
    ['rank','trend','type','detail'].forEach(t => { $('panel-' + t).style.display = 'none'; });
    $('panel-mine').style.display = '';
    $('pendingBox').style.display = 'none';
    renderMine();
  }
}

/* ---------- 证据截图：图片本体留在飞书，工作台只出按钮，不占存储 ----------
   两种来源都支持：
   1) 飞书表填了图片链接（文本）→ 直接新窗口打开
   2) 飞书表用「附件」列拖了图 → 同步时把 evidence 写成「附件×N」，
      点按钮走后端 qc-evidence 现场向飞书要一次临时地址再跳转（图片不落工作台） */
const EVIDENCE_PROXY = 'https://icfgireprowcqwdodfqx.supabase.co/functions/v1/qc-evidence';
const EV_KEYS = ['evidence','evidence_url','screenshot','screenshot_url','截图链接','截图','image_url','attach_url'];
function evUrls(r){
  let v = '';
  for (const k of EV_KEYS){ if (r && r[k]){ v = String(r[k]); break; } }
  if (!v) return [];
  // 支持一格填多个链接（换行 / 空格 / 逗号 / 顿号分隔）
  return v.split(/[\s,，;；、]+/).filter(x => /^https?:\/\//i.test(x)).slice(0, 6);
}
function evHasAttach(r){ return /^附件/.test(String((r && r.evidence) || '')); }
function evCount(r){ return evUrls(r).length + (evHasAttach(r) ? 1 : 0); }
function evCell(r){
  const urls = evUrls(r);
  if (urls.length){
    return urls.map((u,i) =>
      '<a class="ev" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer" title="在新窗口打开截图"'
      + ' data-qcid="'+esc(r.id)+'">'
      + '图' + (urls.length > 1 ? ' ' + (i+1) : '') + '</a>'
    ).join(' ');
  }
  if (evHasAttach(r)){
    const id = r.feishu_record_id || r.id || '';
    // 2026-11-02：改开同域查看器 qc-view.html（网关禁止 Edge Function 返回 HTML，查看器放工作台域名下）
    // 2026-11-03：不再把 token 焊死在链接里（挂机 1 小时必 401）→ 点的时候现取新 token 再开窗
    return '<a class="ev" href="qc-view.html?id='+encodeURIComponent(id)
      + '" data-evid="'+encodeURIComponent(id)
      + '" data-qcid="'+esc(r.id)
      + '" target="_blank" rel="noopener noreferrer" title="在新窗口打开截图">图 查看</a>';
  }
  return '<span style="color:#cbd5e1;">—</span>';
}

/* 2026-11-03 方案B：看图留痕——qc-view 关闭时把停留秒数写进 evidence_views，
   这里汇总成「看了几次/最长几秒」；没打开过图或打开不到 8 秒的标黄提醒 */
function evTrail(r){
  if (!evCount(r)) return '';
  const v = Array.isArray(r.evidence_views) ? r.evidence_views : [];
  const n = v.length;
  if (!n) return '<span class="trail warn">截图还没打开过</span>';
  const maxSec = v.reduce((m,x) => Math.max(m, Number(x && x.sec) || 0), 0);
  const low = maxSec < 8;
  return '<span class="trail' + (low ? ' warn' : '') + '">'
    + '看图 ' + n + ' 次 · 最长 ' + maxSec + ' 秒' + (low ? ' · ⚠ 偏短' : '') + '</span>';
}

/* 客服确认：只能确认自己花名的记录（RPC 里二次校验），确认后才能提交日报 */
async function qcConfirm(ids){
  if (!ids || !ids.length) return;
  try{
    const { data, error } = await sb.rpc('qc_confirm_staff', { p_ids: ids, p_note: null });
    if (error) throw error;
    (ids || []).forEach(id => { delete expanded[id]; delete readOK[id]; });
    toast('已确认 ' + (data || 0) + ' 条');
    qcGateRefresh();
    await load();
  }catch(e){
    console.warn(e);
    toast('确认失败：' + (e.message || e) + '（若提示函数不存在，请先在 Supabase 跑 v4 SQL）');
  }
}
window.qcConfirm = qcConfirm;
function qcGateRefresh(){ try{ if (window.parent && window.parent !== window && window.parent.qcGateReload) window.parent.qcGateReload(); }catch(e){} }

function renderMine(){

    : '<div class="mine-tip">✅ 全部确认完成，可以离开本页、提交日报了</div>';
  const body = !rows.length ? emptyBox('这段时间没有你的质检记录 👍')
    : '<div class="tb-wrap"><table class="tb"><thead><tr>'

      + '<th>问题与正确做法</th><th style="width:60px;">证据</th><th style="width:104px;">查看 / 确认</th>'

/* 未点开前只显示这句，避免不点也能看到内容、直接形式化确认 */
function mineRow(r){
  const open = !!expanded[r.id];
  const confirmed = !!r.staff_confirmed_at;
  const id = esc(r.id);
  const head = '<tr' + (open ? ' style="background:#f8fbff;"' : '') + '>'
    + '<td>' + (r.qc_date || '-') + '</td>'
    + '<td>' + esc(r.issue_type || '-') + '</td>'
    + '<td><span class="sev ' + (SEV_CLASS[r.severity] || 's1') + '">' + esc(r.severity || '-') + '</span></td>'
    + '<td class="det" style="color:' + (open ? '#475569' : '#94a3b8') + ';">'
    + (open ? (esc(r.detail || '') || '（无描述）') : '🔒 点「展开查看」看问题和正确做法')
    + '</td>'
    + '<td>' + (open ? evCell(r) : '<span style="color:#cbd5e1;">—</span>') + '</td>'
    + '<td>' + (confirmed
        ? '<span class="cfm done">已确认 ' + esc(String(r.staff_confirmed_at).slice(5, 10)) + '</span>'
        : (open
            ? confirmBtn(r)
            : '<button class="cfm-btn o" onclick="qcExpand(\'' + id + '\')">展开查看</button>'))
    + '</td></tr>';
  if (!open) return head;
  return head + '<tr><td colspan="6" style="padding:0 10px 12px;background:#f8fbff;">'
    + '<div style="border:1px solid #e2e8f0;border-radius:9px;padding:10px 12px;background:#fff;">'
    + '<div class="iss"><span>✘ 问题点</span>' + esc(r.detail || '（无描述）') + '</div>'
    + custIdBlock(r)
    + guidanceBlock(r)
    + (String(r.evidence || '').trim() ? '<div style="margin-top:8px;font-size:11.5px;color:#64748b;">证据截图：' + evCell(r) + evTrail(r)
        + '（' + (evCount(r) ? '必须点开看一遍，看完才解锁确认' : '对照着看当时的聊天记录') + '）</div>' : '')
    + (r.note ? '<div style="margin-top:7px;font-size:11.5px;color:#94a3b8;">备注：' + esc(r.note) + '</div>' : '')
    + '<div style="margin-top:9px;display:flex;align-items:center;gap:10px;">'
    + (confirmed ? '<span class="cfm done">已确认</span>' : confirmBtn(r))
    + '<button class="cfm-btn ghost" onclick="qcCollapse(\'' + id + '\')">收起</button>'
    + (hintView(r) ? '<span style="font-size:11.5px;color:#b45309;">' + hintView(r) + '</span>' : '')
    + '</div></div></td></tr>';
}

/* 确认按钮旁的提示：有截图未点开 → 引导看图；点了图/没截图 → 倒计时 */
function hintView(r){
  if (readReady(r)) return '';
  if (evCount(r) > 0 && !viewed[r.id] && !evViewedBefore(r)) return '📷 请先点开证据截图看一遍，看完 5 秒后才能确认';
  return '看清楚再确认（还有 ' + readLeft(r) + ' 秒）';
}

/* 库里已有看图记录也算看过（页面刷新后 viewed 内存会清空，靠 evidence_views 兜底；
   2026-11-03 晚：否则客服之前点开过图、刷新页面后按钮又被锁死） */
function evViewedBefore(r){
  const v = Array.isArray(r.evidence_views) ? r.evidence_views : [];
  return v.length > 0;
}

function readReady(r){
  // 2026-11-03 方案A：有截图的记录必须点开过图（本次会话点过 或 库里有看图记录），光展开文字不算
  if (evCount(r) > 0 && !viewed[r.id] && !evViewedBefore(r)) return false;
  return (readOK[r.id] || 0) <= Date.now();
}
function readLeft(r){ return Math.max(0, Math.ceil(((readOK[r.id] || 0) - Date.now()) / 1000)); }
function confirmBtn(r){
  const ok = readReady(r);
  return '<button class="cfm-btn' + (ok ? '' : ' off') + '"' + (ok ? (' onclick="qcConfirm([\'' + esc(r.id) + '\'])">我已知晓</button>') : ' disabled>我已知晓</button>');
}
function qcExpand(id){
  expanded[id] = true;
  const r = rows.find(x => String(x.id) === String(id));
  if (!r || evCount(r) === 0){
    readOK[id] = Date.now() + 3000;      // 没截图的：展开停留 3 秒即可确认（原逻辑）
    setTimeout(() => { try{ renderMine(); }catch(e){} }, 3100);
  }
  // 有截图的：不解锁，等 markViewed（点开截图）后开 5 秒倒计时
  renderMine();
}
/* 2026-11-03 方案A：点开任一证据截图 → 5 秒后解锁该条的「我已知晓」 */
function markViewed(id){
  if (!id) return;
  viewed[id] = true;
  readOK[id] = Math.max(readOK[id] || 0, Date.now() + 5000);
  renderMine();
  setTimeout(() => { try{ renderMine(); }catch(e){} }, 5100);
}
window.qcMarkViewed = markViewed;
function qcCollapse(id){ delete expanded[id]; renderMine(); }
window.qcExpand = qcExpand; window.qcCollapse = qcCollapse;

/* 供父页「去质检页」后定位第一条待确认 */
window.qcFocusPending = function(){
  const first = rows.find(r => !r.staff_confirmed_at);
  if (!first) return;
  qcExpand(first.id);
  const el = document.querySelector('#panel-mine table.tb tbody tr');
  if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
};

/* 把自己还有几条没确认告诉父页 → 父页锁导航 */
function reportPending(n){
  try{
    if (window.parent && window.parent !== window && typeof window.parent.qcSetPending === 'function'){
      window.parent.qcSetPending(n);
    }
  }catch(e){}
}

function guidanceBlock(r){
  const g = String(r.guidance || '').trim();
  if (!g) return '';
  return '<div class="gd"><span>✔ 正确做法</span>' + esc(g) + '</div>';
}

/* 2026-11-02 新增：客户ID（存于飞书原始行 raw['客户ID']）→ 客服复制去前端查完整聊天记录 */
function custId(r){
  const raw = r && r.raw;
  if (!raw) return '';
  const v = raw['客户ID'] || raw['客户Id'] || raw['买家ID'] || raw['customer_id'] || '';
  return String(v || '').trim();
}
function copyCustId(id){
  const r = rows.find(x => x.id === id);
  const v = custId(r);
  if (!v){ toast('这条记录没有客户ID'); return; }
  const done = () => toast('✅ 已复制 ' + v + '，去前端粘贴查聊天记录');
  const fail = () => toast('复制失败，请手动长按选择复制');
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(v).then(done).catch(() => fallbackCopy(v, done, fail));
  } else fallbackCopy(v, done, fail);
}
function fallbackCopy(text, done, fail){
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    ok ? done() : fail();
  }catch(e){ fail(); }
}
window.copyCustId = copyCustId;
function custIdBlock(r){
  const v = custId(r);
  if (!v) return '';
  return '<div style="margin-top:8px;font-size:12px;color:#334155;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">'
    + '<span>客户ID：</span>'
    + '<code style="background:#f1f5f9;border:1px solid #e2e8f0;padding:2px 9px;border-radius:6px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;">' + esc(v) + '</code>'
    + '<button onclick="copyCustId(\'' + esc(r.id) + '\')" style="border:1px solid #10b981;background:#ecfdf5;color:#047857;border-radius:6px;padding:3px 11px;font-size:11.5px;cursor:pointer;">📋 复制去前端查聊天</button>'
    + '</div>';
}
function confirmCell(r){
  if (r.staff_confirmed_at){
    const d = String(r.staff_confirmed_at).slice(5, 10);
    return '<span class="cfm done">已确认 ' + esc(d) + '</span>';
  }
  return '<button class="cfm-btn" onclick="qcConfirm([\'' + esc(r.id) + '\'])">我已知晓</button>';
}

function emptyBox(msg){
  return '<div class="empty">'+(msg || '这段时间暂无质检记录')+'</div>';
}

/* ---------- 导出 ---------- */
function exportCsv(){
  const list = filteredDetail();
  if (!list.length){ toast('没有可导出的记录'); return; }
  const head = ['日期','客服','问题类型','严重度','扣罚金额','客户ID','问题描述','备注','证据链接','质检人'];
  const esc2 = v => { const s = (v==null?'':String(v)); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const lines = [head.join(',')].concat(list.map(r => [r.qc_date,r.staff_name,r.issue_type,r.severity,r.amount,custId(r),r.detail,r.note,(evUrls(r).concat(evHasAttach(r)?['附件']:[])).join(' '),r.qc_name].map(esc2).join(',')));
  const blob = new Blob(['\ufeff'+lines.join('\r\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '质检明细_' + ymd(new Date()) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  toast('已导出 ' + list.length + ' 条');
}

/* ---------- 事件 ---------- */
$('rangeSel').addEventListener('change', () => {
  const custom = $('rangeSel').value === 'custom';
  $('dFrom').style.display = custom ? '' : 'none';
  $('dSep').style.display  = custom ? '' : 'none';
  $('dTo').style.display   = custom ? '' : 'none';
  if (custom){ const [f,t] = rangeOf('thisMonth'); if(!$('dFrom').value) $('dFrom').value = f; if(!$('dTo').value) $('dTo').value = t; }
  load();
});
$('dFrom').addEventListener('change', load);
$('dTo').addEventListener('change', load);
$('btnRefresh').addEventListener('click', load);
$('btnRegister').addEventListener('click', () => window.open(REGISTER_URL, '_blank', 'noopener'));

/* 2026-11-02 新增：手动触发一次飞书同步（走 qc-sync Edge Function，管理员 JWT 鉴权）
   飞书登记完点一下即可进工作台；只更新有变化的部分，重复点没有副作用 */
async function syncNow(){
  const b = $('btnSync');
  b.disabled = true; b.textContent = '⟳ 同步中…';
  try{
    await freshToken();   // 2026-11-03：现取新 token，挂机再久也不会「没有同步权限」
    const r = await fetch(SUPABASE_URL + '/functions/v1/qc-sync', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + accessToken },
    });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) {
      toast('✅ 已同步 ' + (j.saved ?? 0) + ' 条（飞书共 ' + (j.fetched ?? 0) + ' 条）');
      await load();
    } else {
      toast('⚠️ 同步失败：' + (j.error || ('HTTP ' + r.status)));
      console.warn('qc-sync', r.status, j);
    }
  }catch(e){
    toast('⚠️ 同步失败：' + e.message);
  }finally{
    b.disabled = false; b.textContent = '⟳ 同步飞书';
  }
}
$('btnSync').addEventListener('click', syncNow);

/* 2026-11-03：点「图 查看」时现取新 token 再开查看器
   （旧实现把页面打开那一刻的 token 焊死在 href 里，挂机超 1 小时后 qc-evidence 必 401）
   注意：先在点击瞬间同步 window.open('about:blank') 占住弹窗位（拿 token 有 await，
   事后才 open 会被浏览器弹窗拦截器拦掉），拿到 token 后再导航过去
   ★ 2026-11-03 晚修复：任何证据截图（外链/查看器）点开都要 markViewed——
     之前这个监听器只认 data-evid 且没接 markViewed，客服点开图也不解锁「我已知晓」 */
document.addEventListener('click', async function(e){
  const ev = e.target && e.target.closest ? e.target.closest('a.ev') : null;
  if (!ev) return;
  const qcid = ev.dataset.qcid;
  if (qcid) markViewed(qcid);          // 方案A：点开截图 → 5 秒后解锁该条确认
  if (!ev.dataset.evid) return;        // 外链截图：默认新窗口打开，不拦截
  e.preventDefault();
  const id = ev.dataset.evid || '';
  const w = window.open('about:blank', '_blank');
  const tk = await freshToken();
  if (!tk || !w){
    if (w) w.close();
    toast('⚠️ 登录已过期，请刷新工作台后重试');
    return;
  }
  // &v=时间戳：防查看器页被旧缓存卡住（2026-11-03 茹姐反馈「还是旧工具条」就是这么来的）
  w.location = 'qc-view.html?id=' + id + '&t=' + encodeURIComponent(tk) + '&v=' + Date.now();
});
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  tab = b.dataset.tab;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  renderAll();
}));
window.setQcMode = function(){ /* 兼容父页旧调用，新页面按登录身份自动判定 */ };
</script>
