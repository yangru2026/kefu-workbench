<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定轴混搭方案</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #e8e4df;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 24px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
}
.card {
  width: 440px;
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
}

.banner {
  background: linear-gradient(135deg, #7a8b7f 0%, #8fa093 50%, #a3b5a7 100%);
  padding: 28px 24px;
  text-align: center;
}
.banner .tag {
  display: inline-block;
  background: rgba(255,255,255,0.2);
  color: #fff;
  padding: 3px 12px;
  border-radius: 16px;
  font-size: 11px;
  font-weight: 600;
  margin-bottom: 8px;
}
.banner h1 {
  color: #fff;
  font-size: 24px;
  font-weight: 800;
}
.banner h1 span { color: #f5e6c8; }
.banner .sub {
  color: rgba(255,255,255,0.8);
  font-size: 13px;
  margin-top: 6px;
}

.scheme-list {
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.scheme-item {
  border-radius: 12px;
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  background: #faf9f7;
  border: 1px solid #f0eeeb;
}
.scheme-item:nth-child(1) { background: #f5f3f0; }

.scheme-num {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #7a8b7f;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  flex-shrink: 0;
}

.scheme-info { flex: 1; }
.scheme-info .name {
  font-size: 14px;
  font-weight: 700;
  color: #555;
}
.scheme-info .desc {
  font-size: 11px;
  color: #aaa;
  margin-top: 2px;
}

.scheme-price {
  text-align: right;
}
.scheme-price .actual {
  font-size: 20px;
  font-weight: 800;
  color: #c45c4a;
}
.scheme-price .original {
  font-size: 11px;
  color: #ccc;
  text-decoration: line-through;
}
.plus-tag-inline {
  display: inline-block;
  background: #ea580c; color: #fff;
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 4px;
  font-weight: 600;
  margin-left: 4px;
}

.footer {
  background: #f5f3f0;
  padding: 14px 18px;
  text-align: center;
}
.footer .main {
  color: #5a6b5e;
  font-size: 13px;
  font-weight: 700;
}
.footer .sub {
  color: #aaa;
  font-size: 11px;
  margin-top: 3px;
}
</style>
</head>
<body>
<div class="card">
  <div class="banner">
    <div class="tag">定轴混搭</div>
    <h1>含定轴 <span>三档方案</span></h1>
    <div class="sub">1副定轴 ~ 3副定轴 均享满减80元</div>
  </div>

  <div class="scheme-list">
    <div class="scheme-item">
      <div class="scheme-num">1</div>
      <div class="scheme-info">
        <div class="name">1副定轴 + 2副普通</div>
        <div class="desc">定轴混搭入门方案</div>
      </div>
      <div class="scheme-price">
        <div class="actual">¥109.7</div>
        
      </div>
    </div>

    <div class="scheme-item">
      <div class="scheme-num">2</div>
      <div class="scheme-info">
        <div class="name">2副定轴 + 1副普通<span class="plus-tag-inline">+20元</span></div>
        <div class="desc">定轴混搭进阶方案</div>
      </div>
      <div class="scheme-price">
        <div class="actual">¥119.7</div>
        
      </div>
    </div>

    <div class="scheme-item">
      <div class="scheme-num">3</div>
      <div class="scheme-info">
        <div class="name">3副定轴<span class="plus-tag-inline">+30元</span></div>
        <div class="desc">全定轴尊享方案</div>
      </div>
      <div class="scheme-price">
        <div class="actual">¥129.7</div>
        
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="main">定轴款 & 普通款 混搭同享满减80元</div>
    <div class="sub">任意组合三副，到手立减</div>
  </div>
</div>
</body>
</html>
